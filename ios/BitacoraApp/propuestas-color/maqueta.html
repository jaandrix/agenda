<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>propuestas de color</title>
<!-- Maqueta de las pantallas Inicio y Calendario de la app nativa (3.1) para enseñar las propuestas de color de la 3.2.
     Uso: maqueta.html?p=actual|a|b&s=inicio|calendario (se renderiza con Chrome sin ventana, ver LEEME.md). -->
<style>
@font-face { font-family: P; src: url("../BitacoraWidgets/Fonts/Poppins-Regular.ttf"); font-weight: 400; }
@font-face { font-family: P; src: url("../BitacoraWidgets/Fonts/Poppins-Medium.ttf"); font-weight: 500; }
@font-face { font-family: P; src: url("../BitacoraWidgets/Fonts/Poppins-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: P; src: url("../BitacoraWidgets/Fonts/Poppins-Bold.ttf"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 390px; height: 100vh; overflow: hidden; }
body { font-family: P, sans-serif; color: var(--tinta); background: var(--fondo); -webkit-font-smoothing: antialiased; }
.pantalla { position: relative; width: 390px; height: 100vh; overflow: hidden; background: var(--fondo); }
.num { font-variant-numeric: tabular-nums; }

/* barra de estado */
.estado { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 50px; font-weight: 600; font-size: 16px; }
.isla { position: absolute; top: 11px; left: 132px; width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 6; }
.iconos-estado { display: flex; gap: 6px; align-items: center; }

/* degradado de portada */
.portada { position: absolute; left: 0; right: 0; top: -81px; height: 360px; background: var(--degradado); }
.cuerpo { position: relative; padding: 59px 16px 0; }

/* cabecera de marca */
.marca { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.logo { width: 26px; height: 26px; border-radius: 7.3px; background: var(--oscuro); position: relative; }
.logo b { position: absolute; left: 5px; top: -2px; font-weight: 700; font-size: 19px; color: #F4F4F2; }
.logo i { position: absolute; left: 16.5px; top: 14.5px; width: 4px; height: 4px; border-radius: 50%; background: var(--naranja); }
.marca .nombre { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
.marca .esp { flex: 1; }
.tiempo { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; margin-right: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--tarjeta); box-shadow: inset 0 0 0 1px var(--filo); display: grid; place-items: center; }
.saludo { margin-top: 12px; }
.saludo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.25; }
.saludo p { font-size: 13px; color: var(--tinta2); margin-top: 2px; }

/* semana */
.semana { margin-top: 24px; background: var(--tarjeta); border-radius: 22px; box-shadow: 0 10px 22px rgba(0,0,0,.09), inset 0 0 0 1px var(--filo); padding: 12px 4px 8px; }
.semana .cab { display: flex; padding: 0 12px; height: 36px; align-items: center; font-weight: 600; font-size: 15px; }
.dias { display: flex; gap: 2px; margin-top: 4px; }
.dia { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 16px; }
.dia .l { font-size: 12px; color: var(--tinta3); }
.dia .n { font-size: 15px; }
.dia.pasado .n { color: var(--tinta2); }
.dia.hoy .n { color: var(--naranjaP); font-weight: 600; }
.dia.sel { background: var(--sel); }
.dia.sel .l { color: var(--tinta2); }
.puntos { display: flex; gap: 3px; height: 5px; }
.puntos i { width: 4.5px; height: 4.5px; border-radius: 50%; }

/* ahora. */
.oscura { margin-top: 24px; background: var(--oscuro); color: #F4F4F2; border-radius: 22px; padding: 16px; box-shadow: 0 10px 18px rgba(0,0,0,.26); position: relative; overflow: hidden; }
.oscura .et { color: var(--naranja); font-weight: 600; font-size: 12px; }
.oscura .fila { display: flex; gap: 12px; align-items: baseline; margin-top: 8px; }
.oscura .h { font-size: 28px; font-weight: 600; line-height: 1; }
.oscura .t { font-size: 15px; font-weight: 600; }
.oscura .d { font-size: 13px; color: rgba(244,244,242,.56); }
.oscura .filete { height: 1px; background: rgba(244,244,242,.08); margin-top: 12px; }
.oscura .poste { font-size: 12px; font-weight: 600; color: rgba(244,244,242,.56); margin-top: 8px; }
.oscura .poste span { color: var(--naranja); margin-left: 6px; }
.oscura .bus { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 13px; color: rgba(244,244,242,.56); }
.oscura .bus b { color: #F4F4F2; font-weight: 700; }
.ic-trans { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }

/* sección */
.etseccion { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; margin-top: 24px; margin-bottom: 8px; }
.etseccion .e { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: var(--tinta3); text-transform: uppercase; }
.etseccion .a { font-size: 12px; font-weight: 600; color: var(--naranjaP); }

/* filas de inicio */
.lista { display: flex; flex-direction: column; gap: 8px; }
.fi { display: flex; align-items: center; min-height: 52px; padding: 4px 12px 4px 4px; background: var(--tarjeta); border-radius: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05), inset 0 0 0 1px var(--filo); }
.fi .izq { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.fi .txt { flex: 1; min-width: 0; }
.fi .ti { font-size: 14px; font-weight: 500; }
.fi .de { font-size: 12px; color: var(--tinta2); }
.fi .ho { font-size: 12px; font-weight: 500; color: var(--tinta2); }
.fi.hecha .ti { color: var(--tinta3); text-decoration: line-through; }
.fi .de.antes { color: var(--naranjaP); }
.casilla { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--filoF); background: var(--tarjeta); }
.casilla.on { background: var(--oscuro); box-shadow: none; display: grid; place-items: center; }
.pto { width: 8px; height: 8px; border-radius: 50%; }
.sq { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }

/* barra flotante */
.barra { position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 12px; z-index: 4; }
.pestanas { flex: 1; height: 60px; border-radius: 30px; padding: 5px; display: flex; gap: 2px; background: var(--barra); box-shadow: 0 10px 22px rgba(0,0,0,.09), inset 0 0 0 .5px rgba(255,255,255,.6); }
.pes { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--tinta2); border-radius: 25px; }
.pes.on { flex: none; padding: 0 13px; background: var(--pildora); color: var(--pildoraTinta); box-shadow: 0 2px 6px rgba(0,0,0,.07); font-size: 13px; font-weight: 600; }
.apuntar { width: 70px; height: 60px; border-radius: 30px; background: var(--oscuro); display: grid; place-items: center; box-shadow: 0 10px 18px rgba(0,0,0,.26); }
.velo-abajo { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, transparent, var(--fondo) 70%); z-index: 3; }
.indicador { position: absolute; bottom: 8px; left: 128px; width: 134px; height: 5px; border-radius: 3px; background: #111315; z-index: 6; }

/* calendario */
.cabpag { display: flex; justify-content: flex-end; margin-top: 4px; }
.seg { width: 156px; display: flex; gap: 2px; padding: 4px; border-radius: 22px; background: var(--segFondo); }
.seg div { flex: 1; height: 36px; border-radius: 18px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--tinta2); }
.seg .on { background: var(--oscuro); color: #F4F4F2; }
.tit { margin-top: 12px; }
.tit h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.tit p { font-size: 13px; color: var(--tinta2); }
.mes { margin-top: 20px; background: var(--tarjeta); border-radius: 24px; padding: 8px 6px; box-shadow: 0 10px 22px rgba(0,0,0,.09), inset 0 0 0 1px var(--filo); }
.mes .cab { display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 4px; }
.mes .cab .m { flex: 1; padding-left: 10px; font-size: 15px; font-weight: 600; }
.redondo { width: 30px; height: 30px; border-radius: 50%; background: var(--sutil); display: grid; place-items: center; }
.ini { display: flex; gap: 2px; margin-top: 8px; }
.ini div { flex: 1; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: var(--tinta3); }
.rej { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.rej .f { display: flex; gap: 2px; }
.cd { flex: 1; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; font-size: 15px; }
.cd.pasado { color: var(--tinta2); }
.cd.hoy { color: var(--naranjaP); font-weight: 600; }
.cd.sel { background: var(--sel); font-weight: 600; }
.cd.finde { background: var(--finde); }
.cd.finde.sel { background: var(--sel); }
.agcab { display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; padding: 0 4px; }
.agcab .d { font-size: 15px; font-weight: 600; }
.agcab .c { font-size: 12px; color: var(--tinta2); }
.hilo { position: relative; display: flex; flex-direction: column; gap: 12px; }
.hilo::before { content: ""; position: absolute; left: 50%; top: 20px; bottom: 20px; width: 1.5px; background: var(--filoF); }
.tc { position: relative; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px; border-radius: 20px; background: var(--tarjeta); box-shadow: 0 4px 12px rgba(0,0,0,.05), inset 0 0 0 1px var(--filo); }
.tc .txt { flex: 1; }
.tc .ti { font-size: 15px; font-weight: 600; }
.tc .de { font-size: 12px; color: var(--tinta2); }
.bh { width: 52px; height: 40px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--tarjeta); flex: none; }
.bh .a { font-size: 12px; font-weight: 500; line-height: 1.2; }
.bh .b { font-size: 11px; font-weight: 600; color: var(--tinta3); line-height: 1.1; }
.ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--sutil); }
.ic.peq { width: 26px; height: 26px; border-radius: 8px; }
.tc.tarea { background: var(--fondo); box-shadow: none; border: 1px dashed var(--filoF); }
.p-b .dia.sel .l { color: rgba(244,244,242,.6); }
.p-b .dia.sel .n { color: #FF8A6E; }
.etq { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: var(--tinta3); text-transform: uppercase; padding: 0 4px; margin-top: 4px; }
</style>
</head>
<body>
<div class="pantalla" id="p"></div>
<script>
const q = new URLSearchParams(location.search);
const P = q.get('p') || 'actual', S = q.get('s') || 'inicio';

// Puntos por tipo y tintes. «actual» es la 3.1 tal cual (Lienzo.swift).
const TEMAS = {
  actual: {
    v: { fondo: '#F2F3F5', tarjeta: '#FFFFFF', sutil: '#E8E9EC', tinta: '#111315', tinta2: '#5F6672', tinta3: '#9AA0AA',
         naranja: '#FF6B4A', naranjaP: '#E8572F', oscuro: '#111315', filo: 'rgba(17,19,21,.06)', filoF: 'rgba(17,19,21,.12)',
         sel: '#E8E9EC', finde: 'transparent', segFondo: '#FFFFFF', pildora: '#FFFFFF', pildoraTinta: '#111315',
         barra: 'rgba(232,233,236,.92)',
         degradado: 'linear-gradient(to bottom, rgba(255,107,74,.95) 0%, rgba(255,154,122,.55) 38%, rgba(242,243,245,0) 100%)' },
    punto: { evento: '#FF6B4A', tarea: '#111315', estudio: '#4A72E8', cumple: '#E9A21F', viaje: '#8A63D2', dinero: '#23986A' },
    tinte: null, relleno: null
  },
  // A, «marfil.»: lienzo cálido, el color en piezas pequeñas (cuadraditos de tipo, bloques de hora, día elegido).
  a: {
    v: { fondo: '#F6F1EA', tarjeta: '#FFFFFF', sutil: '#EEE7DE', tinta: '#111315', tinta2: '#635E58', tinta3: '#A29B92',
         naranja: '#FF6B4A', naranjaP: '#E8572F', oscuro: '#111315', filo: 'rgba(60,40,20,.07)', filoF: 'rgba(60,40,20,.14)',
         sel: '#FFE9E1', finde: '#FAF6F1', segFondo: '#FFFFFF', pildora: '#FFFFFF', pildoraTinta: '#111315',
         barra: 'rgba(238,231,222,.94)',
         degradado: 'linear-gradient(to bottom, rgba(255,107,74,.95) 0%, rgba(255,170,128,.6) 36%, rgba(255,214,186,.35) 62%, rgba(246,241,234,0) 100%)' },
    punto: { evento: '#FF6B4A', tarea: '#111315', estudio: '#5B7FE6', cumple: '#E3A23A', viaje: '#9070D6', dinero: '#2E9E72' },
    tinte: { evento: '#FFE9E1', tarea: '#EFEAE3', estudio: '#E6ECFC', cumple: '#FBF0D7', viaje: '#EFE8FA', dinero: '#E0F2E8' },
    relleno: null
  },
  // B, «pastel.»: lienzo neutro algo más luminoso y las tarjetas de eventos rellenas del pastel de su tipo.
  b: {
    v: { fondo: '#F3F4F7', tarjeta: '#FFFFFF', sutil: '#E9EBEF', tinta: '#111315', tinta2: '#5D6470', tinta3: '#9AA0AA',
         naranja: '#FF6B4A', naranjaP: '#E8572F', oscuro: '#111315', filo: 'rgba(17,19,21,.05)', filoF: 'rgba(17,19,21,.12)',
         sel: '#111315', finde: 'transparent', segFondo: '#FFFFFF', pildora: '#FFE4DB', pildoraTinta: '#C2441F',
         barra: 'rgba(233,235,239,.94)',
         degradado: 'linear-gradient(to bottom, rgba(255,107,74,.92) 0%, rgba(255,160,130,.55) 34%, rgba(255,205,190,.3) 58%, rgba(243,244,247,0) 100%)' },
    punto: { evento: '#FF6B4A', tarea: '#111315', estudio: '#4A72E8', cumple: '#E3A21F', viaje: '#8A63D2', dinero: '#23986A' },
    tinte: { evento: '#FFE4DB', tarea: '#E9EBEF', estudio: '#DDE6FF', cumple: '#FFF0C9', viaje: '#EAE2FF', dinero: '#D8F1E4' },
    // Relleno de tarjeta y tinta de su segunda línea (más oscura del mismo tono, ≥4,5:1).
    relleno: { evento: ['#FFE9E2', '#A8401F'], estudio: ['#E3EAFF', '#2F4FA8'], cumple: ['#FFF2D1', '#80590A'],
               viaje: ['#EEE7FF', '#5B3FA0'], dinero: ['#DDF3E7', '#1C6E4D'] }
  }
};
const T = TEMAS[P];
document.documentElement.className = 'p-' + P;
for (const [k, val] of Object.entries(T.v)) document.documentElement.style.setProperty('--' + k, val);

// Iconos sólidos geométricos (aproximación del catálogo Icono).
const ICO = {
  inicio: c => `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="${c}" d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>`,
  plan: c => `<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="${c}"/><path d="m7.5 12 3 3 6-6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  calendario: c => `<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4" fill="${c}"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="${c}"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="${c}"/><rect x="6" y="11" width="12" height="2" rx="1" fill="#fff" opacity=".85"/></svg>`,
  menu: c => `<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="${c}"/><rect x="13" y="3" width="8" height="8" rx="2.5" fill="${c}"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="${c}"/><rect x="13" y="13" width="8" height="8" rx="4" fill="${c}"/></svg>`,
  social: c => `<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="${c}"/><path fill="${c}" d="M3.5 21a8.5 8 0 0 1 17 0z"/></svg>`,
  eventos: c => `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="${c}" d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/></svg>`,
  estudios: c => `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="${c}" d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>`,
  futbol: c => `<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="${c}"/><path fill="#fff" opacity=".9" d="m12 7.5 4 2.9-1.5 4.7h-5L8 10.4z"/></svg>`,
  bus: c => `<svg width="15" height="15" viewBox="0 0 100 100"><path fill="${c}" fill-rule="evenodd" d="M24 10h52a14 14 0 0 1 14 14v47a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14V24a14 14 0 0 1 14-14zM22 26v22h56V26zM26 62a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm48 0a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM15 80h10v15H15zm60 0h10v15H75z"/></svg>`,
  check: () => `<svg width="12" height="12" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#F4F4F2" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  nube: c => `<svg width="16" height="16" viewBox="0 0 24 24"><path fill="${c}" d="M7 19a5 5 0 0 1-.6-10A6.5 6.5 0 0 1 19 10.5 4.3 4.3 0 0 1 18 19z"/></svg>`
};
const tinta = () => getComputedStyle(document.documentElement).getPropertyValue('--tinta').trim();
const tinta2 = () => getComputedStyle(document.documentElement).getPropertyValue('--tinta2').trim();

const ESTADO = `<div class="isla"></div><div class="estado"><span>9:41</span><span class="iconos-estado">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#111"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#111"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path fill="#111" d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.4A10.7 10.7 0 0 0 8 .3 10.7 10.7 0 0 0 .5 3.3l1.3 1.4A8.8 8.8 0 0 1 8 2.2zm0 3.7c1.4 0 2.7.5 3.6 1.4l1.3-1.4A7 7 0 0 0 8 4a7 7 0 0 0-4.9 1.9l1.3 1.4C5.3 6.4 6.6 5.9 8 5.9zm0 3.6c-.5 0-1 .2-1.3.5L8 11.5 9.3 10c-.3-.3-.8-.5-1.3-.5z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#111"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#111" opacity=".4"/></svg>
</span></div>`;

function barra(activa) {
  const ps = [['inicio', 'inicio'], ['plan', 'plan'], ['calendario', 'calendario'], ['menu', 'menú']];
  const on = P === 'b' ? '#C2441F' : tinta();
  return `<div class="velo-abajo"></div><div class="barra"><div class="pestanas">${ps.map(([id, t]) =>
    id === activa ? `<div class="pes on">${ICO[id](on)}<span>${t}</span></div>` : `<div class="pes">${ICO[id](tinta2())}</div>`).join('')}</div>
    <div class="apuntar"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#F4F4F2" stroke-width="3.6" stroke-linecap="round"/></svg></div></div>
    <div class="indicador"></div>`;
}

// Semana del 23 al 29 de noviembre de 2026; hoy, miércoles 25.
const TIPOS_DIA = { 23: ['evento', 'tarea'], 24: ['tarea'], 25: ['evento', 'tarea', 'estudio'], 26: ['estudio'], 27: ['cumple'],
  28: ['evento', 'viaje'], 29: ['viaje'], 2: ['tarea'], 4: ['evento'], 5: ['tarea', 'dinero'], 6: ['evento'], 9: ['tarea'], 10: ['estudio', 'tarea'],
  12: ['evento'], 13: ['dinero'], 14: ['evento', 'tarea'], 16: ['tarea'], 18: ['estudio'], 19: ['evento'], 20: ['tarea', 'evento'], 21: ['evento'] };
const puntos = (d, sel) => `<div class="puntos">${(TIPOS_DIA[d] || []).slice(0, 3).map(t => `<i style="background:${P === 'b' && sel && t === 'tarea' ? '#F4F4F2' : T.punto[t]}"></i>`).join('')}</div>`;

// Marca de tipo a la izquierda de una fila de Inicio: punto en «actual»; cuadradito tintado en A y B.
function marcaTipo(tipo) {
  if (!T.tinte) return `<div class="izq"><i class="pto" style="background:${T.punto[tipo]}"></i></div>`;
  const ico = { evento: 'eventos', estudio: 'estudios', cumple: 'social', viaje: 'eventos', dinero: 'eventos' }[tipo];
  const fondo = T.relleno ? '#FFFFFF' : T.tinte[tipo];
  return `<div class="izq"><div class="sq" style="background:${fondo}">${ICO[ico](T.punto[tipo])}</div></div>`;
}

function filaEvento(hora, titulo, detalle, tipo) {
  const r = T.relleno && T.relleno[tipo];
  const estilo = r ? `background:${r[0]};box-shadow:none` : '';
  const de = r ? `style="color:${r[1]}"` : '';
  return `<div class="fi" style="${estilo}">${marcaTipo(tipo)}<div class="txt"><div class="ti">${titulo}</div>${detalle ? `<div class="de" ${de}>${detalle}</div>` : ''}</div>${hora ? `<div class="ho num" ${de}>${hora}</div>` : ''}</div>`;
}
function filaTarea(hora, titulo, detalle, hecha, antes) {
  return `<div class="fi ${hecha ? 'hecha' : ''}"><div class="izq"><div class="casilla ${hecha ? 'on' : ''}">${hecha ? ICO.check() : ''}</div></div><div class="txt"><div class="ti">${titulo}</div>${detalle ? `<div class="de ${antes ? 'antes' : ''}">${detalle}</div>` : ''}</div>${hora ? `<div class="ho num">${hora}</div>` : ''}</div>`;
}

function inicio() {
  const letras = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
  const dias = letras.map((l, i) => {
    const d = 23 + i;
    const cls = ['dia', d < 25 ? 'pasado' : '', d === 25 ? 'hoy sel' : ''].join(' ');
    return `<div class="${cls}"><span class="l">${l}</span><span class="n num">${d}</span>${puntos(d, d === 25)}</div>`;
  }).join('');
  return `${ESTADO}<div class="portada"></div><div class="cuerpo">
    <div class="marca"><div class="logo"><b>b</b><i></i></div><span class="nombre">bitácora</span><span class="esp"></span>
      <span class="tiempo">${ICO.nube(tinta())}<span class="num">12°</span></span>
      <div class="avatar">${ICO.social('#9AA0AA')}</div></div>
    <div class="saludo"><h1>hola, alejandro.</h1><p>3 pendientes, 1 hecha.</p></div>
    <div class="semana"><div class="cab">noviembre.</div><div class="dias">${dias}</div></div>
    <div class="oscura">
      <div class="et">siguiente, en 40 min.</div>
      <div class="fila"><span class="h num">17:30</span><div><div class="t">clase de inglés</div><div class="d">academia, aula 3</div></div></div>
      <div class="filete"></div>
      <div class="poste">poste 742, plaza españa.<span>cambiar.</span></div>
      <div class="bus"><span class="ic-trans">${ICO.bus('#F4F4F2')}</span><span>bus <b>35</b>, en <b>4 min</b>; bus <b>32</b>, en <b>9 min</b>.</span></div>
    </div>
    <div class="etseccion"><span class="e">hoy</span><span class="a">ver el plan.</span></div>
    <div class="lista">
      ${filaTarea('09:00', 'revisar el correo', '', true)}
      ${filaEvento('', 'cumple de marta', 'cumple 29', 'cumple')}
      ${filaEvento('11:00', 'café con lucía', 'la tienda de la esquina', 'evento')}
      ${filaTarea('', 'llamar al banco', 'de antes.', false, true)}
      ${filaEvento('17:30', 'clase de inglés', 'academia, aula 3', 'estudio')}
      ${filaTarea('20:00', 'preparar la maleta', '2/5', false)}
    </div>
  </div>${barra('inicio')}`;
}

function bloqueHora(a, b, tipo) {
  const r = T.relleno && T.relleno[tipo];
  let fondo;
  if (r) fondo = 'rgba(255,255,255,.75)';
  else if (T.tinte) fondo = T.tinte[tipo];
  else fondo = hexA(T.punto[tipo], .13);
  return `<div class="bh" style="background:${fondo}"><span class="a num">${a}</span>${b ? `<span class="b num">${b}</span>` : ''}</div>`;
}
function hexA(h, a) { const n = parseInt(h.slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
  // tinte sobre blanco, como .background(tinte.opacity(0.13)) sobre Lienzo.tarjeta
  const m = c => Math.round(255 + (c - 255) * a); return `rgb(${m(r)},${m(g)},${m(b)})`; }

function tarjetaCal(hora, fin, titulo, detalle, tipo, icono) {
  const r = T.relleno && T.relleno[tipo];
  const estilo = r ? `background:${r[0]};box-shadow:none` : '';
  const de = r ? `style="color:${r[1]}"` : '';
  let izq, der = '';
  if (hora) {
    izq = bloqueHora(hora, fin, tipo);
    const fondoIc = r ? 'rgba(255,255,255,.75)' : (T.tinte ? T.tinte[tipo] : 'var(--sutil)');
    der = `<div class="ic peq" style="background:${fondoIc}">${ICO[icono](T.tinte ? T.punto[tipo] : tinta())}</div>`;
  } else {
    const fondo = r ? 'rgba(255,255,255,.75)' : (T.tinte ? T.tinte[tipo] : (tipo === 'cumple' ? 'rgba(255,107,74,.12)' : 'var(--sutil)'));
    const c = T.tinte ? T.punto[tipo] : (tipo === 'cumple' ? '#E8572F' : tinta());
    izq = `<div class="ic" style="background:${fondo}">${ICO[icono](c)}</div>`;
  }
  return `<div class="tc" style="${estilo}">${izq}<div class="txt"><div class="ti">${titulo}</div><div class="de" ${de}>${detalle}</div></div>${der}</div>`;
}
function tareaCal(hora, titulo) {
  return `<div class="tc tarea">${bloqueHora(hora, '', 'tarea')}<div class="txt"><div class="ti">${titulo}</div><div class="de">tarea</div></div><div class="ic peq">${ICO.plan(tinta())}</div></div>`;
}

function calendario() {
  const filas = [];
  let d = 1 - 6; // noviembre de 2026 empieza en domingo
  for (let f = 0; f < 6; f++) {
    const celdas = [];
    for (let i = 0; i < 7; i++, d++) {
      if (d < 1 || d > 30) { celdas.push(`<div class="cd" style="background:transparent"></div>`); continue; }
      const cls = ['cd', d < 25 ? 'pasado' : '', d === 25 ? 'hoy sel' : '', i >= 5 ? 'finde' : ''].join(' ');
      const selB = P === 'b' && d === 25 ? 'style="color:#FF8A6E"' : '';
      celdas.push(`<div class="${cls}"><span class="num" ${selB}>${d}</span>${puntos(d, d === 25)}</div>`);
    }
    filas.push(`<div class="f">${celdas.join('')}</div>`);
  }
  const chev = dir => `<div class="redondo"><svg width="12" height="12" viewBox="0 0 24 24"><path d="${dir === 'i' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}" stroke="${tinta()}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  return `${ESTADO}<div class="cuerpo" style="padding-top:59px">
    <div class="cabpag"><div class="seg"><div class="on">mes</div><div>semana</div></div></div>
    <div class="tit"><h1>calendario.</h1><p>noviembre de 2026.</p></div>
    <div class="mes"><div class="cab"><span class="m">noviembre</span>${chev('i')}${chev('d')}</div>
      <div class="ini">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(l => `<div>${l}</div>`).join('')}</div>
      <div class="rej">${filas.join('')}</div></div>
    <div class="agcab"><span class="d">hoy, miércoles 25 de noviembre.</span><span class="c num">5 cosas</span></div>
    <div class="etq" style="margin-top:12px">todo el día</div>
    <div class="hilo" style="margin-top:8px">${tarjetaCal('', '', 'cumple de marta', 'cumple 29', 'cumple', 'social')}</div>
    <div class="etq" style="margin-top:16px">con hora</div>
    <div class="hilo" style="margin-top:8px">
      ${tarjetaCal('11:00', '12:00', 'café con lucía', 'la tienda de la esquina', 'evento', 'eventos')}
      ${tarjetaCal('17:30', '19:00', 'clase de inglés', 'academia, aula 3', 'estudio', 'estudios')}
      ${tareaCal('20:00', 'preparar la maleta')}
    </div>
  </div>${barra('calendario')}`;
}

document.getElementById('p').innerHTML = S === 'calendario' ? calendario() : inicio();
</script>
</body>
</html>
