name: BitacoraApp
options:
  bundleIdPrefix: com.bitacora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Por defecto XcodeGen genera el .pbxproj en formato Xcode 16 (object
  # version 77), que el Xcode instalado en el runner de CI (15.4) no sabe
  # leer. Se fija al formato de Xcode 15 explícitamente para que sea
  # compatible con la versión de Xcode disponible en macos-latest.
  projectFormat: xcode15_3

configs:
  Debug: debug
  Release: release

# Ajustes comunes a los dos targets (app + extensión de widgets) — evita
# repetirlos dos veces y que se desincronicen.
settingGroups:
  unsignedBuild:
    # Todo se compila sin firma (unsigned) — AltStore/SideStore firman con
    # un Apple ID gratuito al instalarlo, no hace falta cuenta de pago.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1.0"
    # Subir esto en cada build ayuda a confirmar a simple vista (Ajustes
    # > General > VPN y gestión de dispositivos > la app) que el .ipa
    # instalado es el que se cree que es.
    CURRENT_PROJECT_VERSION: "7"

targets:
  BitacoraApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BitacoraApp
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: BitacoraApp/Info.plist
    # Esquema explícito: con el de la nativa en el proyecto, xcodebuild ya no inventa los que faltan.
    scheme: {}
    entitlements:
      path: BitacoraApp/BitacoraApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bitacora.app
    settings:
      base:
        PRODUCT_NAME: BitacoraApp
        PRODUCT_BUNDLE_IDENTIFIER: com.bitacora.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      groups:
        - unsignedBuild

  # La app nativa en SwiftUI (NATIVA.md). Otro bundle ID para instalarla junto a la envoltura web sin pisarla.
  BitacoraNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BitacoraNative
        excludes:
          - Info.plist
      - path: BitacoraWidgets/Fonts
        buildPhase: resources
        excludes:
          - Poppins-Black.ttf
          - Poppins-ExtraBold.ttf
    # Sin la clave `info`: XcodeGen reescribiría el Info.plist solo con lo básico y se perdían la pantalla de
    # arranque (la app salía con franjas negras), el esquema de URL, Face ID y las fuentes. Se usa tal cual.
    scheme:
      testTargets:
        - BitacoraNativeTests
    settings:
      base:
        PRODUCT_NAME: BitacoraNative
        INFOPLIST_FILE: BitacoraNative/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bitacora.nativa.dev
        # La compilación definitiva (com.bitacora.app, «Bitácora», bitacora://) los cambia desde el workflow.
        NOMBRE_APP: "Bitácora β"
        ESQUEMA_URL: bitacoradev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.10.1"
        ENABLE_PREVIEWS: YES
      groups:
        - unsignedBuild

  BitacoraNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BitacoraNativeTests
    dependencies:
      - target: BitacoraNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitacora.nativa.dev.tests
        GENERATE_INFOPLIST_FILE: YES
      groups:
        - unsignedBuild

# BitacoraWidgets (target de app-extension) queda fuera del build a
# propósito: SideStore/AltStore, al firmar con un Apple ID gratuito, no
# consiguen instalar la extensión de WidgetKit — falla siempre con
# "Failed to create app extension placeholder... extensionDictionary
# must be set in placeholder attributes", tanto registrando un App ID
# propio para la extensión como usando el perfil principal. Es una
# limitación conocida del sideloading gratuito con WidgetKit, no un bug
# de este proyecto. El código de los widgets (BitacoraWidgets/, Shared/)
# se queda intacto en el repo — para recuperarlos basta con volver a
# añadir aquí el target BitacoraWidgets (ver el historial de git) y la
# dependencia "embed: true" en BitacoraApp de más arriba.
