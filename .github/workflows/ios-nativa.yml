name: iOS - Bitácora nativa (tests y .ipa sin firmar)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-nativa.yml'
      # Si la web cambia sus datos sin tocar iOS, la prueba del contrato tiene que enterarse.
      - 'js/datos.js'
      - 'js/nucleo.js'
      - 'pruebas/contrato-ios.mjs'
      - 'pruebas/comprobar.mjs'
      - 'js/apuntar.js'
      - 'pruebas/apuntar-casos.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-nativa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nativa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/BitacoraApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrato de datos con la web
        working-directory: .
        run: node --test pruebas/contrato-ios.mjs

      - name: Comprobación general del repositorio
        working-directory: .
        run: node pruebas/comprobar.mjs

      # La app interpreta «apuntar.» con js/apuntar.js: si la web cambia, el banco dorado tiene que estar al día.
      - name: Banco dorado de apuntar con la web
        working-directory: .
        run: |
          node pruebas/apuntar-casos.mjs > /dev/null
          git diff --exit-code pruebas/apuntar-casos.json || { echo "pruebas/apuntar-casos.json no coincide con js/apuntar.js: ejecuta node pruebas/apuntar-casos.mjs"; exit 1; }

      - name: Usar el Xcode más reciente del runner
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Tests unitarios (simulador)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulador: $UDID"
          xcodebuild test \
            -project BitacoraApp.xcodeproj \
            -scheme BitacoraNative \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee tests.log | grep -E "(Test Case|error:|warning: .*BitacoraNative|Executed|TEST (SUCCEEDED|FAILED))" || true
          grep -q "TEST SUCCEEDED" tests.log

      - name: Subir las capturas de diseño
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-diseno
          path: ios/BitacoraApp/capturas/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Análisis estático
        run: |
          set -o pipefail
          xcodebuild analyze \
            -project BitacoraApp.xcodeproj \
            -scheme BitacoraNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-analyze \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee analyze.log | tail -5

      - name: Compilar Release (sin firma) con número de build único
        run: |
          set -o pipefail
          xcodebuild \
            -project BitacoraApp.xcodeproj \
            -scheme BitacoraNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | tail -5

      - name: Comprobar el .app y empaquetar el .ipa
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/BitacoraNative.app"
          test -x "$APP/BitacoraNative" || { echo "Falta el binario"; exit 1; }
          test -f "$APP/Assets.car" || { echo "Faltan los recursos"; exit 1; }
          for f in Regular Medium SemiBold Bold; do test -f "$APP/Poppins-$f.ttf" || { echo "Falta Poppins-$f"; exit 1; }; done
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "Falta PrivacyInfo.xcprivacy"; exit 1; }
          for f in apuntar apuntar-entorno apuntar-puente; do test -f "$APP/$f.js" || { echo "Falta $f.js"; exit 1; }; done
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "com.bitacora.nativa.dev"
          # Sin UILaunchScreen iOS la abre en modo compatibilidad (franjas negras); sin los demás, no hay enlaces, Face ID ni Poppins.
          for clave in UILaunchScreen NSFaceIDUsageDescription CFBundleURLTypes:0:CFBundleURLSchemes:0 UIAppFonts:0 CFBundleDocumentTypes:0; do
            /usr/libexec/PlistBuddy -c "Print $clave" "$APP/Info.plist" >/dev/null || { echo "Falta $clave en el Info.plist"; exit 1; }
          done
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
          if [ -d "$APP/PlugIns" ]; then echo "La app no debe llevar extensiones (SideStore no las instala)"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr -y BitacoraNativa-unsigned.ipa Payload
          rm -rf Payload
          ls -la BitacoraNativa-unsigned.ipa

      # La misma app con la identidad de la de siempre (com.bitacora.app, «Bitácora», bitacora://): sustituye a la envoltura web.
      - name: Compilar y empaquetar la definitiva
        run: |
          set -eo pipefail
          xcodebuild -project BitacoraApp.xcodeproj -scheme BitacoraNative -configuration Release -sdk iphoneos -derivedDataPath build-def             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""             CURRENT_PROJECT_VERSION=${{ github.run_number }} PRODUCT_BUNDLE_IDENTIFIER=com.bitacora.app NOMBRE_APP="Bitácora" ESQUEMA_URL=bitacora             build 2>&1 | tee build-def.log | tail -3
          APP="build-def/Build/Products/Release-iphoneos/BitacoraNative.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "com.bitacora.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist")" = "bitacora"
          if [ -d "$APP/PlugIns" ]; then echo "La app definitiva no debe llevar extensiones"; exit 1; fi
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qr -y BitacoraDefinitiva-unsigned.ipa Payload && rm -rf Payload

      - name: Crear manifiesto verificable de las IPA
        run: |
          set -e
          APP="build-def/Build/Products/Release-iphoneos/BitacoraNative.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          shasum -a 256 BitacoraDefinitiva-unsigned.ipa BitacoraNativa-unsigned.ipa > SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "version=${VERSION}"
            echo "build=${BUILD}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > build-info.txt
          cat build-info.txt
          cat SHA256SUMS.txt

      - name: Subir la definitiva
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-INSTALAR-ipa
          path: |
            ios/BitacoraApp/BitacoraDefinitiva-unsigned.ipa
            ios/BitacoraApp/build-info.txt
            ios/BitacoraApp/SHA256SUMS.txt
          retention-days: 30

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-beta-no-instalar-ipa
          path: |
            ios/BitacoraApp/BitacoraNativa-unsigned.ipa
            ios/BitacoraApp/build-info.txt
            ios/BitacoraApp/SHA256SUMS.txt
          retention-days: 30

      # Los errores como anotaciones: se leen sin descargar el registro entero.
      - name: Resumir los errores
        if: failure()
        run: |
          cat tests.log analyze.log build.log 2>/dev/null | grep -E "error:|failed \(|XCTAssert" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - name: Subir los registros si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-nativa
          path: |
            ios/BitacoraApp/tests.log
            ios/BitacoraApp/analyze.log
            ios/BitacoraApp/build.log
          retention-days: 7
