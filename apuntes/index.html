<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apuntes — Bitácora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0b0b0b;--panel:#111;--panel2:#151515;--border:#262626;
  --text:#f3f4f6;--muted:#8b8b8b;--accent:#d8d8d8;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button,input,select{font:inherit}
button{color:var(--text);background:transparent;border:1px solid var(--border);border-radius:7px;cursor:pointer}
button:hover{background:#1b1b1b}
#app{height:100vh;display:flex;flex-direction:column}
#toolbar{height:48px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:4px;padding:0 10px}
#toolbar button{min-width:28px;height:28px;padding:0 7px;border:1px solid transparent;border-radius:6px;color:#d9d9d9;transition:background .15s,border-color .15s,color .15s}
#toolbar button:hover{background:#191919;border-color:#2b2b2b;color:#fff}
#toolbar .align-btn{width:28px;min-width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.align-icon{width:14px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
.align-icon span{display:block;height:1.5px;background:currentColor;border-radius:2px}
.align-icon.left span:nth-child(1){width:14px;margin-right:auto}.align-icon.left span:nth-child(2){width:10px;margin-right:auto}.align-icon.left span:nth-child(3){width:13px;margin-right:auto}
.align-icon.center span:nth-child(1){width:14px;margin-left:auto;margin-right:auto}.align-icon.center span:nth-child(2){width:10px;margin-left:auto;margin-right:auto}.align-icon.center span:nth-child(3){width:13px;margin-left:auto;margin-right:auto}
.align-icon.right span:nth-child(1){width:14px;margin-left:auto}.align-icon.right span:nth-child(2){width:10px;margin-left:auto}.align-icon.right span:nth-child(3){width:13px;margin-left:auto}
.align-icon.full span{width:14px}

#toolbar select{height:28px;background:#111;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0 7px;min-width:78px;font-size:11px}
#toolbar .separator{width:1px;height:18px;background:var(--border);margin:0 2px}
#toolbar .tool-label{font-size:9px;color:var(--muted);margin-left:3px}
#title{width:190px;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--border);outline:0;padding:7px 4px;margin-left:8px}
#title:focus{border-color:#777}
#workspace{flex:1;min-height:0;display:flex}
#sidebar{width:235px;flex-shrink:0;border-right:1px solid var(--border);background:#0e0e0e;padding:14px;display:flex;flex-direction:column;gap:7px}
.side-btn{width:100%;padding:9px 10px;text-align:left}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin:12px 4px 4px}
#saved-list{overflow:auto;min-height:0}
.saved-note{padding:9px 10px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.saved-note:hover,.saved-note.active{background:#171717;border-color:var(--border)}
.saved-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-date{font-size:10px;color:var(--muted);margin-top:3px}
#main{flex:1;min-width:0;overflow:auto;padding:60px 10%;display:flex;justify-content:center}
#editor-wrap{width:min(900px,100%);min-height:100%}
#editor{min-height:70vh;outline:0;font-size:17px;line-height:1.75;color:var(--text);caret-color:#fff;white-space:normal}
#editor p{margin:0 0 .8em}
#editor:focus{outline:0}
#editor u{text-decoration-color:#f1e3a3;text-decoration-thickness:1.5px;text-underline-offset:2px}
#editor:empty:before{content:"Empieza a escribir…";color:#555}
#status{position:fixed;right:16px;bottom:14px;color:var(--muted);font-size:10px;pointer-events:none}
#auth-status{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;background:var(--bg);z-index:10}
#auth-status .box{width:min(420px,90vw);padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--panel);text-align:center}
@media(max-width:700px){
  #sidebar{width:190px}
  #title{width:130px}
  #main{padding:40px 22px}
  #toolbar{overflow-x:auto}
}
@media print{
  @page{size:A4;margin:18mm 18mm 20mm}
  body{background:white!important;color:#111!important;overflow:visible}
  #toolbar,#sidebar,#status,#auth-status{display:none!important}
  #workspace,#main{display:block;overflow:visible;height:auto;padding:0}
  #editor-wrap{width:100%}
  #editor{color:#111!important;min-height:auto;font-size:12pt;line-height:1.6}
  #print-header{display:block!important;margin:0 0 18mm;border-bottom:1px solid #bbb;padding-bottom:8mm}
  #print-header h1{margin:0 0 5mm;font-size:24pt;line-height:1.15}
  #print-header .meta{font-size:9pt;color:#666}
  #editor img{max-width:100%}
  #editor a{color:#111;text-decoration:underline}
}
</style>
</head>
<body>
<div id="auth-status"><div class="box"><strong id="auth-status-title">Abriendo Apuntes…</strong><div id="auth-status-text" style="font-size:11px;color:var(--muted);margin-top:8px">Comprobando tu sesión de Bitácora.</div></div></div>

<div id="app">
  <div id="toolbar">
    <button onclick="cmd('bold')" title="Negrita (Ctrl+B)"><b>B</b></button>
    <button onclick="cmd('italic')" title="Cursiva (Ctrl+I)"><i>I</i></button>
    <button onclick="cmd('underline')" title="Subrayado (Ctrl+U)"><u>U</u></button>
    <span class="tool-label">Tamaño</span>
    <select onchange="changeSize(this.value)" title="Tamaño de letra">
      <option value="12">12 px</option><option value="14">14 px</option><option value="16" selected>16 px</option><option value="18">18 px</option><option value="20">20 px</option><option value="24">24 px</option><option value="28">28 px</option><option value="32">32 px</option>
    </select>
    <button class="align-btn" onclick="cmd('justifyLeft')" title="Alinear izquierda"><span class="align-icon left"><span></span><span></span><span></span></span></button>
    <button class="align-btn" onclick="cmd('justifyCenter')" title="Centrar"><span class="align-icon center"><span></span><span></span><span></span></span></button>
    <button class="align-btn" onclick="cmd('justifyRight')" title="Alinear derecha"><span class="align-icon right"><span></span><span></span><span></span></span></button>
    <button class="align-btn" onclick="cmd('justifyFull')" title="Justificar"><span class="align-icon full"><span></span><span></span><span></span></span></button>
    <button onclick="cmd('insertUnorderedList')" title="Lista">• Lista</button>
    <button onclick="cmd('insertOrderedList')" title="Lista numerada">1. Lista</button>
    <input id="title" placeholder="Título del apunte" autocomplete="off">
  </div>
  <div id="workspace">
    <aside id="sidebar">
      <button class="side-btn" onclick="saveCurrent()">Guardar en Bitácora</button>
      <button class="side-btn" onclick="window.close()">Salir</button>
      <button class="side-btn" onclick="exportPDF()">Exportar a PDF</button>
      <div class="side-label">Apuntes guardados</div>
      <div id="saved-list"></div>
    </aside>
    <main id="main"><div id="editor-wrap"><div id="print-header" style="display:none"><h1 id="print-title"></h1><div class="meta" id="print-meta"></div></div><div id="editor" contenteditable="true" spellcheck="true"></div></div></main>
  </div>
</div>
<div id="status"></div>

<script>
const SUPABASE_URL='https://avdqtnukgbejorieuunj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhdmRxdG51a2diZWpvcmlldXV1bmoiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NTMyNzI5NSwiZXhwIjoyMTAwOTAzMjk1fQ.sq1cepXuBaNT6qygyxKEAhVHJh7G9LZyzaeJBhc7s7s';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let apuntes=[], currentId=null, currentUserId=null;

const $=id=>document.getElementById(id);
function status(t){$('status').textContent=t;clearTimeout(status.t);status.t=setTimeout(()=>$('status').textContent='',2200);}
async function getUser(){const {data:{user},error}=await sb.auth.getUser();if(error)throw error;return user;}
function cmd(name){$('editor').focus();document.execCommand(name,false,null);}
function changeSize(px){
  const editor=$('editor'); editor.focus();
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){status('Selecciona un texto para cambiar su tamaño');return;}
  try{
    document.execCommand('fontSize',false,'7');
    editor.querySelectorAll('font[size="7"]').forEach(font=>{
      const span=document.createElement('span');
      span.style.fontSize=px+'px';
      span.innerHTML=font.innerHTML;
      font.replaceWith(span);
    });
  }catch(e){console.error(e);}
}
function exportPDF(){
  const title=$('title').value.trim()||'Apunte sin título';
  const editorHtml=$('editor').innerHTML.trim();
  if(!editorHtml){status('Escribe algo antes de exportar');return;}
  const win=window.open('about:blank','_blank');
  if(!win){status('El navegador bloqueó la ventana de PDF');return;}
  const date=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  const safeTitle=esc(title);
  const printDoc=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>${safeTitle}</title>
<style>
@page{size:A4;margin:18mm 18mm 20mm}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#171717}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12pt;line-height:1.65}
.print-page{max-width:174mm;margin:0 auto}
header{border-bottom:1px solid #d6d6d6;padding:0 0 7mm;margin:0 0 10mm}
h1{font-size:24pt;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.2px}
.date{font-size:12pt;color:#777;font-weight:500}
main{word-wrap:break-word;overflow-wrap:anywhere}
main p{margin:0 0 .8em}
main h1{font-size:20pt;margin-top:1em}main h2{font-size:17pt;margin-top:1em}main h3{font-size:14pt;margin-top:1em}
main img{max-width:100%;height:auto}main a{color:#171717;text-decoration:underline}
ul,ol{padding-left:1.4em}blockquote{border-left:3px solid #cfcfcf;padding-left:12px;margin-left:0;color:#555}
pre{white-space:pre-wrap;word-break:break-word}
@media print{.print-page{max-width:none}a{color:inherit}}
</style></head><body><div class="print-page">
<header><h1>${safeTitle} <span class="date">- ${date}</span></h1></header>
<main>${editorHtml}</main></div></body></html>`;
  try{
    win.document.open();win.document.write(printDoc);win.document.close();
    setTimeout(()=>{try{win.focus();win.print();}catch(e){console.error(e);status('No se pudo abrir la impresión');}},500);
  }catch(e){console.error(e);try{win.close();}catch(_){}status('No se pudo preparar la impresión');}
}
function fmtDate(iso){return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function makeId(){
  if(window.crypto?.randomUUID)return crypto.randomUUID();
  return 'apunte_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
}

async function getOrRestoreSession(){
  let {data:{session}}=await sb.auth.getSession();
  if(session)return session;
  try{
    const raw=localStorage.getItem('bitacora_apuntes_handoff');
    if(raw){
      const handoff=JSON.parse(raw);
      localStorage.removeItem('bitacora_apuntes_handoff');
      if(handoff?.access_token&&handoff?.refresh_token){
        const result=await sb.auth.setSession({access_token:handoff.access_token,refresh_token:handoff.refresh_token});
        session=result?.data?.session||null;
      }
    }
  }catch(e){console.warn('No se pudo restaurar la sesión:',e);}
  return session;
}

/* Copia local secundaria: ya no es la base de datos de los apuntes.
   Supabase es ahora la fuente principal y cada documento tiene su propia fila. */
const LOCAL_NOTES_KEY='bitacora_apuntes_local_v3';
function localKey(userId=currentUserId){return userId?LOCAL_NOTES_KEY+'_'+userId:LOCAL_NOTES_KEY+'_anonymous';}
function readLocalNotes(userId=currentUserId){
  try{const raw=localStorage.getItem(localKey(userId));const parsed=raw?JSON.parse(raw):[];return Array.isArray(parsed)?parsed:[];}
  catch(e){return [];}
}
function writeLocalNotes(userId=currentUserId,notes=apuntes){
  try{localStorage.setItem(localKey(userId),JSON.stringify(notes));}catch(e){console.warn('No se pudo guardar la copia local:',e);}
}
function mergeNotes(a,b){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(n=>{
    if(!n||!n.id)return;
    const old=map.get(n.id);
    if(!old||new Date(n.updatedAt||n.createdAt||0)>=new Date(old.updatedAt||old.createdAt||0))map.set(n.id,n);
  });
  return [...map.values()].sort((a,b)=>new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0));
}

function normalizeRow(r){
  return {id:r.id,title:r.title||'',content:r.content||'',createdAt:r.created_at,updatedAt:r.updated_at||r.created_at};
}
function dbPayload(n,userId){
  return {
    id:n.id,
    user_id:userId,
    title:n.title||'Apunte sin título',
    content:n.content||'',
    created_at:n.createdAt||new Date().toISOString(),
    updated_at:n.updatedAt||new Date().toISOString()
  };
}

async function load(){
  const session=await getOrRestoreSession();
  if(!session){
    $('app').style.display='none';$('auth-status').style.display='flex';
    $('auth-status-title').textContent='No se encontró la sesión de Bitácora';
    $('auth-status-text').textContent='Cierra esta pestaña y abre Apuntes desde Bitácora.';
    return;
  }
  $('auth-status').style.display='none';$('app').style.display='flex';
  currentUserId=session.user.id;

  let remote=[];
  let remoteError=null;
  const {data:rows,error}=await sb.from('apuntes').select('id,user_id,title,content,created_at,updated_at').eq('user_id',currentUserId).order('updated_at',{ascending:false});
  remoteError=error;
  if(!error)remote=(rows||[]).map(normalizeRow);

  const local=readLocalNotes(currentUserId);
  apuntes=mergeNotes(remote,local);
  writeLocalNotes(currentUserId,apuntes);
  renderList();
  if(apuntes.length)openNote(apuntes[0].id);

  if(remoteError){
    console.error('Error leyendo tabla apuntes:',remoteError);
    status('Mostrando la copia local; revisa la tabla de Supabase');
    return;
  }

  /* Si quedó algún documento local por un fallo anterior, intenta recuperarlo
     como fila independiente. No modifica nunca la tabla bitacora. */
  const remoteIds=new Set(remote.map(n=>n.id));
  const pending=apuntes.filter(n=>!remoteIds.has(n.id));
  if(pending.length){
    try{
      const {error:syncError}=await sb.from('apuntes').upsert(pending.map(n=>dbPayload(n,currentUserId)),{onConflict:'id'});
      if(syncError)throw syncError;
      status('Apuntes sincronizados');
    }catch(e){console.warn('No se pudieron sincronizar algunos apuntes:',e);}
  }
}

async function persistNote(note){
  const user=await getUser();
  if(!user)throw new Error('Sin sesión');
  const payload=dbPayload(note,user.id);
  const {error}=await sb.from('apuntes').upsert(payload,{onConflict:'id'});
  if(error)throw error;
  writeLocalNotes(user.id,apuntes);
}

async function deleteNote(id){
  const user=await getUser();if(!user)throw new Error('Sin sesión');
  const {error}=await sb.from('apuntes').delete().eq('id',id).eq('user_id',user.id);
  if(error)throw error;
  apuntes=apuntes.filter(n=>n.id!==id);
  writeLocalNotes(user.id,apuntes);
  currentId=apuntes[0]?.id||null;
  if(currentId)openNote(currentId);else{ $('title').value='';$('editor').innerHTML='';renderList(); }
}

function renderList(){
  const list=$('saved-list');
  list.innerHTML=apuntes.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(n=>`
    <div class="saved-note ${n.id===currentId?'active':''}" onclick="openNote('${n.id}')">
      <div class="saved-title">${esc(n.title||'Sin título')}</div>
      <div class="saved-date">${fmtDate(n.updatedAt||n.createdAt)}</div>
    </div>`).join('');
}
function openNote(id){
  const n=apuntes.find(x=>x.id===id);if(!n)return;
  currentId=id;$('title').value=n.title||'';$('editor').innerHTML=n.content||'';renderList();
}
async function saveCurrent(){
  const content=$('editor').innerHTML.trim();
  const title=$('title').value.trim()||'Apunte sin título';
  if(!content){status('Escribe algo antes de guardar');return;}
  const now=new Date().toISOString();
  let n=apuntes.find(x=>x.id===currentId);
  const isNew=!n;
  if(!n){
    n={id:makeId(),title,content,createdAt:now,updatedAt:now};
    currentId=n.id;apuntes.unshift(n);
  }else{
    n.title=title;n.content=content;n.updatedAt=now;
  }
  /* Guardado local inmediato: el documento aparece incluso si la red falla. */
  writeLocalNotes(currentUserId,apuntes);
  renderList();
  status('Guardando…');
  try{
    await persistNote(n);
    renderList();
    status(isNew?'Guardado en Bitácora':'Cambios guardados');
  }catch(e){
    console.error('Error guardando apunte en Supabase:',e);
    status('Guardado localmente; Supabase no respondió');
  }
}
$('editor').addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(!mod)return;
  const k=e.key.toLowerCase();
  if(['b','i','u','s'].includes(k)){
    e.preventDefault();
    if(k==='s')saveCurrent();else cmd({b:'bold',i:'italic',u:'underline'}[k]);
  }
});
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT'){
    $('app').style.display='none';$('auth-status').style.display='flex';
    $('auth-status-title').textContent='Sesión cerrada';
    $('auth-status-text').textContent='Vuelve a Bitácora para iniciar sesión.';
  }
});
load();
</script>
</body>
</html>
