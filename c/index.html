<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bitácora</title>
<meta name="description" content="Te han compartido algo desde Bitácora. Ábrelo sin cuenta ni app.">
<meta property="og:title" content="Te han compartido algo desde Bitácora">
<meta property="og:description" content="Una quedada, una invitación, una lista o un viaje. Se abre sin cuenta ni app.">
<meta property="og:image" content="https://appbitacora.es/og-image.png">
<meta name="theme-color" content="#E7E2D9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B2A27" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --fondo: #E7E2D9; --tarjeta: #F2EFE9; --hundido: #E2DDD3; --borde: #D5CFC3; --borde-fuerte: #B9B2A4;
    --tinta: #161514; --suave: #625D55; --tenue: #99938A; --acento: #EE4B1F; --sobre-acento: #FFFFFF;
    --acento-suave: rgba(238,75,31,.12); --bien: #2F7D4F;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --fondo: #2B2A27; --tarjeta: #3a3934; --hundido: #33322d; --borde: #4a4941; --borde-fuerte: #5a5850;
        --tinta: #efede3; --suave: #a9a89c; --tenue: #79776c; --acento: #F0643A; --sobre-acento: #161514;
        --acento-suave: rgba(240,100,58,.16); --bien: #6FC28F;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --fondo: #2B2A27; --tarjeta: #3a3934; --hundido: #33322d; --borde: #4a4941; --borde-fuerte: #5a5850;
    --tinta: #efede3; --suave: #a9a89c; --tenue: #79776c; --acento: #F0643A; --sobre-acento: #161514;
    --acento-suave: rgba(240,100,58,.16); --bien: #6FC28F;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
::selection { background: var(--tinta); color: var(--fondo); }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
.pagina { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; min-height: 100vh; display: flex; flex-direction: column; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; text-decoration: none; margin-bottom: 34px; }
.marca i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--tinta); color: var(--fondo); font-style: normal; font-size: 16px; font-weight: 800; }
.quien { color: var(--suave); font-size: 14px; margin: 0 0 6px; }
h1 { font-size: clamp(30px, 8.5vw, 42px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; margin: 0 0 12px; overflow-wrap: anywhere; }
.datos { color: var(--suave); margin: 0 0 6px; font-size: 14.5px; }
.datos b { color: var(--tinta); font-weight: 600; }
.nota-autor { margin: 16px 0 0; padding: 14px 16px; background: var(--tarjeta); border-radius: 14px; font-size: 14px; white-space: pre-wrap; }
.seccion { margin-top: 30px; }
.seccion-tit { font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.seccion-tit small { font-weight: 500; color: var(--tenue); font-size: 12.5px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; }
/* Quedada */
.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 14px; width: 100%; padding: 12px 14px 12px 12px; text-align: left; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; transition: border-color .15s ease, background-color .15s ease, transform .12s ease; -webkit-tap-highlight-color: transparent; }
.opcion:active { transform: scale(.985); }
.opcion[disabled] { cursor: default; }
.opcion[disabled]:active { transform: none; }
.dia { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: var(--hundido); line-height: 1; }
.dia small { font-size: 11px; color: var(--suave); }
.dia b { font-size: 21px; font-weight: 800; margin: 3px 0 2px; letter-spacing: -.02em; }
.dia em { font-style: normal; font-size: 10.5px; color: var(--suave); }
.opcion-txt { min-width: 0; }
.opcion-txt b { display: block; font-weight: 600; font-size: 14.5px; }
.opcion-txt span { display: block; font-size: 12.5px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opcion-txt .mejor { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--acento); }
.estado { min-width: 82px; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--borde-fuerte); font-size: 13px; font-weight: 600; text-align: center; color: var(--suave); transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
.opcion.si { border-color: var(--acento); }
.opcion.si .estado { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.opcion.quiza .estado { border-color: var(--acento); border-style: dashed; color: var(--acento); }
.opcion.elegida { border-color: var(--tinta); border-width: 2px; padding: 11px 13px 11px 11px; }
.ayuda { font-size: 12.5px; color: var(--tenue); margin: 10px 2px 0; }
.cerrada { margin-top: 26px; padding: 20px; border-radius: 18px; background: var(--tinta); color: var(--fondo); }
.cerrada p { margin: 0 0 4px; font-size: 13px; opacity: .75; }
.cerrada strong { display: block; font-size: 22px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
.cerrada .botones { margin-top: 16px; }
.cerrada .btn { background: var(--fondo); color: var(--tinta); border-color: var(--fondo); }
.cerrada .btn.sec { background: transparent; color: var(--fondo); border-color: rgba(255,255,255,.35); }
:root[data-theme="dark"] .cerrada .btn.sec { border-color: rgba(0,0,0,.25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cerrada .btn.sec { border-color: rgba(0,0,0,.25); } }
/* Invitación */
.rsvp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rsvp button { padding: 14px 6px; border-radius: 12px; border: 1.5px solid var(--borde-fuerte); background: var(--tarjeta); font-weight: 600; font-size: 14.5px; transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .12s ease; }
.rsvp button:active { transform: scale(.97); }
.rsvp button.on { background: var(--tinta); border-color: var(--tinta); color: var(--fondo); }
.rsvp button.on.si { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.mas { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding: 10px 12px 10px 16px; }
.mas span { font-size: 14px; }
.paso { display: flex; align-items: center; gap: 4px; }
.paso button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--borde); background: var(--hundido); font-size: 18px; font-weight: 600; line-height: 1; }
.paso b { min-width: 28px; text-align: center; font-size: 16px; }
.gente { display: flex; flex-direction: column; }
.gente-grupo { padding: 12px 16px; border-bottom: 1px solid var(--borde); }
.gente-grupo:last-child { border-bottom: 0; }
.gente-grupo b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.gente-grupo span { font-size: 13.5px; color: var(--suave); }
/* Lista */
.items { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--borde); }
.item:last-child { border-bottom: 0; }
.check { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--borde-fuerte); background: transparent; padding: 0; transition: background-color .15s ease, border-color .15s ease, transform .12s ease; }
.check:active { transform: scale(.9); }
.item.hecho .check { background: var(--acento); border-color: var(--acento); }
.item-txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item-txt small { display: block; font-size: 11.5px; color: var(--tenue); }
.item.hecho .item-txt b { text-decoration: line-through; color: var(--tenue); font-weight: 500; }
.item-txt b { font-weight: 500; }
.quitar { flex-shrink: 0; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--tenue); font-size: 18px; line-height: 1; }
.anadir { display: flex; gap: 8px; margin-bottom: 12px; }
/* Viaje */
.bloque { padding: 14px 16px; border-bottom: 1px solid var(--borde); }
.bloque:last-child { border-bottom: 0; }
.bloque b { display: block; font-weight: 600; font-size: 14.5px; }
.bloque span { display: block; font-size: 13px; color: var(--suave); }
.dia-tit { font-size: 13.5px; font-weight: 700; margin: 18px 0 8px; }
.dia-tit:first-child { margin-top: 0; }
.hora { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--borde); }
.hora:first-of-type { border-top: 0; }
.hora > span { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; color: var(--suave); }
.hora b { font-weight: 600; display: block; }
.hora small { display: block; color: var(--suave); font-size: 12.5px; }
/* Comunes */
.campo { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); font-size: 15px; outline: none; transition: border-color .15s ease; }
.campo:focus { border-color: var(--tinta); }
textarea.campo { resize: vertical; min-height: 64px; }
.etiqueta { display: block; font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 12px 18px; border-radius: 10px; border: 1.5px solid var(--tinta); background: var(--tinta); color: var(--fondo); font-weight: 600; font-size: 14.5px; transition: transform .12s ease, opacity .15s ease; }
.btn:active { transform: scale(.97); }
a.btn { display: inline-block; text-decoration: none; }
.btn.sec { background: transparent; color: var(--tinta); border-color: var(--borde-fuerte); }
.btn.grande { width: 100%; padding: 15px 18px; margin-top: 18px; background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); font-size: 15.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.aviso { margin-top: 12px; font-size: 13.5px; color: var(--bien); min-height: 20px; }
.aviso.mal { color: var(--acento); }
.vacio { padding: 18px 16px; color: var(--suave); font-size: 14px; text-align: center; }
.estado-pagina { margin: 12vh 0 0; }
.estado-pagina h1 { font-size: 30px; }
.estado-pagina p { color: var(--suave); }
.cargando { display: flex; flex-direction: column; gap: 12px; }
.cargando div { height: 18px; border-radius: 8px; background: var(--tarjeta); animation: latir 1.2s ease-in-out infinite; }
.cargando div:nth-child(1) { width: 40%; }
.cargando div:nth-child(2) { width: 85%; height: 40px; }
.cargando div:nth-child(3) { width: 60%; }
@keyframes latir { 50% { opacity: .55; } }
footer { margin-top: auto; padding-top: 48px; font-size: 13px; color: var(--tenue); }
footer a { color: var(--suave); font-weight: 600; }
.entra { animation: entra .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="pagina">
    <a class="marca" href="https://appbitacora.es" target="_blank" rel="noopener"><i>b</i>bitácora.</a>
    <main id="app"><div class="cargando" aria-label="Cargando"><div></div><div></div><div></div></div></main>
    <footer>Hecho con <a href="https://appbitacora.es" target="_blank" rel="noopener">bitácora.</a> Tu calendario, tus planes y tus cuentas, en un solo sitio.</footer>
</div>
<script>
(() => {
    const FN = 'https://avdqtnukgbejorieuunj.supabase.co/functions/v1/compartir';
    const app = document.getElementById('app');
    const id = (location.hash.slice(1) || new URLSearchParams(location.search).get('c') || '').trim();
    let S = null;
    let borrador = null;
    let sondeo = 0;
    let nombreBorrador = null;

    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
    const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    const yo = leer('bitacora-c-yo', null) || { pid: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)), nombre: '' };
    guardar('bitacora-c-yo', yo);

    const fechaLarga = (f, conAnio) => new Date(f + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', ...(conAnio ? { year: 'numeric' } : {}) });
    const diaCorto = f => { const d = new Date(f + 'T12:00:00'); return { sem: d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', ''), num: d.getDate(), mes: d.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '') }; };
    const nombres = l => l.length <= 1 ? l.join('') : l.slice(0, -1).join(', ') + ' y ' + l[l.length - 1];

    async function pedir(cuerpo) {
        const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, ...cuerpo }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(d.error || 'No se ha podido'); e.status = r.status; throw e; }
        return d;
    }

    function pantalla(titulo, texto, reintentar) {
        app.innerHTML = `<div class="estado-pagina entra"><h1>${titulo}</h1><p>${texto}</p>${reintentar ? '<button class="btn" id="otra">probar otra vez.</button>' : ''}</div>`;
        document.getElementById('otra')?.addEventListener('click', cargar);
    }

    async function cargar() {
        if (!/^[A-Za-z0-9_-]{16}$/.test(id)) { pantalla('este enlace está incompleto.', 'Pide a quien te lo mandó que te lo copie otra vez, entero.'); return; }
        try { S = await pedir({ accion: 'ver' }); pintar(true); }
        catch (e) {
            if (e.status === 404) pantalla('este enlace ya no existe.', 'Quien lo creó lo habrá borrado.');
            else pantalla('no se ha podido abrir.', 'Puede que no tengas conexión ahora mismo.', true);
        }
    }

    async function refrescar() {
        if (document.hidden || !S || /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) return;
        try { const n = await pedir({ accion: 'ver' }); if (JSON.stringify(n) !== JSON.stringify(S)) { S = n; pintar(false); } } catch (e) {}
    }

    // ---- calendario ----
    function calendario(titulo, fecha, hora, lugar, notas) {
        const p = n => String(n).padStart(2, '0');
        const ini = new Date(`${fecha}T${hora || '00:00'}:00`);
        const fin = new Date(ini.getTime() + (hora ? 2 * 3600e3 : 24 * 3600e3));
        const f = d => hora ? `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00` : `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
        const google = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${f(ini)}/${f(fin)}&location=${encodeURIComponent(lugar || '')}&details=${encodeURIComponent(notas || '')}`;
        const linea = t => String(t || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
        const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Bitacora//ES', 'BEGIN:VEVENT', `UID:${id}-${f(ini)}@appbitacora.es`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
            hora ? `DTSTART:${f(ini)}` : `DTSTART;VALUE=DATE:${f(ini)}`, hora ? `DTEND:${f(fin)}` : `DTEND;VALUE=DATE:${f(fin)}`, `SUMMARY:${linea(titulo)}`, lugar ? `LOCATION:${linea(lugar)}` : '', notas ? `DESCRIPTION:${linea(notas)}` : '', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
        return { google, ics: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics) };
    }
    const botonesCalendario = (titulo, fecha, hora, lugar, notas) => {
        const c = calendario(titulo, fecha, hora, lugar, notas);
        return `<div class="botones"><a class="btn" href="${c.ics}" download="${esc(titulo.slice(0, 40) || 'evento')}.ics">añadir a mi calendario.</a><a class="btn sec" href="${c.google}" target="_blank" rel="noopener">google calendar.</a></div>`;
    };

    const campoNombre = () => `<label class="etiqueta" for="nombre">tu nombre.</label><input id="nombre" class="campo" maxlength="40" autocomplete="given-name" placeholder="Para que sepan quién eres" value="${esc(nombreBorrador ?? yo.nombre)}">`;
    function leerNombre() {
        const n = (document.getElementById('nombre')?.value || '').trim();
        if (n) { yo.nombre = n; guardar('bitacora-c-yo', yo); }
        return n;
    }
    function aviso(texto, mal) { const a = document.getElementById('aviso'); if (a) { a.textContent = texto; a.className = 'aviso' + (mal ? ' mal' : ''); } }

    async function responder(ev, boton) {
        if (boton) boton.disabled = true;
        try { S = await pedir({ accion: 'responder', ev }); return true; }
        catch (e) { aviso(e.message || 'No se ha podido guardar. Prueba otra vez.', true); return false; }
        finally { if (boton) boton.disabled = false; }
    }

    // ---- por tipo ----
    function ultimoPorPersona(tipo) {
        const m = new Map();
        S.eventos.filter(e => e.tipo === tipo).forEach(e => m.set(e.pid, e));
        return [...m.values()];
    }

    function pintarQuedada(d) {
        const votos = ultimoPorPersona('voto');
        const mio = votos.find(v => v.pid === yo.pid);
        if (!borrador) borrador = { si: new Set(mio?.si || []), quiza: new Set(mio?.quiza || []), nota: mio?.nota || '' };
        const ops = d.opciones || [];
        const puntos = ops.map((_, i) => votos.reduce((t, v) => t + (v.si.includes(i) ? 1 : v.quiza.includes(i) ? .5 : 0), 0));
        const max = Math.max(0, ...puntos);
        const cierre = S.cierre;
        const fila = (o, i) => {
            const dc = diaCorto(o.fecha);
            const si = votos.filter(v => v.si.includes(i)).map(v => v.nombre), qz = votos.filter(v => v.quiza.includes(i)).map(v => v.nombre);
            const est = borrador.si.has(i) ? 'si' : borrador.quiza.has(i) ? 'quiza' : '';
            const gente = [si.length ? `${si.length === 1 ? 'puede' : 'pueden'} ${nombres(si)}` : '', qz.length ? `quizá ${nombres(qz)}` : ''].filter(Boolean).join(', ');
            return `<button class="opcion ${cierre ? '' : est} ${cierre && cierre.opcion === i ? 'elegida' : ''}" data-i="${i}" ${cierre ? 'disabled' : ''} aria-pressed="${est === 'si'}">
                <span class="dia"><small>${dc.sem}</small><b>${dc.num}</b><em>${dc.mes}</em></span>
                <span class="opcion-txt"><b>${esc(fechaLarga(o.fecha).replace(/^\w/, c => c.toUpperCase()))}${o.hora ? `, ${esc(o.hora)}` : ''}</b><span>${esc(gente || 'Nadie todavía.')}</span>${!cierre && max > 0 && puntos[i] === max && votos.length > 1 ? '<span class="mejor">la que mejor va.</span>' : ''}</span>
                ${cierre ? '' : `<span class="estado">${est === 'si' ? 'puedo.' : est === 'quiza' ? 'quizá.' : 'no puedo.'}</span>`}
            </button>`;
        };
        const elegida = cierre ? ops[cierre.opcion] : null;
        return `
            <p class="quien">${esc(S.autor || 'Alguien')} propone quedar.</p>
            <h1>${esc(d.titulo || 'Quedada')}</h1>
            ${d.lugar ? `<p class="datos">En <b>${esc(d.lugar)}</b>.</p>` : ''}
            ${d.nota ? `<div class="nota-autor">${esc(d.nota)}</div>` : ''}
            ${elegida ? `<div class="cerrada entra"><p>Ya está decidido.</p><strong>${esc(fechaLarga(elegida.fecha).replace(/^\w/, c => c.toUpperCase()))}${elegida.hora ? `, a las ${esc(elegida.hora)}` : ''}.</strong>${botonesCalendario(d.titulo || 'Quedada', elegida.fecha, elegida.hora, d.lugar, d.nota)}</div>` : ''}
            <div class="seccion">
                <div class="seccion-tit">${cierre ? 'cómo quedó la votación.' : '¿cuándo puedes?'}<small>${votos.length ? `${votos.length} ${votos.length === 1 ? 'respuesta' : 'respuestas'}` : ''}</small></div>
                <div class="opciones">${ops.map(fila).join('')}</div>
                ${cierre ? '' : `<p class="ayuda">Toca cada fecha para cambiar entre puedo, quizá y no puedo.</p>
                ${campoNombre()}
                <label class="etiqueta" for="nota">algo que decir. <span style="font-weight:400;color:var(--tenue)">(opcional)</span></label>
                <textarea id="nota" class="campo" maxlength="200" placeholder="Llego un poco más tarde, el viernes mejor...">${esc(borrador.nota)}</textarea>
                <button class="btn grande" id="enviar">${mio ? 'guardar los cambios.' : 'enviar mi respuesta.'}</button>
                <div class="aviso" id="aviso" role="status">${mio ? 'Ya respondiste. Puedes cambiarlo cuando quieras.' : ''}</div>`}
            </div>`;
    }
    function enlazarQuedada() {
        app.querySelectorAll('.opcion[data-i]:not([disabled])').forEach(b => b.addEventListener('click', () => {
            const i = Number(b.dataset.i);
            if (borrador.si.has(i)) { borrador.si.delete(i); borrador.quiza.add(i); }
            else if (borrador.quiza.has(i)) borrador.quiza.delete(i);
            else borrador.si.add(i);
            const est = borrador.si.has(i) ? 'si' : borrador.quiza.has(i) ? 'quiza' : '';
            b.classList.remove('si', 'quiza'); if (est) b.classList.add(est);
            b.setAttribute('aria-pressed', String(est === 'si'));
            b.querySelector('.estado').textContent = est === 'si' ? 'puedo.' : est === 'quiza' ? 'quizá.' : 'no puedo.';
        }));
        document.getElementById('nota')?.addEventListener('input', e => { borrador.nota = e.target.value; });
        document.getElementById('enviar')?.addEventListener('click', async e => {
            const nombre = leerNombre();
            if (!nombre) { aviso('Escribe tu nombre para que sepan quién eres.', true); document.getElementById('nombre').focus(); return; }
            if (await responder({ tipo: 'voto', pid: yo.pid, nombre, si: [...borrador.si], quiza: [...borrador.quiza], nota: borrador.nota }, e.currentTarget)) { pintar(false); aviso('Enviado. Puedes cambiarlo cuando quieras.'); }
        });
    }

    function pintarInvitacion(d) {
        const resp = ultimoPorPersona('rsvp');
        const mio = resp.find(r => r.pid === yo.pid);
        if (!borrador) borrador = { va: mio?.va || '', mas: mio?.mas || 0, nota: mio?.nota || '' };
        const grupo = va => resp.filter(r => r.va === va);
        const van = grupo('si'), total = van.reduce((t, r) => t + 1 + (r.mas || 0), 0);
        const lista = l => l.map(r => esc(r.nombre) + (r.mas ? ` <span style="color:var(--tenue)">+${r.mas}</span>` : '')).join(', ');
        const mapa = d.lugar ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.lugar)}` : '';
        return `
            <p class="quien">${esc(S.autor || 'Alguien')} te invita.</p>
            <h1>${esc(d.titulo || 'Evento')}</h1>
            ${d.fecha ? `<p class="datos"><b>${esc(fechaLarga(d.fecha, true).replace(/^\w/, c => c.toUpperCase()))}</b>${d.hora ? `, a las <b>${esc(d.hora)}</b>` : ''}${d.horaFin ? ` hasta las ${esc(d.horaFin)}` : ''}.</p>` : ''}
            ${d.lugar ? `<p class="datos">En <a href="${mapa}" target="_blank" rel="noopener"><b>${esc(d.lugar)}</b></a>.</p>` : ''}
            ${d.nota ? `<div class="nota-autor">${esc(d.nota)}</div>` : ''}
            ${d.fecha ? `<div style="margin-top:16px">${botonesCalendario(d.titulo || 'Evento', d.fecha, d.hora, d.lugar, d.nota)}</div>` : ''}
            <div class="seccion">
                <div class="seccion-tit">¿vienes?</div>
                <div class="rsvp">${[['si', 'voy.'], ['quiza', 'quizá.'], ['no', 'no puedo.']].map(([k, t]) => `<button class="${k} ${borrador.va === k ? 'on' : ''}" data-va="${k}">${t}</button>`).join('')}</div>
                <div class="mas tarjeta" id="mas" ${borrador.va === 'si' ? '' : 'hidden'}><span>vengo con alguien más.</span><span class="paso"><button data-paso="-1" aria-label="Uno menos">−</button><b id="mas-n">${borrador.mas}</b><button data-paso="1" aria-label="Uno más">+</button></span></div>
                ${campoNombre()}
                <label class="etiqueta" for="nota">algo que decir. <span style="font-weight:400;color:var(--tenue)">(opcional)</span></label>
                <textarea id="nota" class="campo" maxlength="200" placeholder="Llevo el postre, llego a las 10...">${esc(borrador.nota)}</textarea>
                <button class="btn grande" id="enviar">${mio ? 'guardar los cambios.' : 'responder.'}</button>
                <div class="aviso" id="aviso" role="status">${mio ? 'Ya respondiste. Puedes cambiarlo cuando quieras.' : ''}</div>
            </div>
            ${resp.length ? `<div class="seccion">
                <div class="seccion-tit">quién viene.<small>${total ? `${total} ${total === 1 ? 'persona' : 'personas'}` : ''}</small></div>
                <div class="gente tarjeta">
                    ${van.length ? `<div class="gente-grupo"><b>van.</b><span>${lista(van)}</span></div>` : ''}
                    ${grupo('quiza').length ? `<div class="gente-grupo"><b>quizá.</b><span>${lista(grupo('quiza'))}</span></div>` : ''}
                    ${grupo('no').length ? `<div class="gente-grupo"><b>no pueden.</b><span>${lista(grupo('no'))}</span></div>` : ''}
                </div></div>` : ''}`;
    }
    function enlazarInvitacion() {
        app.querySelectorAll('[data-va]').forEach(b => b.addEventListener('click', () => {
            borrador.va = b.dataset.va;
            app.querySelectorAll('[data-va]').forEach(x => x.classList.toggle('on', x === b));
            document.getElementById('mas').hidden = borrador.va !== 'si';
        }));
        app.querySelectorAll('[data-paso]').forEach(b => b.addEventListener('click', () => {
            borrador.mas = Math.max(0, Math.min(9, borrador.mas + Number(b.dataset.paso)));
            document.getElementById('mas-n').textContent = borrador.mas;
        }));
        document.getElementById('nota')?.addEventListener('input', e => { borrador.nota = e.target.value; });
        document.getElementById('enviar')?.addEventListener('click', async e => {
            if (!borrador.va) { aviso('Elige si vas, quizá o no puedes.', true); return; }
            const nombre = leerNombre();
            if (!nombre) { aviso('Escribe tu nombre para que sepan quién eres.', true); document.getElementById('nombre').focus(); return; }
            if (await responder({ tipo: 'rsvp', pid: yo.pid, nombre, va: borrador.va, mas: borrador.va === 'si' ? borrador.mas : 0, nota: borrador.nota }, e.currentTarget)) { pintar(false); aviso(borrador.va === 'no' ? 'Enviado. Otra vez será.' : 'Enviado. Puedes cambiarlo cuando quieras.'); }
        });
    }

    function itemsLista(d) {
        const m = new Map();
        (d.items || []).forEach(x => m.set(x.id, { id: x.id, texto: x.texto, hecho: !!x.hecho, quien: '' }));
        S.eventos.forEach(e => {
            if (e.tipo === 'anadir' && !m.has(e.item)) m.set(e.item, { id: e.item, texto: e.texto, hecho: false, quien: e.nombre });
            else if (e.tipo === 'marcar' && m.has(e.item)) m.get(e.item).hecho = e.hecho;
            else if (e.tipo === 'quitar') m.delete(e.item);
        });
        return [...m.values()];
    }
    function pintarLista(d) {
        const items = itemsLista(d);
        const pend = items.filter(i => !i.hecho), hechos = items.filter(i => i.hecho);
        const fila = i => `<div class="item ${i.hecho ? 'hecho' : ''}"><button class="check" data-item="${esc(i.id)}" aria-label="${i.hecho ? 'Desmarcar' : 'Marcar'} ${esc(i.texto)}"></button><span class="item-txt"><b>${esc(i.texto)}</b>${i.quien ? `<small>lo añadió ${esc(i.quien)}</small>` : ''}</span>${i.quien ? `<button class="quitar" data-quitar="${esc(i.id)}" aria-label="Quitar ${esc(i.texto)}">×</button>` : ''}</div>`;
        return `
            <p class="quien">${esc(S.autor || 'Alguien')} comparte una lista contigo.</p>
            <h1>${esc(d.titulo || 'Lista')}</h1>
            <p class="datos">${pend.length ? `Faltan <b>${pend.length}</b>${hechos.length ? `, ${hechos.length} ya ${hechos.length === 1 ? 'está' : 'están'}` : ''}.` : items.length ? 'Todo hecho.' : 'Está vacía.'} Cualquiera con el enlace puede tachar y añadir.</p>
            <div class="seccion">
                <div class="anadir"><input id="nuevo" class="campo" maxlength="80" placeholder="Añadir algo a la lista" autocomplete="off"><button class="btn" id="anadir">añadir.</button></div>
                <div class="items tarjeta">${pend.map(fila).join('') || '<div class="vacio">Nada pendiente.</div>'}</div>
                ${hechos.length ? `<div class="seccion-tit" style="margin-top:22px">hecho.<small>${hechos.length}</small></div><div class="items tarjeta">${hechos.map(fila).join('')}</div>` : ''}
                <div class="aviso" id="aviso" role="status"></div>
                ${yo.nombre ? '' : `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--suave);font-size:13.5px">firmar lo que añado.</summary>${campoNombre()}</details>`}
            </div>`;
    }
    function enlazarLista() {
        app.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', async () => {
            const it = itemsLista(S.datos).find(x => x.id === b.dataset.item);
            if (!it) return;
            b.closest('.item').classList.toggle('hecho');
            if (await responder({ tipo: 'marcar', item: it.id, hecho: !it.hecho, nombre: yo.nombre })) pintar(false);
        }));
        app.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', async () => {
            b.closest('.item').style.opacity = '.4';
            if (await responder({ tipo: 'quitar', item: b.dataset.quitar, nombre: yo.nombre })) pintar(false);
        }));
        const anadir = async () => {
            const el = document.getElementById('nuevo');
            const texto = el.value.trim();
            if (!texto) return;
            leerNombre();
            el.value = '';
            if (await responder({ tipo: 'anadir', texto, nombre: yo.nombre })) { pintar(false); document.getElementById('nuevo')?.focus(); }
        };
        document.getElementById('anadir')?.addEventListener('click', anadir);
        document.getElementById('nuevo')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); anadir(); } });
    }

    function pintarViaje(d) {
        const fh = v => { if (!v) return ''; const [f, h] = String(v).split('T'); return `${fechaLarga(f)}${h ? `, ${h.slice(0, 5)}` : ''}`; };
        const dias = {};
        (d.itinerario || []).forEach(x => { (dias[x.dia || ''] = dias[x.dia || ''] || []).push(x); });
        const claves = Object.keys(dias).sort((a, b) => (a || '9').localeCompare(b || '9'));
        return `
            <p class="quien">${esc(S.autor || 'Alguien')} te enseña su viaje.</p>
            <h1>${esc(d.titulo || 'Viaje')}</h1>
            <p class="datos">${d.destino ? `<b>${esc(d.destino)}</b>` : ''}${d.inicio ? `${d.destino ? ', ' : ''}del ${esc(fechaLarga(d.inicio))}${d.fin ? ` al ${esc(fechaLarga(d.fin))}` : ''}` : ''}.</p>
            ${d.nota ? `<div class="nota-autor">${esc(d.nota)}</div>` : ''}
            ${(d.transportes || []).length ? `<div class="seccion"><div class="seccion-tit">cómo se va.</div><div class="tarjeta">${d.transportes.map(t => `<div class="bloque"><b>${esc([t.tipo, t.origen && t.destino ? `${t.origen} - ${t.destino}` : t.origen || t.destino].filter(Boolean).join(', '))}</b><span>${esc([t.salida ? 'Sale el ' + fh(t.salida) : '', t.llegada ? 'Llegada el ' + fh(t.llegada) : '', [t.compania, t.numero].filter(Boolean).join(' ')].filter(Boolean).join('. '))}</span></div>`).join('')}</div></div>` : ''}
            ${(d.alojamientos || []).length ? `<div class="seccion"><div class="seccion-tit">dónde se duerme.</div><div class="tarjeta">${d.alojamientos.map(a => `<div class="bloque"><b>${esc(a.nombre || 'Alojamiento')}</b><span>${esc([a.direccion, a.entrada ? 'Entrada el ' + fh(a.entrada) : '', a.salida ? 'Salida el ' + fh(a.salida) : ''].filter(Boolean).join('. '))}</span></div>`).join('')}</div></div>` : ''}
            ${claves.length ? `<div class="seccion"><div class="seccion-tit">día a día.</div><div class="tarjeta" style="padding:16px">${claves.map(k => `<div class="dia-tit">${k ? esc(fechaLarga(k).replace(/^\w/, c => c.toUpperCase())) : 'Sin día.'}</div>${dias[k].sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99')).map(x => `<div class="hora"><span>${esc(x.hora || '')}</span><div><b>${esc(x.titulo || '')}</b>${x.lugar || x.notas ? `<small>${esc([x.lugar, x.notas].filter(Boolean).join('. '))}</small>` : ''}</div></div>`).join('')}`).join('')}</div></div>` : ''}
            <p class="ayuda" style="margin-top:22px">Actualizado el ${esc(new Date(S.actualizado || S.creado).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }))}.</p>`;
    }

    const PINTAR = { quedada: [pintarQuedada, enlazarQuedada], invitacion: [pintarInvitacion, enlazarInvitacion], lista: [pintarLista, enlazarLista], viaje: [pintarViaje, () => {}] };
    function pintar(primera) {
        const p = PINTAR[S.tipo];
        if (!p) { pantalla('no sé abrir esto.', 'Quizá haga falta una versión más nueva de esta página. Recárgala.'); return; }
        const foco = document.activeElement?.id;
        app.innerHTML = `<div class="${primera ? 'entra' : ''}">${p[0](S.datos || {})}</div>`;
        p[1]();
        if (foco && !primera) document.getElementById(foco)?.focus();
        document.title = S.datos?.titulo ? `${S.datos.titulo}, en Bitácora` : 'Bitácora';
        clearInterval(sondeo);
        if (S.tipo !== 'viaje') sondeo = setInterval(refrescar, S.tipo === 'lista' ? 8000 : 20000);
    }
    app.addEventListener('input', e => { if (e.target.id === 'nombre') nombreBorrador = e.target.value; });
    document.addEventListener('visibilitychange', refrescar);
    window.addEventListener('hashchange', () => location.reload());
    cargar();
})();
</script>
</body>
</html>
