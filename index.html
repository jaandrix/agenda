    <script>
        // ============================================================
        //  DATA
        // ============================================================
        let entries = [];
        let categories = [];
        let editId = null;
        let editType = null;
        let filteredEntries = [];

        // Tipos de entrada
        const ENTRY_TYPES = {
            ENTRY: 'entry',
            GOAL: 'goal',
            PROJECT: 'project',
            TRAVEL: 'travel',
            WORK: 'work',
            LIBRARY: 'library',
            EXAM: 'exam',
            EVENT: 'event',
            SHOPPING: 'shopping',
            IDEA: 'idea',
            INVESTMENT: 'investment'
        };

        const TYPE_ICONS = {
            entry: '📝',
            goal: '🎯',
            project: '📁',
            travel: '✈️',
            work: '💼',
            library: '📚',
            exam: '📚',
            event: '🎭',
            shopping: '🛒',
            idea: '💡',
            investment: '📊'
        };

        const TYPE_LABELS = {
            entry: 'Entrada',
            goal: 'Objetivo',
            project: 'Proyecto',
            travel: 'Viaje',
            work: 'Trabajo',
            library: 'Cultura',
            exam: 'Examen',
            event: 'Evento',
            shopping: 'Lista',
            idea: 'Idea',
            investment: 'Inversión'
        };

        const DEFAULT_COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#e67e22', '#e84393', '#00b894', '#6c5ce7',
            '#fd79a8', '#0984e3', '#fdcb6e', '#00cec9', '#a29bfe'
        ];

        // ============================================================
        //  LOAD / SAVE
        // ============================================================
        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('bitacora_data') || '{}');
                entries = saved.entries || [];
                categories = saved.categories || getDefaultCategories();
            } catch (e) {
                entries = [];
                categories = getDefaultCategories();
            }
            if (!categories || categories.length === 0) categories = getDefaultCategories();
            categories.forEach(c => { if (!c.id) c.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); });
            filteredEntries = [...entries];
        }

        function saveData() {
            localStorage.setItem('bitacora_data', JSON.stringify({ entries, categories }));
        }

        function getDefaultCategories() {
            return [
                { id: 'cat_general', name: 'General', color: '#6b7280' },
                { id: 'cat_viaje', name: 'Viaje', color: '#e84393' },
                { id: 'cat_objetivo', name: 'Objetivo', color: '#6c5ce7' },
                { id: 'cat_proyecto', name: 'Proyecto', color: '#00b894' },
                { id: 'cat_trabajo', name: 'Trabajo', color: '#e67e22' },
                { id: 'cat_libro', name: 'Libro', color: '#3498db' },
                { id: 'cat_pelicula', name: 'Película', color: '#f39c12' },
                { id: 'cat_serie', name: 'Serie', color: '#9b59b6' },
                { id: 'cat_videojuego', name: 'Videojuego', color: '#e74c3c' },
                { id: 'cat_examen', name: 'Examen', color: '#8b5cf6' },
                { id: 'cat_evento', name: 'Evento', color: '#ec4899' },
                { id: 'cat_lista', name: 'Lista', color: '#14b8a6' },
                { id: 'cat_idea', name: 'Idea', color: '#f59e0b' },
                { id: 'cat_inversion', name: 'Inversión', color: '#10b981' },
            ];
        }

        // ============================================================
        //  THEME / MODE
        // ============================================================
        function loadTheme() {
            const theme = localStorage.getItem('bitacora_theme') || 'dark';
            if (theme === 'light') document.body.classList.add('light');
            else document.body.classList.remove('light');
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            localStorage.setItem('bitacora_theme', document.body.classList.contains('light') ? 'light' : 'dark');
        }

        let modeWide = false;

        function toggleMode() {
            modeWide = !modeWide;
            document.getElementById('app').style.maxWidth = modeWide ? '100%' : '1200px';
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = isError ? 'error' : '';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-nav button, #mobile-menu-panel .menu-nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            const titles = {
                'calendar': 'Calendario',
                'home': 'Centro resumen',
                'stats': 'Estadísticas',
                'goals': 'Objetivos',
                'projects': 'Proyectos',
                'travels': 'Viajes',
                'work': 'Trabajo',
                'cultura': 'Cultura',
                'exams': 'Exámenes',
                'events': 'Eventos',
                'shopping': 'Listas',
                'ideas': 'Ideas',
                'investments': 'Inversiones'
            };
            document.getElementById('page-title').textContent = titles[view] || 'Calendario';
            render();
        }

        // ============================================================
        //  MOBILE MENU
        // ============================================================
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu-overlay');
            const panel = document.getElementById('mobile-menu-panel');
            overlay.classList.toggle('open');
            panel.classList.toggle('open');
        }

        // ============================================================
        //  FAB MENU
        // ============================================================
        function toggleFabMenu() {
            document.getElementById('fab-menu').classList.toggle('open');
        }

        function closeFabMenu() {
            document.getElementById('fab-menu').classList.remove('open');
        }

        // ============================================================
        //  OPEN NEW ENTRY
        // ============================================================
        function openNewEntry(type) {
            closeFabMenu();
            editId = null;
            editType = type;
            document.getElementById('modal-container').innerHTML = renderEntryModal(type, null);
        }

        // ============================================================
        //  OPEN EDIT ENTRY
        // ============================================================
        function openEditEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editId = id;
            editType = entry.type;
            document.getElementById('modal-container').innerHTML = renderEntryModal(entry.type, entry);
        }

        // ============================================================
        //  CLOSE MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editId = null;
            editType = null;
        }

        // ============================================================
        //  RENDER ENTRY MODAL
        // ============================================================
        function renderEntryModal(type, entry) {
            const isEdit = !!entry;
            const today = new Date().toISOString().slice(0, 10);
            const icon = TYPE_ICONS[type] || '📌';
            const label = TYPE_LABELS[type] || 'Entrada';
            const title = isEdit ? `Editar ${label}` : `Nuevo ${label}`;

            let extraFields = '';

            if (type === 'exam') {
                extraFields = `
                    <div class="modal-label">Titulación / Asignatura</div>
                    <input id="modal-subject" class="modal-input" value="${isEdit ? entry.subject || '' : ''}" placeholder="Ej: Álgebra Lineal">
                    <div class="modal-label">Tipo</div>
                    <select id="modal-exam-type" class="modal-input">
                        <option value="examen" ${isEdit && entry.examType === 'examen' ? 'selected' : ''}>Examen</option>
                        <option value="trabajo" ${isEdit && entry.examType === 'trabajo' ? 'selected' : ''}>Trabajo</option>
                        <option value="practica" ${isEdit && entry.examType === 'practica' ? 'selected' : ''}>Práctica</option>
                        <option value="titulacion" ${isEdit && entry.examType === 'titulacion' ? 'selected' : ''}>Titulación</option>
                    </select>
                    <div class="modal-row">
                        <div><div class="modal-label">Peso (%)</div><input type="number" id="modal-weight" class="modal-input" value="${isEdit ? entry.weight || 0 : 0}" min="0" max="100" step="0.5"></div>
                        <div><div class="modal-label">Nota</div><input type="number" id="modal-grade" class="modal-input" value="${isEdit ? entry.grade || '' : ''}" min="0" max="10" step="0.1" placeholder="0-10"></div>
                    </div>
                    <div class="modal-label">Fecha del examen</div>
                    <input type="date" id="modal-exam-date" class="modal-input" value="${isEdit ? entry.examDate || '' : ''}">
                    <div class="modal-label">Estado</div>
                    <select id="modal-exam-status" class="modal-input">
                        <option value="Pendiente" ${isEdit && entry.examStatus === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="Aprobado" ${isEdit && entry.examStatus === 'Aprobado' ? 'selected' : ''}>Aprobado</option>
                        <option value="Suspenso" ${isEdit && entry.examStatus === 'Suspenso' ? 'selected' : ''}>Suspenso</option>
                        <option value="Matrícula" ${isEdit && entry.examStatus === 'Matrícula' ? 'selected' : ''}>Matrícula</option>
                    </select>
                `;
            } else if (type === 'event') {
                extraFields = `
                    <div class="modal-label">Lugar</div>
                    <input id="modal-place" class="modal-input" value="${isEdit ? entry.place || '' : ''}" placeholder="Ej: Wembley Stadium">
                    <div class="modal-label">Fecha del evento</div>
                    <input type="date" id="modal-event-date" class="modal-input" value="${isEdit ? entry.eventDate || '' : ''}">
                    <div class="modal-label">Acompañantes</div>
                    <input id="modal-companions" class="modal-input" value="${isEdit ? entry.companions || '' : ''}" placeholder="Ana, Carlos, ...">
                    <div class="modal-label">Valoración (1-10)</div>
                    <input type="number" id="modal-event-rating" class="modal-input" value="${isEdit ? entry.eventRating || 5 : 5}" min="1" max="10">
                    <div class="modal-label">Notas</div>
                    <textarea id="modal-event-notes" class="modal-input" rows="2" placeholder="Experiencia, recuerdos...">${isEdit ? entry.eventNotes || '' : ''}</textarea>
                `;
            } else if (type === 'shopping') {
                extraFields = `
                    <div class="modal-label">Categoría</div>
                    <select id="modal-list-category" class="modal-input">
                        <option value="Alimentación" ${isEdit && entry.listCategory === 'Alimentación' ? 'selected' : ''}>Alimentación</option>
                        <option value="Hogar" ${isEdit && entry.listCategory === 'Hogar' ? 'selected' : ''}>Hogar</option>
                        <option value="Tecnología" ${isEdit && entry.listCategory === 'Tecnología' ? 'selected' : ''}>Tecnología</option>
                        <option value="Ropa" ${isEdit && entry.listCategory === 'Ropa' ? 'selected' : ''}>Ropa</option>
                        <option value="Ocio" ${isEdit && entry.listCategory === 'Ocio' ? 'selected' : ''}>Ocio</option>
                        <option value="Otro" ${isEdit && entry.listCategory === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select>
                    <div class="modal-label">Precio estimado (€)</div>
                    <input type="number" id="modal-list-price" class="modal-input" value="${isEdit ? entry.listPrice || '' : ''}" step="0.01" placeholder="0.00">
                    <div class="modal-label">Prioridad</div>
                    <select id="modal-list-priority" class="modal-input">
                        <option value="Alta" ${isEdit && entry.listPriority === 'Alta' ? 'selected' : ''}>Alta</option>
                        <option value="Media" ${isEdit && entry.listPriority === 'Media' ? 'selected' : ''}>Media</option>
                        <option value="Baja" ${isEdit && entry.listPriority === 'Baja' ? 'selected' : ''}>Baja</option>
                    </select>
                    <div class="modal-label">Comprado</div>
                    <select id="modal-list-done" class="modal-input">
                        <option value="0" ${isEdit && !entry.listDone ? 'selected' : ''}>No</option>
                        <option value="1" ${isEdit && entry.listDone ? 'selected' : ''}>Sí</option>
                    </select>
                `;
            } else if (type === 'idea') {
                extraFields = `
                    <div class="modal-label">Categoría</div>
                    <select id="modal-idea-category" class="modal-input">
                        <option value="Proyecto" ${isEdit && entry.ideaCategory === 'Proyecto' ? 'selected' : ''}>Proyecto</option>
                        <option value="Personal" ${isEdit && entry.ideaCategory === 'Personal' ? 'selected' : ''}>Personal</option>
                        <option value="Trabajo" ${isEdit && entry.ideaCategory === 'Trabajo' ? 'selected' : ''}>Trabajo</option>
                        <option value="Creativa" ${isEdit && entry.ideaCategory === 'Creativa' ? 'selected' : ''}>Creativa</option>
                        <option value="Otro" ${isEdit && entry.ideaCategory === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select>
                    <div class="modal-label">Contenido</div>
                    <textarea id="modal-idea-content" class="modal-input" rows="4" placeholder="Describe tu idea...">${isEdit ? entry.ideaContent || '' : ''}</textarea>
                    <div class="modal-label">Estado</div>
                    <select id="modal-idea-status" class="modal-input">
                        <option value="Pendiente" ${isEdit && entry.ideaStatus === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="En progreso" ${isEdit && entry.ideaStatus === 'En progreso' ? 'selected' : ''}>En progreso</option>
                        <option value="Completada" ${isEdit && entry.ideaStatus === 'Completada' ? 'selected' : ''}>Completada</option>
                        <option value="Descartada" ${isEdit && entry.ideaStatus === 'Descartada' ? 'selected' : ''}>Descartada</option>
                    </select>
                `;
            } else if (type === 'investment') {
                extraFields = `
                    <div class="modal-label">Tipo</div>
                    <select id="modal-inv-type" class="modal-input">
                        <option value="Acciones" ${isEdit && entry.invType === 'Acciones' ? 'selected' : ''}>Acciones</option>
                        <option value="Fondos" ${isEdit && entry.invType === 'Fondos' ? 'selected' : ''}>Fondos</option>
                        <option value="Criptomonedas" ${isEdit && entry.invType === 'Criptomonedas' ? 'selected' : ''}>Criptomonedas</option>
                        <option value="Bonos" ${isEdit && entry.invType === 'Bonos' ? 'selected' : ''}>Bonos</option>
                        <option value="Inmobiliaria" ${isEdit && entry.invType === 'Inmobiliaria' ? 'selected' : ''}>Inmobiliaria</option>
                        <option value="Otro" ${isEdit && entry.invType === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select>
                    <div class="modal-label">Cantidad invertida (€)</div>
                    <input type="number" id="modal-inv-invested" class="modal-input" value="${isEdit ? entry.invInvested || '' : ''}" step="0.01" placeholder="0.00">
                    <div class="modal-label">Valor actual (€)</div>
                    <input type="number" id="modal-inv-current" class="modal-input" value="${isEdit ? entry.invCurrent || '' : ''}" step="0.01" placeholder="0.00">
                    <div class="modal-label">Fecha de inversión</div>
                    <input type="date" id="modal-inv-date" class="modal-input" value="${isEdit ? entry.invDate || '' : ''}">
                    <div class="modal-label">Notas</div>
                    <textarea id="modal-inv-notes" class="modal-input" rows="2" placeholder="Detalles adicionales...">${isEdit ? entry.invNotes || '' : ''}</textarea>
                `;
            } else {
                // Para los tipos básicos, campos comunes
                extraFields = `
                    <div class="modal-label">Notas</div>
                    <textarea id="modal-notes" class="modal-input" rows="2" placeholder="Detalles adicionales...">${isEdit ? entry.notes || '' : ''}</textarea>
                `;
            }

            const catOptions = categories.map(c =>
                `<option value="${c.id}" ${isEdit && entry?.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">
                        ${icon} ${title}
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>

                    <div class="modal-label">Fecha</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit ? entry.date : today}">

                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? entry.title : ''}" placeholder="Escribe un título...">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input">
                        ${catOptions}
                        <option value="__new">+ Crear nueva categoría</option>
                    </select>

                    ${extraFields}

                    <button class="btn-modal-primary" onclick="saveEntry()">Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteEntry('${entry.id}')">Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        // ============================================================
        //  SAVE ENTRY (UNIFICADO)
        // ============================================================
        function saveEntry() {
            const date = document.getElementById('modal-date').value;
            if (!date) { showToast('Selecciona una fecha', true); return; }

            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            let categoryId = document.getElementById('modal-category').value;

            if (categoryId === '__new') {
                const newCatName = prompt('Nombre de la nueva categoría:');
                if (!newCatName) { showToast('Escribe un nombre', true); return; }
                const color = DEFAULT_COLORS[Math.floor(Math.random() * DEFAULT_COLORS.length)];
                const newCat = { id: 'cat_' + Date.now(), name: newCatName, color: color };
                categories.push(newCat);
                categoryId = newCat.id;
                saveData();
            }

            const type = editType;
            const entry = {
                id: editId || 'entry_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                date: date,
                title: title,
                categoryId: categoryId,
                type: type
            };

            // Campos específicos
            if (type === 'exam') {
                entry.subject = document.getElementById('modal-subject')?.value?.trim() || '';
                entry.examType = document.getElementById('modal-exam-type')?.value || 'examen';
                entry.weight = parseFloat(document.getElementById('modal-weight')?.value) || 0;
                entry.grade = parseFloat(document.getElementById('modal-grade')?.value) || null;
                entry.examDate = document.getElementById('modal-exam-date')?.value || '';
                entry.examStatus = document.getElementById('modal-exam-status')?.value || 'Pendiente';
            } else if (type === 'event') {
                entry.place = document.getElementById('modal-place')?.value?.trim() || '';
                entry.eventDate = document.getElementById('modal-event-date')?.value || '';
                entry.companions = document.getElementById('modal-companions')?.value?.trim() || '';
                entry.eventRating = parseInt(document.getElementById('modal-event-rating')?.value) || 5;
                entry.eventNotes = document.getElementById('modal-event-notes')?.value?.trim() || '';
            } else if (type === 'shopping') {
                entry.listCategory = document.getElementById('modal-list-category')?.value || 'Otro';
                entry.listPrice = parseFloat(document.getElementById('modal-list-price')?.value) || null;
                entry.listPriority = document.getElementById('modal-list-priority')?.value || 'Media';
                entry.listDone = document.getElementById('modal-list-done')?.value === '1';
            } else if (type === 'idea') {
                entry.ideaCategory = document.getElementById('modal-idea-category')?.value || 'Otro';
                entry.ideaContent = document.getElementById('modal-idea-content')?.value?.trim() || '';
                entry.ideaStatus = document.getElementById('modal-idea-status')?.value || 'Pendiente';
            } else if (type === 'investment') {
                entry.invType = document.getElementById('modal-inv-type')?.value || 'Otro';
                entry.invInvested = parseFloat(document.getElementById('modal-inv-invested')?.value) || 0;
                entry.invCurrent = parseFloat(document.getElementById('modal-inv-current')?.value) || 0;
                entry.invDate = document.getElementById('modal-inv-date')?.value || '';
                entry.invNotes = document.getElementById('modal-inv-notes')?.value?.trim() || '';
            } else {
                entry.notes = document.getElementById('modal-notes')?.value?.trim() || '';
            }

            if (editId) {
                const idx = entries.findIndex(e => e.id === editId);
                if (idx >= 0) entries[idx] = entry;
            } else {
                entries.push(entry);
            }

            entries.sort((a, b) => b.date.localeCompare(a.date));
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Guardado');
        }

        // ============================================================
        //  DELETE ENTRY
        // ============================================================
        function deleteEntry(id) {
            if (!confirm('¿Eliminar esta entrada?')) return;
            entries = entries.filter(e => e.id !== id);
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Eliminado');
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const data = { entries, categories };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bitacora_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exportado');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entries) entries = data.entries;
                    if (data.categories) categories = data.categories;
                    filteredEntries = [...entries];
                    saveData();
                    render();
                    showToast('Importado correctamente');
                } catch (err) {
                    showToast('Error al importar', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function render() {
            const content = document.getElementById('content');
            if (currentView === 'calendar') content.innerHTML = renderCalendar();
            else if (currentView === 'home') content.innerHTML = renderHome();
            else if (currentView === 'stats') content.innerHTML = renderStats();
            else if (currentView === 'goals') content.innerHTML = renderGoals();
            else if (currentView === 'projects') content.innerHTML = renderProjects();
            else if (currentView === 'travels') content.innerHTML = renderTravels();
            else if (currentView === 'work') content.innerHTML = renderWork();
            else if (currentView === 'cultura') content.innerHTML = renderCultura();
            else if (currentView === 'exams') content.innerHTML = renderExams();
            else if (currentView === 'events') content.innerHTML = renderEvents();
            else if (currentView === 'shopping') content.innerHTML = renderShopping();
            else if (currentView === 'ideas') content.innerHTML = renderIdeas();
            else if (currentView === 'investments') content.innerHTML = renderInvestments();
        }

        // ============================================================
        //  RENDER: CALENDAR
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function renderCalendar() {
            const entriesByDate = {};
            entries.forEach(e => {
                if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
                entriesByDate[e.date].push(e);
            });

            const today = new Date().toISOString().slice(0, 10);
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const offset = (firstDay + 6) % 7;

            const prevMonth = new Date(calYear, calMonth, 0);
            const daysInPrevMonth = prevMonth.getDate();

            let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(-1)">‹</button>
                <span style="font-size:17px;font-weight:700">${monthNames[calMonth]} ${calYear}</span>
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(1)">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;

            dayNames.forEach(d => {
                html +=
                    `<div style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;padding:6px 0 10px 0">${d}</div>`;
            });

            for (let i = 0; i < offset; i++) {
                const day = daysInPrevMonth - offset + i + 1;
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${day}</span></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr =
                    `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayEntries = entriesByDate[dateStr] || [];

                const colors = [];
                const seen = new Set();
                dayEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    if (cat && !seen.has(cat.color)) {
                        seen.add(cat.color);
                        colors.push(cat.color);
                    }
                });

                const barsHtml = colors.slice(0, 4).map(color =>
                    `<span style="width:20px;height:3px;border-radius:4px;display:block;background:${color}"></span>`
                ).join('');

                const extra = colors.length > 4 ?
                    `<span style="width:12px;height:3px;border-radius:4px;display:block;background:#6b7280;font-size:7px;text-align:center">+${colors.length - 4}</span>` :
                    '';

                html += `
                <div style="background:#12121f;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid ${isToday ? '#e2e8f0' : 'transparent'};cursor:pointer;transition:background 0.15s ease" onclick="switchView('calendar');showDayEntries('${dateStr}')">
                    <span style="font-size:13px;font-weight:700;display:block;margin-bottom:4px">${d}</span>
                    <div style="display:flex;flex-direction:column;gap:2px;align-items:center">${barsHtml}${extra}</div>
                </div>`;
            }

            const totalDays = offset + daysInMonth;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${d}</span></div>`;
            }

            html += `</div>`;

            if (window._selectedDate) {
                html += renderDayEntries(window._selectedDate);
            }

            html += `
            <style>
                body.light .calendar-day { background: #ffffff !important; border-color: #e2e8f0 !important; }
                body.light .calendar-day:hover { background: #f5f5f7 !important; }
                body.light .calendar-day.today { border-color: #1c1c1e !important; }
            </style>`;

            return html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11;
                calYear--; }
            if (calMonth > 11) { calMonth = 0;
                calYear++; }
            render();
        }

        function showDayEntries(date) {
            window._selectedDate = date;
            render();
        }

        function renderDayEntries(date) {
            const dayEntries = entries.filter(e => e.date === date);
            if (!dayEntries.length) return '';

            const dateObj = new Date(date + 'T12:00:00');
            const dateLabel = dateObj.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long',
                day: 'numeric' });

            let html = `
            <div style="margin-top:20px">
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <span>${dateLabel}</span>
                    <button class="btn-secondary" onclick="window._selectedDate=null;render()">✕ Cerrar</button>
                </div>`;

            dayEntries.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const catName = cat?.name || 'Sin categoría';
                const icon = TYPE_ICONS[e.type] || '📌';

                html += `
                <div class="entry-item" onclick="openEditEntry('${e.id}')">
                    <div class="entry-color-dot" style="background:${color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${icon} ${e.title}</div>
                        <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                    </div>
                    <div class="entry-actions">
                        <button onclick="event.stopPropagation();openEditEntry('${e.id}')">✎</button>
                        <button class="delete" onclick="event.stopPropagation();deleteEntry('${e.id}')">✕</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: HOME (Centro resumen)
        // ============================================================
        function renderHome() {
            const today = new Date().toISOString().slice(0, 10);
            const todayEntries = entries.filter(e => e.date === today);

            const activeGoals = entries.filter(e => e.type === 'goal' && e.status !== 'Completado');
            const activeProjects = entries.filter(e => e.type === 'project' && e.status !== 'Completado');

            // Próximos eventos
            const upcoming = entries.filter(e => {
                if (e.type === 'travel' && e.startDate && e.startDate > today) return true;
                if (e.type === 'project' && e.endDate && e.endDate > today) return true;
                if (e.type === 'goal' && e.deadline && e.deadline > today) return true;
                if (e.type === 'work' && e.endDate && e.endDate > today) return true;
                if (e.type === 'event' && e.eventDate && e.eventDate > today) return true;
                if (e.type === 'exam' && e.examDate && e.examDate > today) return true;
                return false;
            }).sort((a, b) => {
                const dateA = a.startDate || a.endDate || a.deadline || a.eventDate || a.examDate || '';
                const dateB = b.startDate || b.endDate || b.deadline || b.eventDate || b.examDate || '';
                return dateA.localeCompare(dateB);
            }).slice(0, 5);

            const recentEntries = entries.slice(0, 5);

            let html = `
            <div style="max-width:800px">
                <div style="font-size:13px;color:#6b7280;margin-bottom:4px">${new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
                <div style="font-size:15px;font-weight:600;margin-bottom:20px">${todayEntries.length} entradas hoy</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Objetivos activos</div><div class="card-value">${activeGoals.length}</div></div>
                    <div class="card"><div class="card-title">Proyectos activos</div><div class="card-value">${activeProjects.length}</div></div>
                    <div class="card"><div class="card-title">Viajes</div><div class="card-value">${entries.filter(e=>e.type==='travel').length}</div></div>
                    <div class="card"><div class="card-title">Cultura</div><div class="card-value">${entries.filter(e=>e.type==='library').length}</div></div>
                    <div class="card"><div class="card-title">Exámenes</div><div class="card-value">${entries.filter(e=>e.type==='exam').length}</div></div>
                    <div class="card"><div class="card-title">Inversiones</div><div class="card-value">${entries.filter(e=>e.type==='investment').length}</div></div>
                </div>

                ${upcoming.length ? `
                    <div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">📅 Próximamente</div>
                    ${upcoming.map(e => {
                        const cat = categories.find(c => c.id === e.categoryId);
                        const color = cat?.color || '#6b7280';
                        const icon = TYPE_ICONS[e.type] || '📌';
                        const dateInfo = e.startDate || e.endDate || e.deadline || e.eventDate || e.examDate || '';
                        return `
                            <div class="entry-item" onclick="switchView('calendar');showDayEntries('${dateInfo}')">
                                <div class="entry-color-dot" style="background:${color}"></div>
                                <div class="entry-info">
                                    <div class="entry-title">${icon} ${e.title}</div>
                                    <div class="entry-meta">${dateInfo}</div>
                                </div>
                            </div>`;
                    }).join('')}
                ` : ''}

                <div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">Actividad reciente</div>
                ${recentEntries.length ? recentEntries.map(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const icon = TYPE_ICONS[e.type] || '📌';
                    return `
                        <div class="entry-item" onclick="switchView('calendar');showDayEntries('${e.date}')">
                            <div class="entry-color-dot" style="background:${color}"></div>
                            <div class="entry-info">
                                <div class="entry-title">${icon} ${e.title}</div>
                                <div class="entry-meta">${e.date}</div>
                            </div>
                        </div>`;
                }).join('') : `<div style="color:#6b7280;padding:12px 0">No hay actividad reciente</div>`}
            </div>`;

            return html;
        }

        // ============================================================
        //  RENDER: STATS
        // ============================================================
        function renderStats() {
            const totalEntries = entries.length;
            const byType = {};
            Object.keys(ENTRY_TYPES).forEach(key => {
                const type = ENTRY_TYPES[key];
                byType[type] = entries.filter(e => e.type === type).length;
            });

            const monthCount = {};
            entries.forEach(e => {
                const m = e.date.slice(0, 7);
                if (!monthCount[m]) monthCount[m] = 0;
                monthCount[m]++;
            });
            const sortedMonths = Object.keys(monthCount).sort().slice(-6);
            const maxMonth = Math.max(...Object.values(monthCount), 1);

            let html = `
            <div style="max-width:700px">
                <div style="font-size:20px;font-weight:800;margin-bottom:4px">Estadísticas</div>
                <div style="color:#6b7280;margin-bottom:20px">Resumen de tu actividad</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Total entradas</div><div class="card-value">${totalEntries}</div></div>
                    <div class="card"><div class="card-title">Objetivos</div><div class="card-value">${byType.goal || 0}</div></div>
                    <div class="card"><div class="card-title">Proyectos</div><div class="card-value">${byType.project || 0}</div></div>
                    <div class="card"><div class="card-title">Viajes</div><div class="card-value">${byType.travel || 0}</div></div>
                    <div class="card"><div class="card-title">Trabajo</div><div class="card-value">${byType.work || 0}</div></div>
                    <div class="card"><div class="card-title">Cultura</div><div class="card-value">${byType.library || 0}</div></div>
                    <div class="card"><div class="card-title">Exámenes</div><div class="card-value">${byType.exam || 0}</div></div>
                    <div class="card"><div class="card-title">Eventos</div><div class="card-value">${byType.event || 0}</div></div>
                    <div class="card"><div class="card-title">Ideas</div><div class="card-value">${byType.idea || 0}</div></div>
                    <div class="card"><div class="card-title">Inversiones</div><div class="card-value">${byType.investment || 0}</div></div>
                </div>`;

            if (sortedMonths.length) {
                html += `
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:20px 0 12px 0">Entradas por mes</div>
                <div style="display:flex;gap:8px;align-items:flex-end;height:100px;padding-top:8px">`;
                sortedMonths.forEach(m => {
                    const count = monthCount[m] || 0;
                    const pct = (count / maxMonth) * 100;
                    const label = m.slice(5);
                    html += `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                        <div style="font-weight:600;font-size:12px">${count}</div>
                        <div style="width:100%;height:${Math.max(4, pct)}px;background:#3a3a5c;border-radius:4px 4px 0 0;min-height:4px"></div>
                        <div style="font-size:10px;color:#6b7280">${label}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: EXAMS
        // ============================================================
        function renderExams() {
            const exams = entries.filter(e => e.type === 'exam');
            if (!exams.length) {
                return `<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-title">Sin exámenes</div><div class="empty-sub">Pulsa el botón + y selecciona "Examen"</div></div>`;
            }

            // Agrupar por asignatura para calcular nota final
            const subjects = {};
            exams.forEach(e => {
                const key = e.subject || 'Sin asignatura';
                if (!subjects[key]) subjects[key] = { entries: [], totalWeight: 0, weightedSum: 0 };
                subjects[key].entries.push(e);
                if (e.grade !== null && e.grade !== undefined && e.weight > 0) {
                    subjects[key].totalWeight += e.weight;
                    subjects[key].weightedSum += e.grade * e.weight;
                }
            });

            let html = `
            <div style="max-width:800px">
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:12px">Resumen por asignatura</div>`;

            Object.keys(subjects).forEach(subject => {
                const data = subjects[subject];
                const finalGrade = data.totalWeight > 0 ? Math.round((data.weightedSum / data.totalWeight) * 10) / 10 :
                null;
                const isApproved = finalGrade !== null && finalGrade >= 5;
                const isMatricula = finalGrade !== null && finalGrade >= 9;

                let gradeClass = 'nota-suspenso';
                let gradeLabel = 'Suspenso';
                if (isMatricula) { gradeClass = 'nota-matricula';
                    gradeLabel = 'Matrícula'; } else if (isApproved) { gradeClass = 'nota-aprobado';
                    gradeLabel = 'Aprobado'; }

                html += `
                <div class="card" style="margin-bottom:12px">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${subject}</span>
                        <div>
                            ${finalGrade !== null ? `
                                <span class="nota-final ${gradeClass}">${finalGrade}</span>
                                <span class="badge ${isMatricula ? 'badge-done' : isApproved ? 'badge-progress' : 'badge-pending'}">${gradeLabel}</span>
                            ` : `<span class="badge badge-pending">Sin calificación</span>`}
                        </div>
                    </div>
                    <div style="font-size:12px;color:#6b7280;margin-top:4px">${data.entries.length} elementos · Peso total: ${data.totalWeight}%</div>
                    <div style="margin-top:8px">`;
                data.entries.forEach(e => {
                    const statusClass = e.examStatus === 'Aprobado' ? 'badge-done' : e.examStatus === 'Matrícula' ?
                        'badge-done' : e.examStatus === 'Suspenso' ? 'badge-pending' : 'badge-progress';
                    const icon = e.examType === 'titulacion' ? '🎓' : e.examType === 'trabajo' ? '📄' : e.examType ===
                        'practica' ? '🔬' : '📝';
                    html += `
                        <div class="entry-item" onclick="openEditEntry('${e.id}')" style="cursor:pointer;padding:4px 0">
                            <div class="entry-info">
                                <div style="font-size:13px">${icon} ${e.title}</div>
                                <div style="font-size:11px;color:#6b7280">${e.examType} · Peso: ${e.weight}% ${e.grade !== null ? '· Nota: ' + e.grade : ''}</div>
                            </div>
                            <span class="badge ${statusClass}">${e.examStatus}</span>
                        </div>`;
                });
                html += `</div></div>`;
            });

            // Todas las entradas de exámenes
            html += `
            <div style="font-size:13px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin:20px 0 12px 0">Todos los exámenes</div>
            ${exams.map(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const statusClass = e.examStatus === 'Aprobado' ? 'badge-done' : e.examStatus === 'Matrícula' ? 'badge-done' : e.examStatus === 'Suspenso' ? 'badge-pending' : 'badge-progress';
                return `
                    <div class="entry-item" onclick="openEditEntry('${e.id}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${e.subject || 'Sin asignatura'} · ${e.examType} · ${e.examDate || 'Sin fecha'} ${e.grade !== null ? '· Nota: ' + e.grade : ''}</div>
                        </div>
                        <span class="badge ${statusClass}">${e.examStatus}</span>
                    </div>`;
            }).join('')}
            </div>`;

            return html;
        }

        // ============================================================
        //  RENDER: EVENTS
        // ============================================================
        function renderEvents() {
            const events = entries.filter(e => e.type === 'event');
            if (!events.length) {
                return `<div class="empty-state"><div class="empty-icon">🎭</div><div class="empty-title">Sin eventos</div><div class="empty-sub">Pulsa el botón + y selecciona "Evento"</div></div>`;
            }

            const sorted = [...events].sort((a, b) => (b.eventDate || '').localeCompare(a.eventDate || ''));

            let html = `<div style="max-width:700px">`;
            sorted.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const stars = e.eventRating ? '⭐'.repeat(Math.floor(e.eventRating / 2)) : '';
                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${e.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${e.title}</span>
                        <span style="font-size:13px;color:#6b7280">${e.eventDate || ''}</span>
                    </div>
                    <div style="font-size:13px;color:#6b7280;margin-top:4px">📍 ${e.place || 'Sin lugar'}</div>
                    ${e.companions ? `<div style="font-size:13px;color:#6b7280;margin-top:2px">👥 ${e.companions}</div>` : ''}
                    ${stars ? `<div style="margin-top:4px;font-size:14px">${stars}</div>` : ''}
                    ${e.eventNotes ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${e.eventNotes}</div>` : ''}
                    <div class="entry-color-dot" style="background:${color};margin-top:6px"></div>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: SHOPPING (Listas)
        // ============================================================
        function renderShopping() {
            const items = entries.filter(e => e.type === 'shopping');
            if (!items.length) {
                return `<div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-title">Sin items en listas</div><div class="empty-sub">Pulsa el botón + y selecciona "Lista"</div></div>`;
            }

            const pending = items.filter(e => !e.listDone);
            const done = items.filter(e => e.listDone);

            let html = `
            <div style="max-width:700px">
                <div style="display:flex;gap:16px;margin-bottom:16px">
                    <div class="card" style="flex:1"><div class="card-title">Pendientes</div><div class="card-value">${pending.length}</div></div>
                    <div class="card" style="flex:1"><div class="card-title">Comprados</div><div class="card-value">${done.length}</div></div>
                </div>

                ${pending.length ? `
                    <div style="font-size:13px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:8px">Pendientes</div>
                    ${pending.map(e => {
                        const cat = categories.find(c => c.id === e.categoryId);
                        const color = cat?.color || '#6b7280';
                        const priorityColor = e.listPriority === 'Alta' ? '#dc2626' : e.listPriority === 'Media' ? '#d97706' : '#6b7280';
                        return `
                            <div class="entry-item" onclick="openEditEntry('${e.id}')">
                                <div class="entry-color-dot" style="background:${color}"></div>
                                <div class="entry-info">
                                    <div class="entry-title">${e.title}</div>
                                    <div class="entry-meta">${e.listCategory || 'Sin categoría'} · ${e.listPrice !== null ? e.listPrice + '€' : ''} · <span style="color:${priorityColor}">${e.listPriority}</span></div>
                                </div>
                                <span class="badge badge-pending">Pendiente</span>
                            </div>`;
                    }).join('')}
                ` : ''}

                ${done.length ? `
                    <div style="font-size:13px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin:16px 0 8px 0">Comprados</div>
                    ${done.map(e => {
                        const cat = categories.find(c => c.id === e.categoryId);
                        const color = cat?.color || '#6b7280';
                        return `
                            <div class="entry-item" onclick="openEditEntry('${e.id}')" style="opacity:0.6">
                                <div class="entry-color-dot" style="background:${color}"></div>
                                <div class="entry-info">
                                    <div class="entry-title"><s>${e.title}</s></div>
                                    <div class="entry-meta">${e.listCategory || 'Sin categoría'} · ${e.listPrice !== null ? e.listPrice + '€' : ''}</div>
                                </div>
                                <span class="badge badge-done">✅ Comprado</span>
                            </div>`;
                    }).join('')}
                ` : ''}
            </div>`;

            return html;
        }

        // ============================================================
        //  RENDER: IDEAS
        // ============================================================
        function renderIdeas() {
            const ideas = entries.filter(e => e.type === 'idea');
            if (!ideas.length) {
                return `<div class="empty-state"><div class="empty-icon">💡</div><div class="empty-title">Sin ideas</div><div class="empty-sub">Pulsa el botón + y selecciona "Idea"</div></div>`;
            }

            const sorted = [...ideas].sort((a, b) => b.date.localeCompare(a.date));

            let html = `<div style="max-width:700px">`;
            sorted.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const statusClass = e.ideaStatus === 'Completada' ? 'badge-done' : e.ideaStatus === 'En progreso' ?
                    'badge-progress' : e.ideaStatus === 'Descartada' ? 'badge-pending' : 'badge-pending';
                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${e.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${e.title}</span>
                        <span class="badge ${statusClass}">${e.ideaStatus}</span>
                    </div>
                    <div style="font-size:12px;color:#6b7280;margin-top:4px">${e.ideaCategory || 'Sin categoría'} · ${e.date}</div>
                    ${e.ideaContent ? `<div style="font-size:13px;color:#6b7280;margin-top:6px;white-space:pre-wrap">${e.ideaContent.substring(0, 150)}${e.ideaContent.length > 150 ? '...' : ''}</div>` : ''}
                    <div class="entry-color-dot" style="background:${color};margin-top:6px"></div>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: INVESTMENTS
        // ============================================================
        function renderInvestments() {
            const investments = entries.filter(e => e.type === 'investment');
            if (!investments.length) {
                return `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">Sin inversiones</div><div class="empty-sub">Pulsa el botón + y selecciona "Inversión"</div></div>`;
            }

            let totalInvested = 0;
            let totalCurrent = 0;

            investments.forEach(e => {
                totalInvested += e.invInvested || 0;
                totalCurrent += e.invCurrent || 0;
            });

            const profit = totalCurrent - totalInvested;
            const profitPct = totalInvested > 0 ? Math.round((profit / totalInvested) * 100) : 0;

            let html = `
            <div style="max-width:700px">
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
                    <div class="card"><div class="card-title">Invertido</div><div class="card-value">${totalInvested.toFixed(2)}€</div></div>
                    <div class="card"><div class="card-title">Valor actual</div><div class="card-value">${totalCurrent.toFixed(2)}€</div></div>
                    <div class="card"><div class="card-title">Rentabilidad</div>
                        <div class="card-value ${profit > 0 ? 'inversion-positiva' : profit < 0 ? 'inversion-negativa' : 'inversion-neutral'}">
                            ${profit > 0 ? '+' : ''}${profit.toFixed(2)}€ (${profitPct}%)
                        </div>
                    </div>
                </div>`;

            const sorted = [...investments].sort((a, b) => (b.invDate || '').localeCompare(a.invDate || ''));

            sorted.forEach(e => {
                const profitItem = (e.invCurrent || 0) - (e.invInvested || 0);
                const pctItem = e.invInvested > 0 ? Math.round((profitItem / e.invInvested) * 100) : 0;
                const isPositive = profitItem > 0;
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';

                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${e.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${e.title}</span>
                        <span style="font-size:13px;color:#6b7280">${e.invType || 'Otro'}</span>
                    </div>
                    <div style="display:flex;gap:16px;margin-top:4px;flex-wrap:wrap">
                        <span style="font-size:13px;color:#6b7280">Invertido: ${(e.invInvested || 0).toFixed(2)}€</span>
                        <span style="font-size:13px;color:#6b7280">Actual: ${(e.invCurrent || 0).toFixed(2)}€</span>
                        <span style="font-size:13px;font-weight:700;${isPositive ? 'color:#16a34a' : 'color:#dc2626'}">
                            ${isPositive ? '+' : ''}${profitItem.toFixed(2)}€ (${pctItem}%)
                        </span>
                    </div>
                    ${e.invDate ? `<div style="font-size:12px;color:#6b7280;margin-top:2px">${e.invDate}</div>` : ''}
                    ${e.invNotes ? `<div style="font-size:13px;color:#6b7280;margin-top:4px">${e.invNotes}</div>` : ''}
                    <div class="entry-color-dot" style="background:${color};margin-top:6px"></div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: GOALS, PROJECTS, TRAVELS, WORK, CULTURA
        // ============================================================
        // (Estas funciones se mantienen igual que antes, solo se filtran por tipo)

        function renderGoals() {
            const goals = entries.filter(e => e.type === 'goal');
            if (!goals.length) {
                return `<div class="empty-state"><div class="empty-icon">◉</div><div class="empty-title">Sin objetivos</div><div class="empty-sub">Pulsa el botón + y selecciona "Objetivo"</div></div>`;
            }
            let html = '';
            ['Corto plazo', 'Medio plazo', 'Largo plazo'].forEach(cat => {
                const filtered = goals.filter(g => g.goalCategory === cat);
                if (!filtered.length) return;
                html += `<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">${cat}</div>`;
                filtered.forEach(g => {
                    const pct = g.progress || 0;
                    const color = pct >= 100 ? '#16a34a' : pct >= 50 ? '#d97706' : '#2563eb';
                    const statusClass = g.status === 'Completado' ? 'badge-done' : g.status === 'En progreso' ?
                        'badge-progress' : 'badge-pending';
                    html += `
                        <div class="card" style="margin-bottom:8px;padding:14px 16px;cursor:pointer" onclick="openEditEntry('${g.id}')">
                            <div style="display:flex;justify-content:space-between;align-items:center">
                                <span style="font-weight:600">${g.title}</span>
                                <span class="badge ${statusClass}">${g.status}</span>
                            </div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                            <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:4px">
                                <span>${pct}% completado</span>
                                ${g.deadline ? `<span>Límite: ${g.deadline}</span>` : ''}
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });
            return html;
        }

        function renderProjects() {
            const projects = entries.filter(e => e.type === 'project');
            if (!projects.length) {
                return `<div class="empty-state"><div class="empty-icon">⊞</div><div class="empty-title">Sin proyectos</div><div class="empty-sub">Pulsa el botón + y selecciona "Proyecto"</div></div>`;
            }
            let html = '';
            projects.forEach(p => {
                const totalTasks = p.tasks?.length || 0;
                const doneTasks = p.tasks?.filter(t => t.done).length || 0;
                const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                const statusClass = p.status === 'Completado' ? 'badge-done' : p.status === 'En curso' ?
                    'badge-progress' : 'badge-pending';
                html += `
                    <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${p.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:700;font-size:16px">${p.title}</span>
                            <span class="badge ${statusClass}">${p.status}</span>
                        </div>
                        ${p.description ? `<div style="font-size:13px;color:#6b7280;margin-top:4px">${p.description}</div>` : ''}
                        <div style="font-size:12px;color:#6b7280;margin-top:4px">${p.startDate || ''} ${p.endDate ? '→ ' + p.endDate : ''}</div>
                        ${totalTasks > 0 ? `
                            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:#2563eb"></div></div>
                            <div style="font-size:12px;color:#6b7280;margin-top:4px">${doneTasks}/${totalTasks} tareas</div>
                        ` : ''}
                    </div>`;
            });
            return html;
        }

        function renderTravels() {
            const travels = entries.filter(e => e.type === 'travel');
            if (!travels.length) {
                return `<div class="empty-state"><div class="empty-icon">◈</div><div class="empty-title">Sin viajes</div><div class="empty-sub">Pulsa el botón + y selecciona "Viaje"</div></div>`;
            }
            let html = '';
            travels.forEach(t => {
                const stars = t.rating ? '⭐'.repeat(t.rating) : '';
                html += `
                    <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${t.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:700;font-size:16px">${t.title}</span>
                            <span style="font-size:13px;color:#6b7280">${t.country || ''}</span>
                        </div>
                        <div style="font-size:13px;color:#6b7280;margin-top:4px">${t.startDate || ''} ${t.endDate ? '→ ' + t.endDate : ''}</div>
                        ${stars ? `<div style="margin-top:4px">${stars}</div>` : ''}
                        ${t.notes ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${t.notes}</div>` : ''}
                    </div>`;
            });
            return html;
        }

        function renderWork() {
            const work = entries.filter(e => e.type === 'work');
            if (!work.length) {
                return `<div class="empty-state"><div class="empty-icon">◫</div><div class="empty-title">Sin experiencia laboral</div><div class="empty-sub">Pulsa el botón + y selecciona "Trabajo"</div></div>`;
            }

            const sorted = [...work].sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
            let html =
                `<div style="max-width:700px">`;
            sorted.forEach(w => {
                const typeLabel = w.workType === 'practicas' ? 'Prácticas' : 'Puesto normal';
                html += `
                    <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${w.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:700;font-size:16px">${w.title}</span>
                            <span style="font-size:12px;color:#6b7280">${w.position || ''}</span>
                        </div>
                        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
                            <span style="font-size:12px;color:#6b7280">${w.startDate || ''} ${w.endDate ? '→ ' + w.endDate : '→ Actual'}</span>
                            <span class="badge ${w.workType === 'practicas' ? 'badge-pending' : 'badge-done'}">${typeLabel}</span>
                        </div>
                        ${w.functions ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${w.functions}</div>` : ''}
                        ${w.skills ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">Habilidades: ${w.skills}</div>` : ''}
                    </div>`;
            });
            html += `</div>`;
            return html;
        }

        function renderCultura() {
            const libraryItems = entries.filter(e => e.type === 'library');
            if (!libraryItems.length) {
                return `<div class="empty-state"><div class="empty-icon">◊</div><div class="empty-title">Sin items culturales</div><div class="empty-sub">Pulsa el botón + y selecciona "Cultura"</div></div>`;
            }

            // Libro actual
            const currentBook = libraryItems.filter(b => b.libType === 'libro' && b.startDate && !b.endDate)
                .sort((a, b) => b.startDate.localeCompare(a.startDate))[0];

            let html = `
            <div style="max-width:700px">
                ${currentBook ? `
                    <div class="card" style="margin-bottom:16px;border-left:3px solid #3498db">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:4px">📖 Leyendo actualmente</div>
                        <div style="font-size:18px;font-weight:700">${currentBook.title}</div>
                        <div style="font-size:13px;color:#6b7280">${currentBook.author || 'Autor desconocido'} · Iniciado: ${currentBook.startDate}</div>
                    </div>
                ` : `
                    <div class="card" style="margin-bottom:16px;border-color:#2a2a3a50">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:4px">📖 Leyendo actualmente</div>
                        <div style="font-size:16px;color:#6b7280">No hay ningún libro en curso</div>
                    </div>
                `}

                <div style="font-size:13px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin:16px 0 8px 0">Todos los items</div>
                ${libraryItems.map(e => {
                    const icon = e.libType === 'libro' ? '📖' : e.libType === 'pelicula' ? '🎬' : e.libType === 'serie' ? '📺' : '🎮';
                    const label = e.libType === 'libro' ? 'Libro' : e.libType === 'pelicula' ? 'Película' : e.libType === 'serie' ? 'Serie' : 'Videojuego';
                    const details = `${e.startDate || ''}${e.endDate ? ' → ' + e.endDate : ''}${e.rating ? ' · ⭐'.repeat(e.rating) : ''}`;
                    return `
                        <div class="entry-item" onclick="openEditEntry('${e.id}')">
                            <div class="entry-info">
                                <div class="entry-title">${icon} ${e.title}</div>
                                <div class="entry-meta">${label} · ${e.author || e.platform || ''} ${details}</div>
                            </div>
                        </div>`;
                }).join('')}
            </div>`;

            return html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadTheme();
            loadData();

            if (window.innerWidth <= 768) {
                document.querySelector('.menu-hamburger').style.display = 'block';
            }

            document.getElementById('mobile-menu-overlay').addEventListener('click', function() {
                if (this.classList.contains('open')) toggleMobileMenu();
            });

            document.addEventListener('click', function(e) {
                const fab = document.getElementById('fab');
                const menu = document.getElementById('fab-menu');
                if (!fab.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });

            render();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const isMobile = window.innerWidth <= 768;
                    document.querySelector('.menu-hamburger').style.display = isMobile ? 'block' : 'none';
                }, 200);
            });
        }

        const styleEl = document.createElement('style');
        styleEl.textContent = `
            .btn-secondary.active {
                background: #2a2a3a;
                color: #e2e8f0;
                border-color: #3a3a5c;
            }
            body.light .btn-secondary.active {
                background: #e2e8f0;
                color: #1c1c1e;
                border-color: #d1d1d6;
            }
        `;
        document.head.appendChild(styleEl);

        init();
    </script>

</body>
</html>
