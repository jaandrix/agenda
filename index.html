                    <h1 id="page-title">Calendario</h1>
                </div>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <!-- ===== FAB (Botón flotante +) ===== -->
    <button id="fab" onclick="toggleFabMenu()">+</button>
    <div id="fab-menu">
        <button onclick="openNewEntry('entry')">📝 Entrada</button>
        <button onclick="openNewEntry('goal')">🎯 Objetivo</button>
        <button onclick="openNewEntry('project')">📁 Proyecto</button>
        <button onclick="openNewEntry('travel')">✈️ Viaje</button>
        <button onclick="openNewEntry('work')">💼 Trabajo</button>
        <button onclick="openNewEntry('library')">📚 Cultura</button>
    </div>

    <!-- ===== MOBILE MENU ===== -->
    <div id="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>
    <div id="mobile-menu-panel">
        <div class="menu-header">
            <span class="brand">Bitácora</span>
            <button class="menu-close" onclick="toggleMobileMenu()">✕</button>
        </div>
        <div class="menu-nav">
            <button class="active" onclick="switchView('calendar');toggleMobileMenu()" data-view="calendar">
                <span class="nav-icon">◷</span> Calendario
            </button>
            <button onclick="switchView('home');toggleMobileMenu()" data-view="home">
                <span class="nav-icon">⌂</span> Centro resumen
            </button>
            <button onclick="switchView('stats');toggleMobileMenu()" data-view="stats">
                <span class="nav-icon">▦</span> Estadísticas
            </button>
            <span class="nav-label">Registro</span>
            <button onclick="switchView('goals');toggleMobileMenu()" data-view="goals">
                <span class="nav-icon">◉</span> Objetivos
            </button>
            <button onclick="switchView('projects');toggleMobileMenu()" data-view="projects">
                <span class="nav-icon">⊞</span> Proyectos
            </button>
            <button onclick="switchView('travels');toggleMobileMenu()" data-view="travels">
                <span class="nav-icon">◈</span> Viajes
            </button>
            <button onclick="switchView('work');toggleMobileMenu()" data-view="work">
                <span class="nav-icon">◫</span> Trabajo
            </button>
            <button onclick="switchView('cultura');toggleMobileMenu()" data-view="cultura">
                <span class="nav-icon">◊</span> Cultura
            </button>
        </div>
        <div class="menu-actions">
            <button onclick="exportData()" title="Exportar">⬇</button>
            <button onclick="document.getElementById('import-input').click()" title="Importar">⬆</button>
            <button onclick="toggleTheme()" title="Tema">◐</button>
            <button onclick="toggleMode()" title="Modo">⊞</button>
        </div>
    </div>

    <div id="modal-container"></div>
    <div id="toast"></div>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">

    <script>
        // ============================================================
        //  DATA - TODO UNIFICADO EN ENTRIES
        // ============================================================
        let entries = [];
        let categories = [];
        let editId = null;
        let editType = null;

        // Tipos de entrada
        const ENTRY_TYPES = {
            ENTRY: 'entry',
            GOAL: 'goal',
            PROJECT: 'project',
            TRAVEL: 'travel',
            WORK: 'work',
            LIBRARY: 'library'
        };

        const TYPE_LABELS = {
            entry: 'Entrada',
            goal: 'Objetivo',
            project: 'Proyecto',
            travel: 'Viaje',
            work: 'Trabajo',
            library: 'Cultura'
        };

        const TYPE_ICONS = {
            entry: '📝',
            goal: '🎯',
            project: '📁',
            travel: '✈️',
            work: '💼',
            library: '📚'
        };

        const DEFAULT_COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#e67e22', '#e84393', '#00b894', '#6c5ce7',
            '#fd79a8', '#0984e3', '#fdcb6e', '#00cec9', '#a29bfe'
        ];

        let searchQuery = '';
        let culturaMonth = new Date().getMonth();
        let culturaYear = new Date().getFullYear();
        let libraryView = 'all';
        let filteredEntries = [];

        // ============================================================
        //  LOAD / SAVE
        // ============================================================
        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('bitacora_data') || '{}');
                entries = saved.entries || [];
                categories = saved.categories || getDefaultCategories();
            } catch (e) {
                entries = [];
                categories = getDefaultCategories();
            }
            if (!categories || categories.length === 0) categories = getDefaultCategories();
            categories.forEach(c => { if (!c.id) c.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); });
            filteredEntries = [...entries];
            updateHeader();
        }

        function saveData() {
            localStorage.setItem('bitacora_data', JSON.stringify({ entries, categories }));
            updateHeader();
        }

        function getDefaultCategories() {
            return [
                { id: 'cat_general', name: 'General', color: '#6b7280' },
                { id: 'cat_viaje', name: 'Viaje', color: '#e84393' },
                { id: 'cat_objetivo', name: 'Objetivo', color: '#6c5ce7' },
                { id: 'cat_proyecto', name: 'Proyecto', color: '#00b894' },
                { id: 'cat_trabajo', name: 'Trabajo', color: '#e67e22' },
                { id: 'cat_libro', name: 'Libro', color: '#3498db' },
                { id: 'cat_pelicula', name: 'Película', color: '#f39c12' },
                { id: 'cat_serie', name: 'Serie', color: '#9b59b6' },
                { id: 'cat_videojuego', name: 'Videojuego', color: '#e74c3c' },
            ];
        }

        // ============================================================
        //  THEME / MODE
        // ============================================================
        function loadTheme() {
            const theme = localStorage.getItem('bitacora_theme') || 'dark';
            if (theme === 'light') document.body.classList.add('light');
            else document.body.classList.remove('light');
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            localStorage.setItem('bitacora_theme', document.body.classList.contains('light') ? 'light' : 'dark');
        }

        let modeWide = false;

        function toggleMode() {
            modeWide = !modeWide;
            document.getElementById('app').style.maxWidth = modeWide ? '100%' : '1200px';
        }

        // ============================================================
        //  HEADER
        // ============================================================
        function updateHeader() {
            // No need
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = isError ? 'error' : '';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-nav button, #mobile-menu-panel .menu-nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            const titles = {
                'calendar': 'Calendario',
                'home': 'Centro resumen',
                'stats': 'Estadísticas',
                'goals': 'Objetivos',
                'projects': 'Proyectos',
                'travels': 'Viajes',
                'work': 'Trabajo',
                'cultura': 'Cultura'
            };
            document.getElementById('page-title').textContent = titles[view] || 'Calendario';
            render();
        }

        // ============================================================
        //  MOBILE MENU
        // ============================================================
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu-overlay');
            const panel = document.getElementById('mobile-menu-panel');
            overlay.classList.toggle('open');
            panel.classList.toggle('open');
        }

        // ============================================================
        //  FAB MENU
        // ============================================================
        function toggleFabMenu() {
            document.getElementById('fab-menu').classList.toggle('open');
        }

        function closeFabMenu() {
            document.getElementById('fab-menu').classList.remove('open');
        }

        // ============================================================
        //  SEARCH
        // ============================================================
        let searchTimeout = null;

        function doSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = query.toLowerCase().trim();
                const resultsContainer = document.getElementById('search-results-container');
                if (!resultsContainer) return;

                if (!searchQuery) {
                    resultsContainer.innerHTML = '';
                    return;
                }

                const filtered = entries.filter(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    return e.title.toLowerCase().includes(searchQuery) ||
                        (cat && cat.name.toLowerCase().includes(searchQuery)) ||
                        (e.notes && e.notes.toLowerCase().includes(searchQuery)) ||
                        (e.type && e.type.toLowerCase().includes(searchQuery));
                });

                if (!filtered.length) {
                    resultsContainer.innerHTML =
                        `<div style="margin-top:12px;color:#6b7280;text-align:center;padding:20px">No se encontraron resultados</div>`;
                    return;
                }

                let html =
                    `<div style="margin-top:8px;font-size:12px;color:#6b7280;margin-bottom:8px">${filtered.length} resultados</div>`;
                filtered.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const catName = cat?.name || 'Sin categoría';
                    const icon = TYPE_ICONS[e.type] || '📌';
                    html += `
                    <div class="entry-item" onclick="switchView('calendar');showDayEntries('${e.date}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${icon} ${e.title}</div>
                            <div class="entry-meta">${e.date} · ${catName}</div>
                        </div>
                    </div>`;
                });
                resultsContainer.innerHTML = html;
            }, 200);
        }

        // ============================================================
        //  OPEN NEW ENTRY (FAB)
        // ============================================================
        function openNewEntry(type) {
            closeFabMenu();
            editId = null;
            editType = type;
            document.getElementById('modal-container').innerHTML = renderEntryModal(type, null);
        }

        // ============================================================
        //  OPEN EDIT ENTRY
        // ============================================================
        function openEditEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editId = id;
            editType = entry.type;
            document.getElementById('modal-container').innerHTML = renderEntryModal(entry.type, entry);
        }

        // ============================================================
        //  RENDER ENTRY MODAL
        // ============================================================
        function renderEntryModal(type, entry) {
            const isEdit = !!entry;
            const today = new Date().toISOString().slice(0, 10);
            const typeLabels = {
                entry: 'Entrada',
                goal: 'Objetivo',
                project: 'Proyecto',
                travel: 'Viaje',
                work: 'Trabajo',
                library: 'Cultura'
            };
            const icon = TYPE_ICONS[type] || '📌';

            let title = isEdit ? `Editar ${typeLabels[type]}` : `Nuevo ${typeLabels[type]}`;

            // Campos específicos por tipo
            let extraFields = '';

            if (type === 'goal') {
                extraFields = `
                    <div class="modal-label">Categoría de plazo</div>
                    <select id="modal-goal-category" class="modal-input">
                        <option value="Corto plazo" ${isEdit && entry.goalCategory === 'Corto plazo' ? 'selected' : ''}>Corto plazo</option>
                        <option value="Medio plazo" ${isEdit && entry.goalCategory === 'Medio plazo' ? 'selected' : ''}>Medio plazo</option>
                        <option value="Largo plazo" ${isEdit && entry.goalCategory === 'Largo plazo' ? 'selected' : ''}>Largo plazo</option>
                    </select>
                    <div class="modal-label">Progreso (%)</div>
                    <input type="number" id="modal-progress" class="modal-input" value="${isEdit ? entry.progress || 0 : 0}" min="0" max="100">
                    <div class="modal-label">Fecha límite</div>
                    <input type="date" id="modal-deadline" class="modal-input" value="${isEdit ? entry.deadline || '' : ''}">
                    <div class="modal-label">Estado</div>
                    <select id="modal-status" class="modal-input">
                        <option value="Pendiente" ${isEdit && entry.status === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="En progreso" ${isEdit && entry.status === 'En progreso' ? 'selected' : ''}>En progreso</option>
                        <option value="Completado" ${isEdit && entry.status === 'Completado' ? 'selected' : ''}>Completado</option>
                    </select>
                `;
            } else if (type === 'project') {
                extraFields = `
                    <div class="modal-label">Descripción</div>
                    <textarea id="modal-desc" class="modal-input" rows="2" placeholder="Descripción...">${isEdit ? entry.description || '' : ''}</textarea>
                    <div class="modal-row">
                        <div><div class="modal-label">Inicio</div><input type="date" id="modal-start" class="modal-input" value="${isEdit ? entry.startDate || '' : ''}"></div>
                        <div><div class="modal-label">Fin previsto</div><input type="date" id="modal-end" class="modal-input" value="${isEdit ? entry.endDate || '' : ''}"></div>
                    </div>
                    <div class="modal-label">Estado</div>
                    <select id="modal-status" class="modal-input">
                        <option value="Pendiente" ${isEdit && entry.status === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="En curso" ${isEdit && entry.status === 'En curso' ? 'selected' : ''}>En curso</option>
                        <option value="Completado" ${isEdit && entry.status === 'Completado' ? 'selected' : ''}>Completado</option>
                    </select>
                    <div class="modal-label">Tareas (una por línea, marcar completadas con ✅)</div>
                    <textarea id="modal-tasks" class="modal-input" rows="3" placeholder="Tarea 1&#10;Tarea 2 ✅">${isEdit ? (entry.tasks || []).join('\n') : ''}</textarea>
                `;
            } else if (type === 'travel') {
                extraFields = `
                    <div class="modal-label">País</div>
                    <input id="modal-country" class="modal-input" value="${isEdit ? entry.country || '' : ''}" placeholder="Ej: Italia">
                    <div class="modal-row">
                        <div><div class="modal-label">Inicio</div><input type="date" id="modal-start" class="modal-input" value="${isEdit ? entry.startDate || '' : ''}"></div>
                        <div><div class="modal-label">Fin</div><input type="date" id="modal-end" class="modal-input" value="${isEdit ? entry.endDate || '' : ''}"></div>
                    </div>
                    <div class="modal-label">Valoración (1-5)</div>
                    <select id="modal-rating" class="modal-input">
                        ${[0,1,2,3,4,5].map(r => `<option value="${r}" ${isEdit && entry.rating === r ? 'selected' : ''}>${r === 0 ? 'Sin valorar' : '⭐'.repeat(r)}</option>`).join('')}
                    </select>
                    <div class="modal-label">Recuerdos / Notas</div>
                    <textarea id="modal-notes" class="modal-input" rows="2" placeholder="Experiencias, lugares visitados...">${isEdit ? entry.notes || '' : ''}</textarea>
                `;
            } else if (type === 'work') {
                extraFields = `
                    <div class="modal-label">Empresa</div>
                    <input id="modal-company" class="modal-input" value="${isEdit ? entry.company || '' : ''}" placeholder="Ej: Empresa X">
                    <div class="modal-label">Puesto</div>
                    <input id="modal-position" class="modal-input" value="${isEdit ? entry.position || '' : ''}" placeholder="Ej: Operario logístico">
                    <div class="modal-label">Tipo de puesto</div>
                    <select id="modal-work-type" class="modal-input">
                        <option value="normal" ${isEdit && entry.workType === 'normal' ? 'selected' : ''}>Puesto normal</option>
                        <option value="practicas" ${isEdit && entry.workType === 'practicas' ? 'selected' : ''}>Prácticas</option>
                    </select>
                    <div class="modal-row">
                        <div><div class="modal-label">Inicio</div><input type="date" id="modal-start" class="modal-input" value="${isEdit ? entry.startDate || '' : ''}"></div>
                        <div><div class="modal-label">Fin</div><input type="date" id="modal-end" class="modal-input" value="${isEdit ? entry.endDate || '' : ''}"></div>
                    </div>
                    <div class="modal-label">Días de fiesta</div>
                    <input type="number" id="modal-holidays" class="modal-input" value="${isEdit ? entry.holidays || 0 : 0}" min="0">
                    <div class="modal-label">Funciones</div>
                    <textarea id="modal-functions" class="modal-input" rows="2" placeholder="Funciones realizadas...">${isEdit ? entry.functions || '' : ''}</textarea>
                    <div class="modal-label">Habilidades</div>
                    <input id="modal-skills" class="modal-input" value="${isEdit ? entry.skills || '' : ''}" placeholder="Ej: Gestión de equipos, Excel">
                `;
            } else if (type === 'library') {
                extraFields = `
                    <div class="modal-label">Tipo de contenido</div>
                    <select id="modal-lib-type" class="modal-input">
                        <option value="libro" ${isEdit && entry.libType === 'libro' ? 'selected' : ''}>Libro</option>
                        <option value="pelicula" ${isEdit && entry.libType === 'pelicula' ? 'selected' : ''}>Película</option>
                        <option value="serie" ${isEdit && entry.libType === 'serie' ? 'selected' : ''}>Serie</option>
                        <option value="videojuego" ${isEdit && entry.libType === 'videojuego' ? 'selected' : ''}>Videojuego</option>
                    </select>
                    <div class="modal-label">Autor / Creador</div>
                    <input id="modal-author" class="modal-input" value="${isEdit ? entry.author || '' : ''}" placeholder="Ej: Gabriel García Márquez">
                    <div class="modal-label">Plataforma (opcional)</div>
                    <input id="modal-platform" class="modal-input" value="${isEdit ? entry.platform || '' : ''}" placeholder="Ej: Netflix, PC, PS5">
                    <div class="modal-row">
                        <div><div class="modal-label">Inicio</div><input type="date" id="modal-start" class="modal-input" value="${isEdit ? entry.startDate || '' : ''}"></div>
                        <div><div class="modal-label">Fin</div><input type="date" id="modal-end" class="modal-input" value="${isEdit ? entry.endDate || '' : ''}"></div>
                    </div>
                    <div class="modal-label">Valoración (1-5)</div>
                    <select id="modal-rating" class="modal-input">
                        ${[0,1,2,3,4,5].map(r => `<option value="${r}" ${isEdit && entry.rating === r ? 'selected' : ''}>${r === 0 ? 'Sin valorar' : '⭐'.repeat(r)}</option>`).join('')}
                    </select>
                `;
            }

            const catOptions = categories.map(c =>
                `<option value="${c.id}" ${isEdit && entry?.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">
                        ${icon} ${title}
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>

                    <div class="modal-label">Fecha</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit ? entry.date : today}">

                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? entry.title : ''}" placeholder="Escribe un título...">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input">
                        ${catOptions}
                        <option value="__new">+ Crear nueva categoría</option>
                    </select>

                    ${extraFields}

                    <button class="btn-modal-primary" onclick="saveEntry()">Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteEntry('${entry.id}')">Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        // ============================================================
        //  CLOSE MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editId = null;
            editType = null;
        }

        // ============================================================
        //  SAVE ENTRY (UNIFICADO)
        // ============================================================
        function saveEntry() {
            const date = document.getElementById('modal-date').value;
            if (!date) { showToast('Selecciona una fecha', true); return; }

            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            let categoryId = document.getElementById('modal-category').value;
            const notes = document.getElementById('modal-notes')?.value?.trim() || '';

            if (categoryId === '__new') {
                const newCatName = document.getElementById('modal-new-cat-name')?.value?.trim() || 'Nueva categoría';
                const color = document.getElementById('modal-new-cat-color')?.value || '#6b7280';
                const newCat = { id: 'cat_' + Date.now(), name: newCatName, color: color };
                categories.push(newCat);
                categoryId = newCat.id;
                saveData();
            }

            const type = editType;

            // Construir el objeto entrada
            const entry = {
                id: editId || 'entry_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                date: date,
                title: title,
                categoryId: categoryId,
                notes: notes,
                type: type
            };

            // Campos específicos por tipo
            if (type === 'goal') {
                entry.goalCategory = document.getElementById('modal-goal-category')?.value || 'Medio plazo';
                entry.progress = parseInt(document.getElementById('modal-progress')?.value) || 0;
                entry.deadline = document.getElementById('modal-deadline')?.value || '';
                entry.status = document.getElementById('modal-status')?.value || 'Pendiente';
            } else if (type === 'project') {
                entry.description = document.getElementById('modal-desc')?.value?.trim() || '';
                entry.startDate = document.getElementById('modal-start')?.value || '';
                entry.endDate = document.getElementById('modal-end')?.value || '';
                entry.status = document.getElementById('modal-status')?.value || 'Pendiente';
                const tasksRaw = document.getElementById('modal-tasks')?.value?.split('\n').filter(t => t.trim()) || [];
                entry.tasks = tasksRaw.map(t => ({ text: t.replace(' ✅', '').trim(), done: t.includes('✅') }));
            } else if (type === 'travel') {
                entry.country = document.getElementById('modal-country')?.value?.trim() || '';
                entry.startDate = document.getElementById('modal-start')?.value || '';
                entry.endDate = document.getElementById('modal-end')?.value || '';
                entry.rating = parseInt(document.getElementById('modal-rating')?.value) || 0;
                entry.notes = document.getElementById('modal-notes')?.value?.trim() || '';
            } else if (type === 'work') {
                entry.company = document.getElementById('modal-company')?.value?.trim() || '';
                entry.position = document.getElementById('modal-position')?.value?.trim() || '';
                entry.workType = document.getElementById('modal-work-type')?.value || 'normal';
                entry.startDate = document.getElementById('modal-start')?.value || '';
                entry.endDate = document.getElementById('modal-end')?.value || '';
                entry.holidays = parseInt(document.getElementById('modal-holidays')?.value) || 0;
                entry.functions = document.getElementById('modal-functions')?.value?.trim() || '';
                entry.skills = document.getElementById('modal-skills')?.value?.trim() || '';
            } else if (type === 'library') {
                entry.libType = document.getElementById('modal-lib-type')?.value || 'libro';
                entry.author = document.getElementById('modal-author')?.value?.trim() || '';
                entry.platform = document.getElementById('modal-platform')?.value?.trim() || '';
                entry.startDate = document.getElementById('modal-start')?.value || '';
                entry.endDate = document.getElementById('modal-end')?.value || '';
                entry.rating = parseInt(document.getElementById('modal-rating')?.value) || 0;
            }

            if (editId) {
                const idx = entries.findIndex(e => e.id === editId);
                if (idx >= 0) entries[idx] = entry;
            } else {
                entries.push(entry);
            }

            entries.sort((a, b) => b.date.localeCompare(a.date));
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Guardado');
        }

        // ============================================================
        //  DELETE ENTRY
        // ============================================================
        function deleteEntry(id) {
            if (!confirm('¿Eliminar esta entrada?')) return;
            entries = entries.filter(e => e.id !== id);
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Eliminado');
        }

        // ============================================================
        //  CALCULAR DÍAS LABORABLES (para trabajo)
        // ============================================================
        function calcularDiasLaborables(fechaInicio, fechaFin, diasFiesta) {
            if (!fechaInicio || !fechaFin) return 0;
            const inicio = new Date(fechaInicio + 'T12:00:00');
            const fin = new Date(fechaFin + 'T12:00:00');
            let count = 0;
            const current = new Date(inicio);
            while (current <= fin) {
                const day = current.getDay();
                if (day !== 0 && day !== 6) count++;
                current.setDate(current.getDate() + 1);
            }
            return Math.max(0, count - (diasFiesta || 0));
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const data = { entries, categories };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bitacora_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exportado');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entries) entries = data.entries;
                    if (data.categories) categories = data.categories;
                    filteredEntries = [...entries];
                    saveData();
                    render();
                    showToast('Importado correctamente');
                } catch (err) {
                    showToast('Error al importar', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function render() {
            const content = document.getElementById('content');
            if (currentView === 'calendar') content.innerHTML = renderCalendar();
            else if (currentView === 'home') content.innerHTML = renderHome();
            else if (currentView === 'stats') content.innerHTML = renderStats();
            else if (currentView === 'goals') content.innerHTML = renderGoals();
            else if (currentView === 'projects') content.innerHTML = renderProjects();
            else if (currentView === 'travels') content.innerHTML = renderTravels();
            else if (currentView === 'work') content.innerHTML = renderWork();
            else if (currentView === 'cultura') content.innerHTML = renderCultura();
        }

        // ============================================================
        //  RENDER: CALENDAR
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function renderCalendar() {
            const entriesByDate = {};
            entries.forEach(e => {
                if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
                entriesByDate[e.date].push(e);
            });

            const today = new Date().toISOString().slice(0, 10);
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const offset = (firstDay + 6) % 7;

            const prevMonth = new Date(calYear, calMonth, 0);
            const daysInPrevMonth = prevMonth.getDate();

            let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(-1)">‹</button>
                <span style="font-size:17px;font-weight:700">${monthNames[calMonth]} ${calYear}</span>
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(1)">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;

            dayNames.forEach(d => {
                html +=
                    `<div style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;padding:6px 0 10px 0">${d}</div>`;
            });

            for (let i = 0; i < offset; i++) {
                const day = daysInPrevMonth - offset + i + 1;
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${day}</span></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr =
                    `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayEntries = entriesByDate[dateStr] || [];

                const colors = [];
                const seen = new Set();
                dayEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    if (cat && !seen.has(cat.color)) {
                        seen.add(cat.color);
                        colors.push(cat.color);
                    }
                });

                const barsHtml = colors.slice(0, 4).map(color =>
                    `<span style="width:20px;height:3px;border-radius:4px;display:block;background:${color}"></span>`
                ).join('');

                const extra = colors.length > 4 ?
                    `<span style="width:12px;height:3px;border-radius:4px;display:block;background:#6b7280;font-size:7px;text-align:center">+${colors.length - 4}</span>` :
                    '';

                html += `
                <div style="background:#12121f;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid ${isToday ? '#e2e8f0' : 'transparent'};cursor:pointer;transition:background 0.15s ease" onclick="switchView('calendar');showDayEntries('${dateStr}')">
                    <span style="font-size:13px;font-weight:700;display:block;margin-bottom:4px">${d}</span>
                    <div style="display:flex;flex-direction:column;gap:2px;align-items:center">${barsHtml}${extra}</div>
                </div>`;
            }

            const totalDays = offset + daysInMonth;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${d}</span></div>`;
            }

            html += `</div>`;

            if (window._selectedDate) {
                html += renderDayEntries(window._selectedDate);
            }

            html += `
            <style>
                body.light .calendar-day { background: #ffffff !important; border-color: #e2e8f0 !important; }
                body.light .calendar-day:hover { background: #f5f5f7 !important; }
                body.light .calendar-day.today { border-color: #1c1c1e !important; }
            </style>`;

            return html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11;
                calYear--; }
            if (calMonth > 11) { calMonth = 0;
                calYear++; }
            render();
        }

        function showDayEntries(date) {
            window._selectedDate = date;
            render();
        }

        function renderDayEntries(date) {
            const dayEntries = entries.filter(e => e.date === date);
            if (!dayEntries.length) return '';

            const dateObj = new Date(date + 'T12:00:00');
            const dateLabel = dateObj.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long',
                day: 'numeric' });

            let html = `
            <div style="margin-top:20px">
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <span>${dateLabel}</span>
                    <button class="btn-secondary" onclick="window._selectedDate=null;render()">✕ Cerrar</button>
                </div>`;

            dayEntries.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const catName = cat?.name || 'Sin categoría';
                const icon = TYPE_ICONS[e.type] || '📌';

                html += `
                <div class="entry-item" onclick="openEditEntry('${e.id}')">
                    <div class="entry-color-dot" style="background:${color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${icon} ${e.title}</div>
                        <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                    </div>
                    <div class="entry-actions">
                        <button onclick="event.stopPropagation();openEditEntry('${e.id}')">✎</button>
                        <button class="delete" onclick="event.stopPropagation();deleteEntry('${e.id}')">✕</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: HOME (Centro resumen + Próximamente)
        // ============================================================
        function renderHome() {
            const today = new Date().toISOString().slice(0, 10);
            const todayEntries = entries.filter(e => e.date === today);

            // Activos
            const activeGoals = entries.filter(e => e.type === 'goal' && e.status !== 'Completado');
            const activeProjects = entries.filter(e => e.type === 'project' && e.status !== 'Completado');

            // Próximos eventos (futuro)
            const upcoming = entries.filter(e => {
                // Viajes con fecha de inicio futura
                if (e.type === 'travel' && e.startDate && e.startDate > today) return true;
                // Proyectos con fecha de fin futura
                if (e.type === 'project' && e.endDate && e.endDate > today) return true;
                // Objetivos con fecha límite futura
                if (e.type === 'goal' && e.deadline && e.deadline > today) return true;
                // Trabajos con fecha de fin futura
                if (e.type === 'work' && e.endDate && e.endDate > today) return true;
                return false;
            }).sort((a, b) => {
                const dateA = a.startDate || a.endDate || a.deadline || '';
                const dateB = b.startDate || b.endDate || b.deadline || '';
                return dateA.localeCompare(dateB);
            }).slice(0, 5);

            // Biblioteca: libro actual (último iniciado sin fin)
            const libros = entries.filter(e => e.type === 'library' && e.libType === 'libro');
            const currentBook = libros.filter(b => b.startDate && !b.endDate).sort((a, b) => b.startDate.localeCompare(
                a.startDate))[0];

            const recentEntries = entries.slice(0, 5);

            let html = `
            <div style="max-width:800px">
                <div style="font-size:13px;color:#6b7280;margin-bottom:4px">${new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
                <div style="font-size:15px;font-weight:600;margin-bottom:20px">${todayEntries.length} entradas hoy</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Objetivos activos</div><div class="card-value">${activeGoals.length}</div><div class="card-sub">${entries.filter(e=>e.type==='goal' && e.status==='Completado').length} completados</div></div>
                    <div class="card"><div class="card-title">Proyectos activos</div><div class="card-value">${activeProjects.length}</div><div class="card-sub">${entries.filter(e=>e.type==='project' && e.status==='Completado').length} completados</div></div>
                    <div class="card"><div class="card-title">Viajes</div><div class="card-value">${entries.filter(e=>e.type==='travel').length}</div><div class="card-sub">experiencias</div></div>
                    <div class="card"><div class="card-title">Cultura</div><div class="card-value">${entries.filter(e=>e.type==='library').length}</div><div class="card-sub">items registrados</div></div>
                </div>`;

            // Próximamente
            if (upcoming.length) {
                html += `
                <div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">📅 Próximamente</div>`;
                upcoming.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const catName = cat?.name || 'Sin categoría';
                    const icon = TYPE_ICONS[e.type] || '📌';
                    const dateInfo = e.startDate || e.endDate || e.deadline || '';
                    html += `
                    <div class="entry-item" onclick="switchView('calendar');showDayEntries('${dateInfo}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${icon} ${e.title}</div>
                            <div class="entry-meta">${dateInfo} · ${catName}</div>
                        </div>
                    </div>`;
                });
            }

            if (currentBook) {
                html += `
                    <div class="card" style="margin-top:12px;border-left:3px solid #3498db">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px">📖 Leyendo actualmente</div>
                        <div style="font-size:18px;font-weight:700;margin-top:2px">${currentBook.title}</div>
                        <div style="font-size:13px;color:#6b7280">${currentBook.author || 'Autor desconocido'} · Iniciado: ${currentBook.startDate}</div>
                    </div>
                `;
            }

            // Búsqueda
            html += `
            <div class="search-bar" style="margin-top:16px">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="Buscar en todas las entradas..." oninput="doSearch(this.value)" id="search-input">
            </div>
            <div class="search-results" id="search-results-container"></div>`;

            html += `
                <div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">Actividad reciente</div>`;

            if (recentEntries.length) {
                recentEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const icon = TYPE_ICONS[e.type] || '📌';
                    html += `
                    <div class="entry-item" onclick="switchView('calendar');showDayEntries('${e.date}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${icon} ${e.title}</div>
                            <div class="entry-meta">${e.date} · ${cat?.name || 'Sin categoría'}</div>
                        </div>
                    </div>`;
                });
            } else {
                html += `<div style="color:#6b7280;padding:12px 0">No hay actividad reciente</div>`;
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: STATS
        // ============================================================
        function renderStats() {
            const totalEntries = entries.length;
            const goalsTotal = entries.filter(e => e.type === 'goal').length;
            const goalsDone = entries.filter(e => e.type === 'goal' && e.status === 'Completado').length;
            const projectsTotal = entries.filter(e => e.type === 'project').length;
            const projectsDone = entries.filter(e => e.type === 'project' && e.status === 'Completado').length;
            const travelsTotal = entries.filter(e => e.type === 'travel').length;
            const workTotal = entries.filter(e => e.type === 'work').length;
            const libraryTotal = entries.filter(e => e.type === 'library').length;

            const byCategory = {};
            entries.forEach(e => {
                if (!byCategory[e.categoryId]) byCategory[e.categoryId] = 0;
                byCategory[e.categoryId]++;
            });
            const sortedCats = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);

            // Entradas por mes
            const monthCount = {};
            entries.forEach(e => {
                const m = e.date.slice(0, 7);
                if (!monthCount[m]) monthCount[m] = 0;
                monthCount[m]++;
            });
            const sortedMonths = Object.keys(monthCount).sort().slice(-6);
            const maxMonth = Math.max(...Object.values(monthCount), 1);

            let html = `
            <div style="max-width:700px">
                <div style="font-size:20px;font-weight:800;margin-bottom:4px">Estadísticas</div>
                <div style="color:#6b7280;margin-bottom:20px">Resumen de tu actividad</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Total entradas</div><div class="card-value">${totalEntries}</div></div>
                    <div class="card"><div class="card-title">Objetivos</div><div class="card-value">${goalsTotal}</div><div class="card-sub">${goalsDone} completados</div></div>
                    <div class="card"><div class="card-title">Proyectos</div><div class="card-value">${projectsTotal}</div><div class="card-sub">${projectsDone} completados</div></div>
                    <div class="card"><div class="card-title">Viajes</div><div class="card-value">${travelsTotal}</div></div>
                    <div class="card"><div class="card-title">Trabajo</div><div class="card-value">${workTotal}</div></div>
                    <div class="card"><div class="card-title">Cultura</div><div class="card-value">${libraryTotal}</div></div>
                </div>`;

            // Entradas por mes
            if (sortedMonths.length) {
                html += `
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:20px 0 12px 0">Entradas por mes</div>
                <div style="display:flex;gap:8px;align-items:flex-end;height:100px;padding-top:8px">`;
                sortedMonths.forEach(m => {
                    const count = monthCount[m] || 0;
                    const pct = (count / maxMonth) * 100;
                    const label = m.slice(5);
                    html += `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                        <div style="font-weight:600;font-size:12px">${count}</div>
                        <div style="width:100%;height:${Math.max(4, pct)}px;background:#3a3a5c;border-radius:4px 4px 0 0;min-height:4px"></div>
                        <div style="font-size:10px;color:#6b7280">${label}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            // Por categoría
            if (sortedCats.length) {
                html += `
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:20px 0 12px 0">Distribución por categoría</div>`;
                sortedCats.forEach(([catId, count]) => {
                    const cat = categories.find(c => c.id === catId);
                    const color = cat?.color || '#6b7280';
                    const name = cat?.name || 'Sin categoría';
                    const pct = totalEntries > 0 ? Math.round((count / totalEntries) * 100) : 0;
                    html += `
                    <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #1a1a2e">
                        <div style="width:12px;height:12px;border-radius:50%;background:${color};flex-shrink:0"></div>
                        <div style="flex:1;font-weight:500">${name}</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <div style="width:100px;height:6px;background:#1a1a2e;border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};border-radius:99px"></div></div>
                            <span style="font-weight:600;font-size:13px;min-width:30px;text-align:right">${count}</span>
                        </div>
                    </div>`;
                });
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: GOALS
        // ============================================================
        function renderGoals() {
            const goals = entries.filter(e => e.type === 'goal');
            if (!goals.length) {
                return `<div class="empty-state"><div class="empty-icon">◉</div><div class="empty-title">Sin objetivos</div><div class="empty-sub">Pulsa el botón + y selecciona "Objetivo"</div></div>`;
            }

            const catLabels = ['Corto plazo', 'Medio plazo', 'Largo plazo'];
            let html = '';

            catLabels.forEach(cat => {
                const filtered = goals.filter(g => g.goalCategory === cat);
                if (!filtered.length) return;

                html += `<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">${cat}</div>`;

                filtered.forEach(g => {
                    const pct = g.progress || 0;
                    const color = pct >= 100 ? '#16a34a' : pct >= 50 ? '#d97706' : '#2563eb';
                    const statusClass = g.status === 'Completado' ? 'badge-done' : g.status === 'En progreso' ?
                        'badge-progress' : 'badge-pending';

                    html += `
                    <div class="card" style="margin-bottom:8px;padding:14px 16px;cursor:pointer" onclick="openEditEntry('${g.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:600">${g.title}</span>
                            <span class="badge ${statusClass}">${g.status}</span>
                        </div>
                        ${g.notes ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">${g.notes}</div>` : ''}
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:4px">
                            <span>${pct}% completado</span>
                            ${g.deadline ? `<span>Límite: ${g.deadline}</span>` : ''}
                        </div>
                    </div>`;
                });

                html += `</div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: PROJECTS
        // ============================================================
        function renderProjects() {
            const projects = entries.filter(e => e.type === 'project');
            if (!projects.length) {
                return `<div class="empty-state"><div class="empty-icon">⊞</div><div class="empty-title">Sin proyectos</div><div class="empty-sub">Pulsa el botón + y selecciona "Proyecto"</div></div>`;
            }

            let html = '';
            projects.forEach(p => {
                const totalTasks = p.tasks?.length || 0;
                const doneTasks = p.tasks?.filter(t => t.done).length || 0;
                const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                const statusClass = p.status === 'Completado' ? 'badge-done' : p.status === 'En curso' ?
                    'badge-progress' : 'badge-pending';

                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${p.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${p.title}</span>
                        <span class="badge ${statusClass}">${p.status}</span>
                    </div>
                    ${p.description ? `<div style="font-size:13px;color:#6b7280;margin-top:4px">${p.description}</div>` : ''}
                    <div style="font-size:12px;color:#6b7280;margin-top:4px">
                        ${p.startDate ? 'Inicio: ' + p.startDate : ''} ${p.endDate ? '· Fin previsto: ' + p.endDate : ''}
                    </div>
                    ${totalTasks > 0 ? `
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:#2563eb"></div></div>
                        <div style="font-size:12px;color:#6b7280;margin-top:4px">${doneTasks}/${totalTasks} tareas completadas</div>
                    ` : ''}
                </div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: TRAVELS
        // ============================================================
        function renderTravels() {
            const travels = entries.filter(e => e.type === 'travel');
            if (!travels.length) {
                return `<div class="empty-state"><div class="empty-icon">◈</div><div class="empty-title">Sin viajes</div><div class="empty-sub">Pulsa el botón + y selecciona "Viaje"</div></div>`;
            }

            let html = '';
            travels.forEach(t => {
                const stars = t.rating ? '⭐'.repeat(t.rating) : '';
                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${t.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${t.title}</span>
                        <span style="font-size:13px;color:#6b7280">${t.country || ''}</span>
                    </div>
                    <div style="font-size:13px;color:#6b7280;margin-top:4px">
                        ${t.startDate ? t.startDate : ''} ${t.endDate ? '→ ' + t.endDate : ''}
                    </div>
                    ${stars ? `<div style="margin-top:4px">${stars}</div>` : ''}
                    ${t.notes ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${t.notes}</div>` : ''}
                </div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: WORK
        // ============================================================
        function renderWork() {
            const work = entries.filter(e => e.type === 'work');
            if (!work.length) {
                return `<div class="empty-state"><div class="empty-icon">◫</div><div class="empty-title">Sin experiencia laboral</div><div class="empty-sub">Pulsa el botón + y selecciona "Trabajo"</div></div>`;
            }

            let totalDays = 0;
            let totalDaysNormal = 0;

            work.forEach(w => {
                if (w.startDate && w.endDate) {
                    const days = calcularDiasLaborables(w.startDate, w.endDate, w.holidays || 0);
                    totalDays += days;
                    if (w.workType !== 'practicas') totalDaysNormal += days;
                }
            });

            let html = `
            <div class="work-stats">
                <div class="work-stat-card"><div class="stat-value">${totalDays}</div><div class="stat-label">Días totales trabajados</div></div>
                <div class="work-stat-card"><div class="stat-value">${totalDaysNormal}</div><div class="stat-label">Días (excluyendo prácticas)</div></div>
            </div>`;

            const sorted = [...work].sort((a, b) => b.startDate?.localeCompare(a.startDate) || 0);

            sorted.forEach(w => {
                const typeLabel = w.workType === 'practicas' ? 'Prácticas' : 'Puesto normal';
                const daysWorked = (w.startDate && w.endDate) ? calcularDiasLaborables(w.startDate, w.endDate, w
                    .holidays || 0) : 0;

                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openEditEntry('${w.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${w.title}</span>
                        <span style="font-size:12px;color:#6b7280">${w.position || ''}</span>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
                        <span style="font-size:12px;color:#6b7280">${w.startDate || ''} ${w.endDate ? '→ ' + w.endDate : '→ Actual'}</span>
                        <span class="badge ${w.workType === 'practicas' ? 'badge-pending' : 'badge-done'}">${typeLabel}</span>
                        ${daysWorked > 0 ? `<span style="font-size:12px;color:#6b7280">${daysWorked} días</span>` : ''}
                        ${(w.holidays || 0) > 0 ? `<span style="font-size:12px;color:#dc2626">${w.holidays} días de fiesta</span>` : ''}
                    </div>
                    ${w.functions ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${w.functions}</div>` : ''}
                    ${w.skills ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">Habilidades: ${w.skills}</div>` : ''}
                </div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: CULTURA
        // ============================================================
        function renderCultura() {
            const mes = culturaMonth;
            const año = culturaYear;
            const mesStr = String(mes + 1).padStart(2, '0');
            const añoStr = String(año);
            const inicioMes = añoStr + '-' + mesStr + '-01';
            const finMes = añoStr + '-' + mesStr + '-' + String(new Date(año, mes + 1, 0).getDate()).padStart(2, '0');

            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const libraryItems = entries.filter(e => e.type === 'library');

            const itemsInMonth = libraryItems.filter(e => {
                return (e.startDate && e.startDate >= inicioMes && e.startDate <= finMes) ||
                    (e.endDate && e.endDate >= inicioMes && e.endDate <= finMes);
            });

            const libros = itemsInMonth.filter(e => e.libType === 'libro');
            const peliculas = itemsInMonth.filter(e => e.libType === 'pelicula');
            const series = itemsInMonth.filter(e => e.libType === 'serie');
            const videojuegos = itemsInMonth.filter(e => e.libType === 'videojuego');

            // Libro actual
            const currentBook = libraryItems.filter(b => b.libType === 'libro' && b.startDate && !b.endDate)
                .sort((a, b) => b.startDate.localeCompare(a.startDate))[0];

            const libTypeLabels = {
                'libro': 'Libro',
                'pelicula': 'Película',
                'serie': 'Serie',
                'videojuego': 'Videojuego'
            };

            let html = `
            <div style="max-width:700px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                    <span style="font-size:17px;font-weight:700">${monthNames[mes]} ${año}</span>
                    <div style="display:flex;gap:8px">
                        <button class="btn-secondary" onclick="cambiarCulturaMes(-1)">‹</button>
                        <button class="btn-secondary" onclick="cambiarCulturaMes(1)">›</button>
                    </div>
                </div>

                ${currentBook ? `
                    <div class="card" style="margin-bottom:16px;border-left:3px solid #3498db">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:4px">📖 Leyendo actualmente</div>
                        <div style="font-size:18px;font-weight:700">${currentBook.title}</div>
                        <div style="font-size:13px;color:#6b7280">${currentBook.author || 'Autor desconocido'} · Iniciado: ${currentBook.startDate}</div>
                    </div>
                ` : `
                    <div class="card" style="margin-bottom:16px;border-color:#2a2a3a50">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px;margin-bottom:4px">📖 Leyendo actualmente</div>
                        <div style="font-size:16px;color:#6b7280">No hay ningún libro en curso</div>
                    </div>
                `}

                <div class="cultura-grid">
                    <div class="cultura-card"><div class="categoria">📖 Libros</div><div class="numero">${libros.length}</div><div class="detalle">${libros.filter(b=>b.startDate && b.startDate >= inicioMes && b.startDate <= finMes).length} iniciados · ${libros.filter(b=>b.endDate && b.endDate >= inicioMes && b.endDate <= finMes).length} terminados</div></div>
                    <div class="cultura-card"><div class="categoria">🎬 Películas</div><div class="numero">${peliculas.length}</div><div class="detalle">vistas este mes</div></div>
                    <div class="cultura-card"><div class="categoria">📺 Series</div><div class="numero">${series.length}</div><div class="detalle">${series.filter(s=>s.startDate && s.startDate >= inicioMes && s.startDate <= finMes).length} iniciadas · ${series.filter(s=>s.endDate && s.endDate >= inicioMes && s.endDate <= finMes).length} terminadas</div></div>
                    <div class="cultura-card"><div class="categoria">🎮 Videojuegos</div><div class="numero">${videojuegos.length}</div><div class="detalle">${videojuegos.filter(g=>g.startDate && g.startDate >= inicioMes && g.startDate <= finMes).length} iniciados · ${videojuegos.filter(g=>g.endDate && g.endDate >= inicioMes && g.endDate <= finMes).length} terminados</div></div>
                </div>

                ${itemsInMonth.length === 0 ? `
                    <div style="color:#6b7280;padding:20px 0;text-align:center">No hay actividad cultural este mes</div>
                ` : `
                    <div style="font-size:13px;font-weight:700;margin:16px 0 8px 0">Detalle del mes</div>
                    ${itemsInMonth.map(e => {
                        const icon = e.libType === 'libro' ? '📖' : e.libType === 'pelicula' ? '🎬' : e.libType === 'serie' ? '📺' : '🎮';
                        const label = libTypeLabels[e.libType] || 'Item';
                        const details = `${e.startDate || ''}${e.endDate ? ' → ' + e.endDate : ''}${e.rating ? ' · ⭐'.repeat(e.rating) : ''}`;
                        return `
                            <div class="entry-item" style="cursor:default">
                                <div class="entry-info">
                                    <div class="entry-title">${icon} ${e.title}</div>
                                    <div class="entry-meta">${label} · ${e.author || e.platform || ''} ${details}</div>
                                </div>
                            </div>`;
                    }).join('')}
                `}
            </div>`;

            return html;
        }

        function cambiarCulturaMes(delta) {
            culturaMonth += delta;
            if (culturaMonth < 0) { culturaMonth = 11;
                culturaYear--; }
            if (culturaMonth > 11) { culturaMonth = 0;
                culturaYear++; }
            render();
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadTheme();
            loadData();

            if (window.innerWidth <= 768) {
                document.querySelector('.menu-hamburger').style.display = 'block';
            }

            document.getElementById('mobile-menu-overlay').addEventListener('click', function() {
                if (this.classList.contains('open')) toggleMobileMenu();
            });

            // Cerrar FAB al hacer clic fuera
            document.addEventListener('click', function(e) {
                const fab = document.getElementById('fab');
                const menu = document.getElementById('fab-menu');
                if (!fab.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });

            render();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const isMobile = window.innerWidth <= 768;
                    document.querySelector('.menu-hamburger').style.display = isMobile ? 'block' : 'none';
                }, 200);
            });
        }

        const styleEl = document.createElement('style');
        styleEl.textContent = `
            .btn-secondary.active {
                background: #2a2a3a;
                color: #e2e8f0;
                border-color: #3a3a5c;
            }
            body.light .btn-secondary.active {
                background: #e2e8f0;
                color: #1c1c1e;
                border-color: #d1d1d6;
            }
        `;
        document.head.appendChild(styleEl);

        init();
    </script>
</body>
</html>
