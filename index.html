            const totalTravels = travels.length;

            // Biblioteca: libros leídos (con fecha fin) y libro actual
            const booksRead = library.books.filter(b => b.endDate).length;
            const currentBook = library.books.filter(b => b.startDate && !b.endDate).sort((a, b) => b.startDate.localeCompare(
                a.startDate))[0];

            // Películas vistas
            const moviesWatched = library.movies.filter(m => m.watchDate).length;

            // Series vistas (con fecha fin)
            const seriesFinished = library.series.filter(s => s.endDate).length;

            // Videojuegos completados
            const gamesFinished = library.games.filter(g => g.endDate).length;

            const recentEntries = entries.slice(0, 5);

            let html = `
            <div style="max-width:800px">

                <div style="font-size:13px;color:#6b7280;margin-bottom:4px">${new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
                <div style="font-size:15px;font-weight:600;margin-bottom:20px">${todayEntries.length} entradas hoy</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Objetivos activos</div><div class="card-value">${goals.filter(g=>g.status!=='Completado').length}</div><div class="card-sub">${goals.filter(g=>g.status==='Completado').length} completados</div></div>
                    <div class="card"><div class="card-title">Proyectos activos</div><div class="card-value">${projects.filter(p=>p.status!=='Completado').length}</div><div class="card-sub">${projects.filter(p=>p.status==='Completado').length} completados</div></div>
                    <div class="card"><div class="card-title">Viajes realizados</div><div class="card-value">${totalTravels}</div><div class="card-sub">experiencias</div></div>
                    <div class="card"><div class="card-title">Biblioteca</div><div class="card-value">${booksRead + moviesWatched + seriesFinished + gamesFinished}</div><div class="card-sub">${booksRead} libros · ${moviesWatched} películas</div></div>
                </div>

                ${currentBook ? `
                    <div class="card" style="margin-bottom:12px;border-left:3px solid #3498db">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;letter-spacing:0.5px">Leyendo actualmente</div>
                        <div style="font-size:18px;font-weight:700;margin-top:2px">${currentBook.title}</div>
                        <div style="font-size:13px;color:#6b7280">${currentBook.author || 'Autor desconocido'} · Iniciado: ${currentBook.startDate}</div>
                    </div>
                ` : ''}

                <div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">Actividad reciente</div>`;

            if (recentEntries.length) {
                recentEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    html += `
                    <div class="entry-item" onclick="switchView('calendar');showDayEntries('${e.date}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${e.date} · ${cat?.name || 'Sin categoría'}</div>
                        </div>
                    </div>`;
                });
            } else {
                html += `<div style="color:#6b7280;padding:12px 0">No hay actividad reciente</div>`;
            }

            if (activeGoals.length) {
                html += `<div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">Objetivos activos</div>`;
                activeGoals.forEach(g => {
                    const pct = g.progress || 0;
                    const color = pct >= 100 ? '#16a34a' : pct >= 50 ? '#d97706' : '#2563eb';
                    html += `
                    <div class="card" style="margin-bottom:8px;padding:14px 16px">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:600">${g.title}</span>
                            <span style="font-size:12px;color:#6b7280">${g.status}</span>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div style="font-size:12px;color:#6b7280;margin-top:4px">${pct}% · ${g.category}</div>
                    </div>`;
                });
            }

            if (activeProjects.length) {
                html += `<div style="font-weight:700;font-size:14px;margin:16px 0 8px 0">Proyectos activos</div>`;
                activeProjects.forEach(p => {
                    const totalTasks = p.tasks?.length || 0;
                    const doneTasks = p.tasks?.filter(t => t.done).length || 0;
                    const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                    html += `
                    <div class="card" style="margin-bottom:8px;padding:14px 16px">
                        <div style="font-weight:600">${p.name}</div>
                        <div style="font-size:12px;color:#6b7280">${p.status} · ${doneTasks}/${totalTasks} tareas</div>
                        ${totalTasks > 0 ? `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:#2563eb"></div></div>` : ''}
                    </div>`;
                });
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: STATS
        // ============================================================
        function renderStats() {
            const totalEntries = entries.length;
            const booksCount = library.books.length;
            const moviesCount = library.movies.length;
            const seriesCount = library.series.length;
            const gamesCount = library.games.length;
            const goalsTotal = goals.length;
            const goalsDone = goals.filter(g => g.status === 'Completado').length;
            const travelsTotal = travels.length;
            const workTotal = work.length;

            const byCategory = {};
            entries.forEach(e => {
                if (!byCategory[e.categoryId]) byCategory[e.categoryId] = 0;
                byCategory[e.categoryId]++;
            });
            const sortedCats = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);

            let html = `
            <div style="max-width:700px">
                <div style="font-size:20px;font-weight:800;margin-bottom:4px">Estadísticas</div>
                <div style="color:#6b7280;margin-bottom:20px">Resumen de tu actividad</div>

                <div class="card-grid">
                    <div class="card"><div class="card-title">Entradas</div><div class="card-value">${totalEntries}</div><div class="card-sub">registros totales</div></div>
                    <div class="card"><div class="card-title">Objetivos</div><div class="card-value">${goalsTotal}</div><div class="card-sub">${goalsDone} completados</div></div>
                    <div class="card"><div class="card-title">Proyectos</div><div class="card-value">${projects.length}</div><div class="card-sub">${projects.filter(p=>p.status==='Completado').length} completados</div></div>
                    <div class="card"><div class="card-title">Viajes</div><div class="card-value">${travelsTotal}</div><div class="card-sub">experiencias</div></div>
                    <div class="card"><div class="card-title">Trabajo</div><div class="card-value">${workTotal}</div><div class="card-sub">experiencias laborales</div></div>
                    <div class="card"><div class="card-title">Biblioteca</div><div class="card-value">${booksCount + moviesCount + seriesCount + gamesCount}</div><div class="card-sub">${booksCount} libros · ${moviesCount} películas</div></div>
                </div>

                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:20px 0 12px 0">Biblioteca en detalle</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <div class="card"><div class="card-title">Libros</div><div class="card-value">${booksCount}</div></div>
                    <div class="card"><div class="card-title">Películas</div><div class="card-value">${moviesCount}</div></div>
                    <div class="card"><div class="card-title">Series</div><div class="card-value">${seriesCount}</div></div>
                    <div class="card"><div class="card-title">Videojuegos</div><div class="card-value">${gamesCount}</div></div>
                </div>`;

            if (sortedCats.length) {
                html += `
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:20px 0 12px 0">Distribución por categoría</div>`;
                sortedCats.forEach(([catId, count]) => {
                    const cat = categories.find(c => c.id === catId);
                    const color = cat?.color || '#6b7280';
                    const name = cat?.name || 'Sin categoría';
                    const pct = Math.round((count / totalEntries) * 100);
                    html += `
                    <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #1a1a2e">
                        <div style="width:12px;height:12px;border-radius:50%;background:${color};flex-shrink:0"></div>
                        <div style="flex:1;font-weight:500">${name}</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <div style="width:100px;height:6px;background:#1a1a2e;border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};border-radius:99px"></div></div>
                            <span style="font-weight:600;font-size:13px;min-width:30px;text-align:right">${count}</span>
                        </div>
                    </div>`;
                });
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: GOALS
        // ============================================================
        function renderGoals() {
            if (!goals.length) {
                return `<div class="empty-state"><div class="empty-icon">◉</div><div class="empty-title">Sin objetivos</div><div class="empty-sub">Pulsa "+ Nuevo objetivo" para empezar</div></div>`;
            }

            const catLabels = ['Corto plazo', 'Medio plazo', 'Largo plazo'];
            let html = '';

            catLabels.forEach(cat => {
                const filtered = goals.filter(g => g.category === cat);
                if (!filtered.length) return;

                html += `<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:8px">${cat}</div>`;

                filtered.forEach(g => {
                    const pct = g.progress || 0;
                    const color = pct >= 100 ? '#16a34a' : pct >= 50 ? '#d97706' : '#2563eb';
                    const statusClass = g.status === 'Completado' ? 'badge-done' : g.status === 'En progreso' ?
                        'badge-progress' : 'badge-pending';

                    html += `
                    <div class="card" style="margin-bottom:8px;padding:14px 16px;cursor:pointer" onclick="openGoalModal(${JSON.stringify(g).replace(/"/g,'&quot;')})">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <span style="font-weight:600">${g.title}</span>
                            <span class="badge ${statusClass}">${g.status}</span>
                        </div>
                        ${g.description ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">${g.description}</div>` : ''}
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:4px">
                            <span>${pct}% completado</span>
                            ${g.deadline ? `<span>Límite: ${g.deadline}</span>` : ''}
                        </div>
                    </div>`;
                });

                html += `</div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: PROJECTS
        // ============================================================
        function renderProjects() {
            if (!projects.length) {
                return `<div class="empty-state"><div class="empty-icon">⊞</div><div class="empty-title">Sin proyectos</div><div class="empty-sub">Pulsa "+ Nuevo proyecto" para empezar</div></div>`;
            }

            let html = '';
            projects.forEach(p => {
                const totalTasks = p.tasks?.length || 0;
                const doneTasks = p.tasks?.filter(t => t.done).length || 0;
                const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                const statusClass = p.status === 'Completado' ? 'badge-done' : p.status === 'En curso' ?
                    'badge-progress' : 'badge-pending';

                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openProjectModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${p.name}</span>
                        <span class="badge ${statusClass}">${p.status}</span>
                    </div>
                    ${p.description ? `<div style="font-size:13px;color:#6b7280;margin-top:4px">${p.description}</div>` : ''}
                    <div style="font-size:12px;color:#6b7280;margin-top:4px">
                        ${p.startDate ? 'Inicio: ' + p.startDate : ''} ${p.endDate ? '· Fin previsto: ' + p.endDate : ''}
                    </div>
                    ${totalTasks > 0 ? `
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:#2563eb"></div></div>
                        <div style="font-size:12px;color:#6b7280;margin-top:4px">${doneTasks}/${totalTasks} tareas completadas</div>
                    ` : ''}
                </div>`;
            });

            return html;
        }

        // ============================================================
        //  RENDER: TRAVELS
        // ============================================================
        function renderTravels() {
            if (!travels.length) {
                return `<div class="empty-state"><div class="empty-icon">◈</div><div class="empty-title">Sin viajes</div><div class="empty-sub">Pulsa "+ Nuevo viaje" para empezar</div></div>`;
            }

            let html = '';
            travels.forEach(t => {
                const stars = t.rating ? '⭐'.repeat(t.rating) : '';
                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openTravelModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${t.place}</span>
                        <span style="font-size:13px;color:#6b7280">${t.country || ''}</span>
                    </div>
                    <div style="font-size:13px;color:#6b7280;margin-top:4px">
                        ${t.startDate ? t.startDate : ''} ${t.endDate ? '→ ' + t.endDate : ''}
                    </div>
                    ${stars ? `<div style="margin-top:4px">${stars}</div>` : ''}
                    ${t.notes ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${t.notes}</div>` : ''}
                </div>`;
            });

            return html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadTheme();
            loadData();

            if (window.innerWidth <= 768) {
                document.querySelector('.menu-hamburger').style.display = 'block';
            }

            document.getElementById('mobile-menu-overlay').addEventListener('click', function() {
                if (this.classList.contains('open')) toggleMobileMenu();
            });

            render();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const isMobile = window.innerWidth <= 768;
                    document.querySelector('.menu-hamburger').style.display = isMobile ? 'block' : 'none';
                }, 200);
            });
        }

        const styleEl = document.createElement('style');
        styleEl.textContent = `
            .btn-secondary.active {
                background: #2a2a3a;
                color: #e2e8f0;
                border-color: #3a3a5c;
            }
            body.light .btn-secondary.active {
                background: #e2e8f0;
                color: #1c1c1e;
                border-color: #d1d1d6;
            }
        `;
        document.head.appendChild(styleEl);

        init();
    </script>

</body>
</html>
