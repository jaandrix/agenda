<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bitácora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.light {
            background: #f5f5f7;
            color: #1c1c1e;
        }

        #app {
            display: flex;
            height: 100dvh;
            margin: 0 auto;
            max-width: 1200px;
            background: #0a0a0f;
            transition: background 0.25s ease;
            position: relative;
        }
        body.light #app {
            background: #f5f5f7;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 220px;
            min-width: 220px;
            background: #12121f;
            border-right: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 16px 16px;
            flex-shrink: 0;
            transition: background 0.25s ease, border-color 0.25s ease;
            overflow-y: auto;
            z-index: 10;
        }
        body.light #sidebar {
            background: #ffffff;
            border-right-color: #e2e8f0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 4px;
        }
        .sidebar-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: #e2e8f0;
            border-radius: 8px;
            flex-shrink: 0;
        }
        body.light .sidebar-brand .brand-icon {
            background: #1c1c1e;
        }
        .sidebar-brand .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            padding: 12px 8px 6px 8px;
        }
        body.light .sidebar-nav .nav-label {
            color: #8e8e93;
        }

        .sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        .sidebar-nav button.active {
            background: #2a2a3a;
            color: #e2e8f0;
        }
        body.light .sidebar-nav button {
            color: #6b7280;
        }
        body.light .sidebar-nav button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.light .sidebar-nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        .sidebar-nav button .nav-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav button .nav-text {
            flex: 1;
        }

        .sidebar-actions {
            border-top: 1px solid #2a2a3a;
            padding-top: 12px;
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        body.light .sidebar-actions {
            border-top-color: #e2e8f0;
        }

        .sidebar-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .sidebar-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light .sidebar-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        /* ===== MOBILE MENU ===== */
        #mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #mobile-menu-overlay.open {
            display: block;
        }

        #mobile-menu-panel {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100dvh;
            background: #12121f;
            z-index: 101;
            transition: left 0.3s ease;
            padding: 24px 16px 16px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #mobile-menu-panel.open {
            left: 0;
        }
        body.light #mobile-menu-panel {
            background: #ffffff;
        }

        #mobile-menu-panel .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #mobile-menu-panel .menu-header .brand {
            font-size: 18px;
            font-weight: 800;
        }
        #mobile-menu-panel .menu-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
        }

        #mobile-menu-panel .menu-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #mobile-menu-panel .menu-nav .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            padding: 12px 8px 6px 8px;
        }
        #mobile-menu-panel .menu-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            padding: 10px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            text-align: left;
        }
        #mobile-menu-panel .menu-nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        #mobile-menu-panel .menu-nav button.active {
            background: #2a2a3a;
            color: #e2e8f0;
        }
        body.light #mobile-menu-panel .menu-nav button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.light #mobile-menu-panel .menu-nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }
        #mobile-menu-panel .menu-nav button .nav-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        #mobile-menu-panel .menu-actions {
            border-top: 1px solid #2a2a3a;
            padding-top: 12px;
            display: flex;
            gap: 6px;
        }
        body.light #mobile-menu-panel .menu-actions {
            border-top-color: #e2e8f0;
        }
        #mobile-menu-panel .menu-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
        }
        #mobile-menu-panel .menu-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light #mobile-menu-panel .menu-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        /* ===== MAIN ===== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0a0a0f;
            transition: background 0.25s ease;
        }
        body.light #main {
            background: #f5f5f7;
        }

        /* ===== HEADER ===== */
        #main-header {
            padding: 20px 32px 14px 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            transition: border-color 0.25s ease;
        }
        body.light #main-header {
            border-bottom-color: #e2e8f0;
        }

        #main-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #main-header .menu-hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #e2e8f0;
            cursor: pointer;
            padding: 4px;
        }
        body.light #main-header .menu-hamburger {
            color: #1c1c1e;
        }

        #main-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* ===== CONTENT ===== */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 32px 32px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== FAB ===== */
        #fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #0a0a0f;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        #fab:hover {
            transform: scale(1.05);
        }
        #fab:active {
            transform: scale(0.92);
        }
        body.light #fab {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        #fab-menu {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: #12121f;
            border-radius: 16px;
            padding: 12px 0;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            z-index: 51;
            display: none;
            min-width: 200px;
            border: 1px solid #2a2a3a;
        }
        #fab-menu.open {
            display: block;
        }
        body.light #fab-menu {
            background: #ffffff;
            border-color: #e2e8f0;
        }

        #fab-menu button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            background: none;
            border: none;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        #fab-menu button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        body.light #fab-menu button {
            color: #1c1c1e;
        }
        body.light #fab-menu button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 768px) {
            #fab {
                bottom: 90px;
                right: 20px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            #fab-menu {
                bottom: 150px;
                right: 20px;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #sidebar {
                display: none !important;
            }
            #main-header .menu-hamburger {
                display: block !important;
            }
            #main-header {
                padding: 14px 16px 10px 16px;
            }
            #main-header h1 {
                font-size: 17px;
            }
            #content {
                padding: 16px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            #sidebar {
                width: 200px;
                min-width: 200px;
            }
            #main-header {
                padding: 18px 24px 12px 24px;
            }
            #content {
                padding: 20px 24px 24px 24px;
            }
        }

        /* ============================================================
               COMMON STYLES
            ============================================================ */

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: #12121f;
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid #1a1a2e;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .card:hover {
            background: #1a1a2e;
        }
        body.light .card {
            background: #ffffff;
            border-color: #e2e8f0;
        }
        body.light .card:hover {
            background: #fafafa;
        }

        .card .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        body.light .card .card-title {
            color: #8e8e93;
        }
        .card .card-value {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .card .card-sub {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        body.light .card .card-sub {
            color: #8e8e93;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #6b7280;
        }
        body.light .empty-state {
            color: #8e8e93;
        }
        .empty-state .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.3;
        }
        .empty-state .empty-title {
            font-weight: 700;
            font-size: 16px;
            color: #e2e8f0;
        }
        body.light .empty-state .empty-title {
            color: #1c1c1e;
        }
        .empty-state .empty-sub {
            font-size: 13px;
            margin-top: 4px;
        }

        .entry-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 8px;
            border-bottom: 1px solid #1a1a2e;
            cursor: pointer;
            transition: background 0.15s ease;
            border-radius: 6px;
        }
        .entry-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        body.light .entry-item {
            border-bottom-color: #e2e8f0;
        }
        body.light .entry-item:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .entry-item:last-child {
            border-bottom: none;
        }

        .entry-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .entry-info {
            flex: 1;
            min-width: 0;
        }
        .entry-info .entry-title {
            font-weight: 600;
            font-size: 14px;
        }
        .entry-info .entry-meta {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        body.light .entry-info .entry-meta {
            color: #8e8e93;
        }

        .entry-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .entry-actions button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .entry-actions button:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
        }
        .entry-actions button.delete {
            color: #dc2626;
        }
        body.light .entry-actions button:hover {
            color: #1c1c1e;
            background: rgba(0, 0, 0, 0.05);
        }
        body.light .entry-actions button.delete {
            color: #dc2626;
        }

        .progress-bar-bg {
            height: 6px;
            background: #1a1a2e;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 6px;
        }
        body.light .progress-bar-bg {
            background: #e2e8f0;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-progress {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .badge-done {
            background: #dcfce7;
            color: #15803d;
        }
        body.dark .badge-pending {
            background: #422f00;
            color: #fcd34d;
        }
        body.dark .badge-progress {
            background: #1e3a5f;
            color: #93c5fd;
        }
        body.dark .badge-done {
            background: #14532d;
            color: #86efac;
        }
        body.dark .badge {
            background: #2a2a3a;
            color: #e2e8f0;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            background: #e2e8f0;
            color: #0a0a0f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #toast.show {
            opacity: 1;
        }
        body.light #toast {
            background: #1c1c1e;
            color: #f5f5f7;
        }
        #toast.error {
            background: #dc2626;
            color: #fff;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-sheet {
            background: #12121f;
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90dvh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: background 0.25s ease;
        }
        body.light .modal-sheet {
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 0 4px;
        }
        body.light .modal-close {
            color: #8e8e93;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6b7280;
            display: block;
            margin-bottom: 4px;
        }
        body.light .modal-label {
            color: #8e8e93;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a3a;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            background: #1a1a2e;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.15s ease;
            margin-bottom: 12px;
        }
        .modal-input:focus {
            border-color: #e2e8f0;
        }
        body.light .modal-input {
            background: #f5f5f7;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light .modal-input:focus {
            border-color: #1c1c1e;
        }
        .modal-input::placeholder {
            color: #6b7280;
        }
        body.light .modal-input::placeholder {
            color: #8e8e93;
        }

        .modal-row {
            display: flex;
            gap: 10px;
        }
        .modal-row>* {
            flex: 1;
        }

        .btn-modal-primary {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #e2e8f0;
            color: #0a0a0f;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 4px;
        }
        .btn-modal-primary:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-primary {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .btn-modal-danger {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #2a1515;
            color: #dc2626;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 6px;
        }
        .btn-modal-danger:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-danger {
            background: #fee2e2;
        }

        /* ===== SCROLLBAR ===== */
        #content::-webkit-scrollbar,
        .modal-sheet::-webkit-scrollbar,
        #sidebar::-webkit-scrollbar,
        #mobile-menu-panel::-webkit-scrollbar {
            width: 4px;
        }
        #content::-webkit-scrollbar-track,
        .modal-sheet::-webkit-scrollbar-track,
        #sidebar::-webkit-scrollbar-track,
        #mobile-menu-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #content::-webkit-scrollbar-thumb,
        .modal-sheet::-webkit-scrollbar-thumb,
        #sidebar::-webkit-scrollbar-thumb,
