<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bitácora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.light {
            background: #f5f5f7;
            color: #1c1c1e;
        }

        #app {
            display: flex;
            height: 100dvh;
            margin: 0 auto;
            max-width: 1200px;
            background: #0a0a0f;
            transition: background 0.25s ease;
            position: relative;
        }
        body.light #app {
            background: #f5f5f7;
        }

        #sidebar {
            width: 220px;
            min-width: 220px;
            background: #12121f;
            border-right: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 16px 16px;
            flex-shrink: 0;
            transition: background 0.25s ease, border-color 0.25s ease;
            overflow-y: auto;
            z-index: 10;
        }
        body.light #sidebar {
            background: #ffffff;
            border-right-color: #e2e8f0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 4px;
        }
        .sidebar-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: #e2e8f0;
            border-radius: 8px;
            flex-shrink: 0;
        }
        body.light .sidebar-brand .brand-icon {
            background: #1c1c1e;
        }
        .sidebar-brand .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            padding: 12px 8px 6px 8px;
        }
        body.light .sidebar-nav .nav-label {
            color: #8e8e93;
        }

        .sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        .sidebar-nav button.active {
            background: #2a2a3a;
            color: #e2e8f0;
        }
        body.light .sidebar-nav button {
            color: #6b7280;
        }
        body.light .sidebar-nav button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.light .sidebar-nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        .sidebar-nav button .nav-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav button .nav-text {
            flex: 1;
        }

        .sidebar-actions {
            border-top: 1px solid #2a2a3a;
            padding-top: 12px;
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        body.light .sidebar-actions {
            border-top-color: #e2e8f0;
        }

        .sidebar-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .sidebar-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light .sidebar-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        #mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #mobile-menu-overlay.open {
            display: block;
        }

        #mobile-menu-panel {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100dvh;
            background: #12121f;
            z-index: 101;
            transition: left 0.3s ease;
            padding: 24px 16px 16px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #mobile-menu-panel.open {
            left: 0;
        }
        body.light #mobile-menu-panel {
            background: #ffffff;
        }

        #mobile-menu-panel .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #mobile-menu-panel .menu-header .brand {
            font-size: 18px;
            font-weight: 800;
        }
        #mobile-menu-panel .menu-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
        }

        #mobile-menu-panel .menu-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #mobile-menu-panel .menu-nav .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            padding: 12px 8px 6px 8px;
        }
        #mobile-menu-panel .menu-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            padding: 10px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            text-align: left;
        }
        #mobile-menu-panel .menu-nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        #mobile-menu-panel .menu-nav button.active {
            background: #2a2a3a;
            color: #e2e8f0;
        }
        body.light #mobile-menu-panel .menu-nav button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.light #mobile-menu-panel .menu-nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }
        #mobile-menu-panel .menu-nav button .nav-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        #mobile-menu-panel .menu-actions {
            border-top: 1px solid #2a2a3a;
            padding-top: 12px;
            display: flex;
            gap: 6px;
        }
        body.light #mobile-menu-panel .menu-actions {
            border-top-color: #e2e8f0;
        }
        #mobile-menu-panel .menu-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
        }
        #mobile-menu-panel .menu-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light #mobile-menu-panel .menu-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0a0a0f;
            transition: background 0.25s ease;
        }
        body.light #main {
            background: #f5f5f7;
        }

        #main-header {
            padding: 20px 32px 14px 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            transition: border-color 0.25s ease;
        }
        body.light #main-header {
            border-bottom-color: #e2e8f0;
        }

        #main-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #main-header .menu-hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #e2e8f0;
            cursor: pointer;
            padding: 4px;
        }
        body.light #main-header .menu-hamburger {
            color: #1c1c1e;
        }

        #main-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        #main-header .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #e2e8f0;
            color: #0a0a0f;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        body.light .btn-primary {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .btn-secondary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light .btn-secondary {
            border-color: #e2e8f0;
            color: #6b7280;
        }
        body.light .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 32px 32px;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            #sidebar {
                display: none !important;
            }
            #main-header .menu-hamburger {
                display: block !important;
            }
            #main-header {
                padding: 14px 16px 10px 16px;
            }
            #main-header h1 {
                font-size: 17px;
            }
            #content {
                padding: 16px;
            }
            .btn-primary {
                font-size: 12px;
                padding: 6px 14px;
            }
            .btn-secondary {
                font-size: 11px;
                padding: 4px 10px;
            }
            #main-header .header-actions .btn-secondary {
                display: none;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            #sidebar {
                width: 200px;
                min-width: 200px;
            }
            #main-header {
                padding: 18px 24px 12px 24px;
            }
            #content {
                padding: 20px 24px 24px 24px;
            }
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: #12121f;
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid #1a1a2e;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .card:hover {
            background: #1a1a2e;
        }
        body.light .card {
            background: #ffffff;
            border-color: #e2e8f0;
        }
        body.light .card:hover {
            background: #fafafa;
        }

        .card .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        body.light .card .card-title {
            color: #8e8e93;
        }
        .card .card-value {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .card .card-sub {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        body.light .card .card-sub {
            color: #8e8e93;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #6b7280;
        }
        body.light .empty-state {
            color: #8e8e93;
        }
        .empty-state .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.3;
        }
        .empty-state .empty-title {
            font-weight: 700;
            font-size: 16px;
            color: #e2e8f0;
        }
        body.light .empty-state .empty-title {
            color: #1c1c1e;
        }
        .empty-state .empty-sub {
            font-size: 13px;
            margin-top: 4px;
        }

        .entry-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 8px;
            border-bottom: 1px solid #1a1a2e;
            cursor: pointer;
            transition: background 0.15s ease;
            border-radius: 6px;
        }
        .entry-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        body.light .entry-item {
            border-bottom-color: #e2e8f0;
        }
        body.light .entry-item:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .entry-item:last-child {
            border-bottom: none;
        }

        .entry-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .entry-info {
            flex: 1;
            min-width: 0;
        }
        .entry-info .entry-title {
            font-weight: 600;
            font-size: 14px;
        }
        .entry-info .entry-meta {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        body.light .entry-info .entry-meta {
            color: #8e8e93;
        }

        .entry-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .entry-actions button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .entry-actions button:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
        }
        .entry-actions button.delete {
            color: #dc2626;
        }
        body.light .entry-actions button:hover {
            color: #1c1c1e;
            background: rgba(0, 0, 0, 0.05);
        }
        body.light .entry-actions button.delete {
            color: #dc2626;
        }

        .progress-bar-bg {
            height: 6px;
            background: #1a1a2e;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 6px;
        }
        body.light .progress-bar-bg {
            background: #e2e8f0;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-progress {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .badge-done {
            background: #dcfce7;
            color: #15803d;
        }
        body.dark .badge-pending {
            background: #422f00;
            color: #fcd34d;
        }
        body.dark .badge-progress {
            background: #1e3a5f;
            color: #93c5fd;
        }
        body.dark .badge-done {
            background: #14532d;
            color: #86efac;
        }
        body.dark .badge {
            background: #2a2a3a;
            color: #e2e8f0;
        }

        .stars {
            color: #f59e0b;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .search-bar {
            margin-bottom: 20px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            background: #12121f;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .search-bar input:focus {
            border-color: #e2e8f0;
        }
        .search-bar input::placeholder {
            color: #6b7280;
        }
        .search-bar .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 18px;
            pointer-events: none;
        }
        body.light .search-bar input {
            background: #ffffff;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light .search-bar input::placeholder {
            color: #8e8e93;
        }
        body.light .search-bar input:focus {
            border-color: #1c1c1e;
        }

        .search-results {
            margin-top: 12px;
        }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            background: #e2e8f0;
            color: #0a0a0f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #toast.show {
            opacity: 1;
        }
        body.light #toast {
            background: #1c1c1e;
            color: #f5f5f7;
        }
        #toast.error {
            background: #dc2626;
            color: #fff;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-sheet {
            background: #12121f;
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90dvh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: background 0.25s ease;
        }
        body.light .modal-sheet {
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 0 4px;
        }
        body.light .modal-close {
            color: #8e8e93;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6b7280;
            display: block;
            margin-bottom: 4px;
        }
        body.light .modal-label {
            color: #8e8e93;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a3a;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            background: #1a1a2e;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.15s ease;
            margin-bottom: 12px;
        }
        .modal-input:focus {
            border-color: #e2e8f0;
        }
        body.light .modal-input {
            background: #f5f5f7;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light .modal-input:focus {
            border-color: #1c1c1e;
        }
        .modal-input::placeholder {
            color: #6b7280;
        }
        body.light .modal-input::placeholder {
            color: #8e8e93;
        }

        .modal-row {
            display: flex;
            gap: 10px;
        }
        .modal-row>* {
            flex: 1;
        }

        .btn-modal-primary {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #e2e8f0;
            color: #0a0a0f;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 4px;
        }
        .btn-modal-primary:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-primary {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .btn-modal-danger {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #2a1515;
            color: #dc2626;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 6px;
        }
        .btn-modal-danger:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-danger {
            background: #fee2e2;
        }

        .work-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

            <button onclick="switchView('stats');" data-view="stats">
                <span class="nav-icon">▦</span> Estadísticas
            </button>
            <span class="nav-label">Registro</span>
            <button onclick="switchView('goals');" data-view="goals">
                <span class="nav-icon">◉</span> Objetivos
            </button>
            <button onclick="switchView('projects');" data-view="projects">
                <span class="nav-icon">⊞</span> Proyectos
            </button>

    <div id="modal-container"></div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        let entries = [];
        let categories = [];
        let goals = [];
        let projects = [];
        let travels = [];
        let work = [];
        let library = { books: [], movies: [], series: [], games: [] };

        let filteredEntries = [];
        let searchQuery = '';
        let culturaMonth = new Date().getMonth();
        let culturaYear = new Date().getFullYear();

        const DEFAULT_COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#e67e22', '#e84393', '#00b894', '#6c5ce7',
            '#fd79a8', '#0984e3', '#fdcb6e', '#00cec9', '#a29bfe'
        ];

        // ============================================================
        //  LOAD / SAVE
        // ============================================================
        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('bitacora_data') || '{}');
                entries = saved.entries || [];
                categories = saved.categories || getDefaultCategories();
                goals = saved.goals || [];
                projects = saved.projects || [];
                travels = saved.travels || [];
                work = saved.work || [];
                library = saved.library || { books: [], movies: [], series: [], games: [] };
            } catch (e) {
                entries = [];
                categories = getDefaultCategories();
                goals = [];
                projects = [];
                travels = [];
                work = [];
                library = { books: [], movies: [], series: [], games: [] };
            }
            if (!categories || categories.length === 0) categories = getDefaultCategories();
            categories.forEach(c => { if (!c.id) c.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); });
            if (!library.books) library.books = [];
            if (!library.movies) library.movies = [];
            if (!library.series) library.series = [];
            if (!library.games) library.games = [];
            filteredEntries = [...entries];
            updateHeader();
        }

        function saveData() {
            localStorage.setItem('bitacora_data', JSON.stringify({
                entries, categories, goals, projects, travels, work, library
            }));
            updateHeader();
        }

        function getDefaultCategories() {
            return [
                { id: 'cat_videojuego', name: 'Videojuego', color: '#e74c3c' },
                { id: 'cat_libro', name: 'Libro', color: '#3498db' },
                { id: 'cat_serie', name: 'Serie', color: '#9b59b6' },
                { id: 'cat_pelicula', name: 'Película', color: '#f39c12' },
                { id: 'cat_musica', name: 'Música', color: '#1abc9c' },
                { id: 'cat_trabajo', name: 'Trabajo', color: '#e67e22' },
                { id: 'cat_proyecto', name: 'Proyecto', color: '#00b894' },
                { id: 'cat_objetivo', name: 'Objetivo', color: '#6c5ce7' },
                { id: 'cat_viaje', name: 'Viaje', color: '#e84393' },
                { id: 'cat_finanzas', name: 'Finanzas', color: '#2ecc71' },
            ];
        }

        // ============================================================
        //  SISTEMA DE ENTRADAS AUTOMÁTICAS
        // ============================================================

        function getCategoryId(name) {
            let cat = categories.find(c => c.name === name);
            if (!cat) {
                const colorMap = {
                    'Viaje': '#e84393',
                    'Objetivo': '#6c5ce7',
                    'Proyecto': '#00b894',
                    'Trabajo': '#e67e22',
                    'Libro': '#3498db',
                    'Película': '#f39c12',
                    'Serie': '#9b59b6',
                    'Videojuego': '#e74c3c'
                };
                const newCat = {
                    id: 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    name: name,
                    color: colorMap[name] || '#6b7280'
                };
                categories.push(newCat);
                cat = newCat;
                saveData();
            }
            return cat.id;
        }

        function addEntryForItem(title, date, categoryName, extraInfo) {
            if (!date) return null;
            const catId = getCategoryId(categoryName);
            const entry = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                date: date,
                title: title + (extraInfo ? ' (' + extraInfo + ')' : ''),
                categoryId: catId,
                notes: '',
                _source: categoryName
            };
            entries.push(entry);
            return entry;
        }

        function removeEntriesForItem(id, categoryName) {
            const toRemove = entries.filter(e => {
                return e.title.includes('[' + id + ']') || e._source === categoryName + '_' + id;
            });
            toRemove.forEach(e => {
                const idx = entries.indexOf(e);
                if (idx >= 0) entries.splice(idx, 1);
            });
        }

        function getEntryTitle(title, id) {
            return title + ' [' + id + ']';
        }

        // ============================================================
        //  THEME / MODE
        // ============================================================
        function loadTheme() {
            const theme = localStorage.getItem('bitacora_theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light');
            } else {
                document.body.classList.remove('light');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            localStorage.setItem('bitacora_theme', isLight ? 'light' : 'dark');
        }

        let modeWide = false;

        function toggleMode() {
            const app = document.getElementById('app');
            modeWide = !modeWide;
            app.style.maxWidth = modeWide ? '100%' : '1200px';
        }

        // ============================================================
        //  HEADER
        // ============================================================
        function updateHeader() {
            // No need for header count
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = isError ? 'error' : '';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-nav button, #mobile-menu-panel .menu-nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            const titles = {
                'calendar': 'Calendario',
                'home': 'Centro resumen',
                'stats': 'Estadísticas',
                'goals': 'Objetivos',
                'projects': 'Proyectos',
                'travels': 'Viajes',
                'work': 'Trabajo',
                'cultura': 'Resumen cultural',
                'library': 'Biblioteca'
            };
            document.getElementById('page-title').textContent = titles[view] || 'Calendario';

            const btn = document.getElementById('new-entry-btn');
            if (view === 'calendar' || view === 'home' || view === 'stats' || view === 'cultura') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nueva entrada';
            } else if (view === 'goals') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nuevo objetivo';
            } else if (view === 'projects') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nuevo proyecto';
            } else if (view === 'travels') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nuevo viaje';
            } else if (view === 'work') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nueva experiencia';
            } else if (view === 'library') {
                btn.style.display = 'inline-block';
                btn.textContent = '+ Nuevo item';
            } else {
                btn.style.display = 'none';
            }

            const panel = document.getElementById('mobile-menu-panel');
            const overlay = document.getElementById('mobile-menu-overlay');
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                overlay.classList.remove('open');
            }

            render();
        }

        // ============================================================
        //  MOBILE MENU
        // ============================================================
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu-overlay');
            const panel = document.getElementById('mobile-menu-panel');
            overlay.classList.toggle('open');
            panel.classList.toggle('open');
        }

        // ============================================================
        //  SEARCH
        // ============================================================
        let searchTimeout = null;

        function doSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = query.toLowerCase().trim();
                const resultsContainer = document.getElementById('search-results-container');
                if (!resultsContainer) return;

                if (!searchQuery) {
                    resultsContainer.innerHTML = '';
                    return;
                }

                const filtered = entries.filter(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    return e.title.toLowerCase().includes(searchQuery) ||
                        (cat && cat.name.toLowerCase().includes(searchQuery)) ||
                        (e.notes && e.notes.toLowerCase().includes(searchQuery));
                });

                if (!filtered.length) {
                    resultsContainer.innerHTML =
                        `<div style="margin-top:12px;color:#6b7280;text-align:center;padding:20px">No se encontraron entradas</div>`;
                    return;
                }

                let html =
                    `<div style="margin-top:8px;font-size:12px;color:#6b7280;margin-bottom:8px">${filtered.length} resultados</div>`;
                filtered.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const catName = cat?.name || 'Sin categoría';
                    html += `
                    <div class="entry-item" onclick="switchView('calendar');showDayEntries('${e.date}')">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${e.date} · ${catName}</div>
                        </div>
                    </div>`;
                });
                resultsContainer.innerHTML = html;
            }, 200);
        }

        // ============================================================
        //  MODAL
        // ============================================================
        let editingEntryId = null;
        let editingItemId = null;
        let editingType = null;

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editingEntryId = null;
            editingItemId = null;
            editingType = null;
        }

        function openNewEntry() {
            if (currentView === 'goals') { openGoalModal(null); return; }
            if (currentView === 'projects') { openProjectModal(null); return; }
            if (currentView === 'travels') { openTravelModal(null); return; }
            if (currentView === 'work') { openWorkModal(null); return; }
            if (currentView === 'library') { openLibraryModal(null); return; }
            editingEntryId = null;
            document.getElementById('modal-container').innerHTML = renderEntryModal(null);
        }

        // ============================================================
        //  ENTRY MODAL
        // ============================================================
        function renderEntryModal(entry) {
            const isEdit = !!entry;
            const title = isEdit ? 'Editar entrada' : 'Nueva entrada';
            const today = new Date().toISOString().slice(0, 10);

            const catOptions = categories.map(c =>
                `<option value="${c.id}" ${isEdit && entry?.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            const colorOptions = DEFAULT_COLORS.map(c =>
                `<div class="modal-color-option" style="background:${c}" data-color="${c}" onclick="selectColor(this, '${c}')"></div>`
            ).join('');

            const currentColor = isEdit ?
                (categories.find(c => c.id === entry?.categoryId)?.color || '#e74c3c') :
                '#e74c3c';

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">
                        ${title}
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>

                    <div class="modal-label">Fecha</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit ? entry.date : today}">

                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" placeholder="Ej: Empecé The Witcher 3" value="${isEdit ? entry.title : ''}">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input" onchange="onCategoryChange(this.value)">
                        ${catOptions}
                        <option value="__new">+ Crear nueva categoría</option>
                    </select>

                    <div id="new-category-fields" style="display:none">
                        <div class="modal-label">Nombre de la nueva categoría</div>
                        <input id="modal-new-cat-name" class="modal-input" placeholder="Ej: Podcast">
                        <div class="modal-label">Color</div>
                        <div class="modal-color-grid" id="color-picker">
                            ${colorOptions}
                        </div>
                        <input type="hidden" id="modal-new-cat-color" value="${currentColor}">
                    </div>

                    <div class="modal-label">Notas</div>
                    <textarea id="modal-notes" class="modal-input" rows="2" placeholder="Detalles adicionales...">${isEdit ? (entry.notes || '') : ''}</textarea>

                    <button class="btn-modal-primary" onclick="saveEntry()">Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteEntry(${entry.id})">Eliminar entrada</button>` : ''}
                </div>
            </div>`;
        }

        let selectedColor = '#e74c3c';

        function selectColor(el, color) {
            selectedColor = color;
            document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('modal-new-cat-color').value = color;
        }

        function onCategoryChange(value) {
            const fields = document.getElementById('new-category-fields');
            if (value === '__new') {
                fields.style.display = 'block';
                const firstColor = document.querySelector('.modal-color-option');
                if (firstColor) {
                    document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
                    firstColor.classList.add('selected');
                    document.getElementById('modal-new-cat-color').value = firstColor.dataset.color;
                }
            } else {
                fields.style.display = 'none';
            }
        }

        function saveEntry() {
            const date = document.getElementById('modal-date').value;
            if (!date) { showToast('Selecciona una fecha', true); return; }

            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            let categoryId = document.getElementById('modal-category').value;
            const notes = document.getElementById('modal-notes').value.trim();

            if (categoryId === '__new') {
                const newCatName = document.getElementById('modal-new-cat-name').value.trim();
                if (!newCatName) { showToast('Escribe un nombre para la categoría', true); return; }
                const color = document.getElementById('modal-new-cat-color').value || '#e74c3c';
                const newCat = { id: 'cat_' + Date.now(), name: newCatName, color: color };
                categories.push(newCat);
                categoryId = newCat.id;
                saveData();
            }

            const entry = {
                id: editingEntryId || Date.now(),
                date: date,
                title: title,
                categoryId: categoryId,
                notes: notes
            };

            if (editingEntryId) {
                const idx = entries.findIndex(e => e.id === editingEntryId);
                if (idx >= 0) entries[idx] = entry;
            } else {
                entries.push(entry);
            }

            entries.sort((a, b) => b.date.localeCompare(a.date));
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Entrada guardada');
        }

        function deleteEntry(id) {
            if (!confirm('¿Eliminar esta entrada?')) return;
            entries = entries.filter(e => e.id !== id);
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Eliminada');
        }

        // ============================================================
        //  GOALS
        // ============================================================
        function openGoalModal(goal) {
            editingItemId = goal?.id || null;
            editingType = 'goal';
            document.getElementById('modal-container').innerHTML = renderGoalModal(goal);
        }

        function renderGoalModal(goal) {
            const isEdit = !!goal;
            const statuses = ['Pendiente', 'En progreso', 'Completado'];
            const cats = ['Corto plazo', 'Medio plazo', 'Largo plazo'];

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${isEdit ? 'Editar objetivo' : 'Nuevo objetivo'}<button class="modal-close" onclick="closeModal()">✕</button></div>
                    <div class="modal-label">Nombre</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? goal.title : ''}" placeholder="Ej: Leer 20 libros">

        function calcularDiasLaborables(fechaInicio, fechaFin, diasFiesta) {
            if (!fechaInicio || !fechaFin) return 0;
            const inicio = new Date(fechaInicio + 'T12:00:00');
            const fin = new Date(fechaFin + 'T12:00:00');
            let count = 0;
            const current = new Date(inicio);
            while (current <= fin) {
                const day = current.getDay();
                if (day !== 0 && day !== 6) {
                    count++;
                }
                current.setDate(current.getDate() + 1);
            }
            return Math.max(0, count - (diasFiesta || 0));
        }

        function saveWork() {
            const company = document.getElementById('modal-company').value.trim();
            if (!company) { showToast('Escribe una empresa', true); return; }

            const startDate = document.getElementById('modal-start').value || '';
            const endDate = document.getElementById('modal-end').value || '';
            const holidays = parseInt(document.getElementById('modal-holidays').value) || 0;

            if (startDate && endDate && endDate < startDate) {
                showToast('La fecha de fin debe ser posterior a la de inicio', true);
                return;
            }

            const item = {
                id: editingItemId || Date.now(),
                company,
                position: document.getElementById('modal-position').value.trim(),
                type: document.getElementById('modal-type').value,
                startDate: startDate,
                endDate: endDate,
                holidays: holidays,
                functions: document.getElementById('modal-functions').value.trim(),
                skills: document.getElementById('modal-skills').value.trim()
            };

            if (editingItemId) {
                removeEntriesForItem(editingItemId, 'Trabajo');
                const idx = work.findIndex(w => w.id === editingItemId);
                if (idx >= 0) work[idx] = item;
            } else {
                work.push(item);
            }

            if (startDate) {
                addEntryForItem(
                    getEntryTitle('💼 Inicio: ' + item.company + ' (' + item.position + ')', item.id),
                    startDate,
                    'Trabajo',
                    'Tipo: ' + (item.type === 'practicas' ? 'Prácticas' : 'Puesto normal')
                );
            }

            if (endDate && endDate !== startDate) {
                addEntryForItem(
                    getEntryTitle('💼 Fin: ' + item.company + ' (' + item.position + ')', item.id),
                    endDate,
                    'Trabajo',
                    'Tipo: ' + (item.type === 'practicas' ? 'Prácticas' : 'Puesto normal')
                );
            }

            saveData();
            closeModal();
            render();
            showToast('Experiencia guardada');
        }

        // ============================================================
        //  RENDER: WORK
        // ============================================================
        function renderWork() {
            if (!work.length) {
                return `<div class="empty-state"><div class="empty-icon">◫</div><div class="empty-title">Sin experiencia laboral</div><div class="empty-sub">Pulsa "+ Nueva experiencia" para empezar</div></div>`;
            }

            let totalDays = 0;
            let totalDaysNormal = 0;

            work.forEach(w => {
                if (w.startDate && w.endDate) {
                    const days = calcularDiasLaborables(w.startDate, w.endDate, w.holidays || 0);
                    totalDays += days;
                    if (w.type !== 'practicas') {
                        totalDaysNormal += days;
                    }
                }
            });

            let html = `
            <div class="work-stats">
                <div class="work-stat-card">
                    <div class="stat-value">${totalDays}</div>
                    <div class="stat-label">Días totales trabajados</div>
                </div>
                <div class="work-stat-card">
                    <div class="stat-value">${totalDaysNormal}</div>
                    <div class="stat-label">Días trabajados (excluyendo prácticas)</div>
                </div>
            </div>`;

            const sorted = [...work].sort((a, b) => b.startDate.localeCompare(a.startDate));

            sorted.forEach(w => {
                const typeLabel = w.type === 'practicas' ? 'Prácticas' : 'Puesto normal';
                const daysWorked = (w.startDate && w.endDate) ? calcularDiasLaborables(w.startDate, w.endDate, w
                    .holidays || 0) : 0;

                html += `
                <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="openWorkModal(${JSON.stringify(w).replace(/"/g,'&quot;')})">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-weight:700;font-size:16px">${w.company}</span>
                        <span style="font-size:12px;color:#6b7280">${w.position || ''}</span>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
                        <span style="font-size:12px;color:#6b7280">${w.startDate ? w.startDate : ''} ${w.endDate ? '→ ' + w.endDate : '→ Actual'}</span>
                        <span class="badge ${w.type === 'practicas' ? 'badge-pending' : 'badge-done'}">${typeLabel}</span>
                        ${daysWorked > 0 ? `<span style="font-size:12px;color:#6b7280">${daysWorked} días trabajados</span>` : ''}
                        ${(w.holidays || 0) > 0 ? `<span style="font-size:12px;color:#dc2626">${w.holidays} días de fiesta</span>` : ''}
                    </div>
                    ${w.functions ? `<div style="font-size:13px;color:#6b7280;margin-top:6px">${w.functions}</div>` : ''}
                    ${w.skills ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">Habilidades: ${w.skills}</div>` : ''}
                </div>`;
            });

            return html;
        }

            };

            const emoji = { books: '📖', movies: '🎬', series: '📺', games: '🎮' };

            if (type === 'books') {
                item.author = document.getElementById('modal-author').value.trim();

                item.endDate = document.getElementById('modal-end').value || '';
                startDate = item.startDate;

                item.year = parseInt(document.getElementById('modal-year').value) || null;

                item.platform = document.getElementById('modal-platform').value.trim();
                item.startDate = document.getElementById('modal-start').value || '';
                item.endDate = document.getElementById('modal-end').value || '';
                startDate = item.startDate;
                endDate = item.endDate;
            }

            const store = library[type] || [];

            if (editingItemId) {
                removeEntriesForItem(editingItemId, typeLabels[type]);
                const idx = store.findIndex(i => i.id === editingItemId);
                if (idx >= 0) store[idx] = item;
            } else {
                store.push(item);
            }
            library[type] = store;

            if (startDate) {
                addEntryForItem(
                    getEntryTitle(emoji[type] + ' Inicio: ' + item.title, item.id),
                    startDate,
                    typeLabels[type],
                    'Valoración: ' + (rating > 0 ? '⭐'.repeat(rating) : 'Sin valorar')
                );
            }

            if (endDate && endDate !== startDate) {
                addEntryForItem(
                    getEntryTitle(emoji[type] + ' Fin: ' + item.title, item.id),
                    endDate,
                    typeLabels[type],
                    'Valoración: ' + (rating > 0 ? '⭐'.repeat(rating) : 'Sin valorar')
                );
            }

            saveData();
            closeModal();
            render();
            showToast('Item guardado');
        }

        function deleteLibraryItem(type, id) {
            if (!confirm('¿Eliminar este item?')) return;
            const typeLabels = { books: 'Libro', movies: 'Película', series: 'Serie', games: 'Videojuego' };
            removeEntriesForItem(id, typeLabels[type]);
            const store = library[type] || [];
            library[type] = store.filter(i => i.id !== id);
            saveData();
            closeModal();
            render();
            showToast('Eliminado');
        }

        // ============================================================
        //  RENDER: LIBRARY (Todos los items)
        // ============================================================
        let libraryView = 'all';

        function renderLibrary() {
            const allItems = [];

            // Función para añadir items con su tipo
            function addItems(items, type) {
                items.forEach(i => {
                    allItems.push({ ...i, type: type });
                });
            }

            addItems(library.books, 'books');
            addItems(library.movies, 'movies');
            addItems(library.series, 'series');
            addItems(library.games, 'games');

            const filtered = libraryView === 'all' ? allItems : allItems.filter(i => i.type === libraryView);

            const counts = {
                all: allItems.length,
                books: library.books.length,
                movies: library.movies.length,
                series: library.series.length,
                games: library.games.length
            };

            const typeLabels = { books: 'Libro', movies: 'Película', series: 'Serie', games: 'Videojuego' };

            let html = `
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
                ${['all','books','movies','series','games'].map(t => `
                    <button class="btn-secondary ${libraryView === t ? 'active' : ''}" 
                        style="${libraryView === t ? 'background:#2a2a3a;color:#e2e8f0;border-color:#3a3a5c' : ''}"
                        onclick="libraryView='${t}';render()">${t === 'all' ? 'Todos' : t} (${counts[t]})</button>
                `).join('')}
            </div>`;

            if (!filtered.length) {
                html += `<div class="empty-state"><div class="empty-icon">☰</div><div class="empty-title">Sin items</div><div class="empty-sub">Pulsa "+ Nuevo item" para empezar</div></div>`;
                return html;
            }

            const sorted = filtered.sort((a, b) => {
                const dateA = a.endDate || a.watchDate || a.startDate || '';
                const dateB = b.endDate || b.watchDate || b.startDate || '';
                return dateB.localeCompare(dateA);
            });

            sorted.forEach(item => {
                let details = '';
                if (item.type === 'books') {
                    details =
                        `${item.author ? item.author + ' · ' : ''}${item.startDate || ''}${item.endDate ? ' → ' + item.endDate : ''}`;
                } else if (item.type === 'movies') {
                    details = `${item.year || ''}${item.watchDate ? ' · ' + item.watchDate : ''}`;
                } else if (item.type === 'series' || item.type === 'games') {
                    details =
                        `${item.platform ? item.platform + ' · ' : ''}${item.startDate || ''}${item.endDate ? ' → ' + item.endDate : ''}`;
                }
                const stars = item.rating ? '⭐'.repeat(item.rating) : '';

                html += `
                <div class="card" style="margin-bottom:8px;cursor:pointer;padding:14px 16px" onclick="openLibraryModal(${JSON.stringify(item).replace(/"/g,'&quot;')})">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <div>
                            <span style="font-weight:600;font-size:15px">${item.title}</span>
                            <span style="font-size:11px;color:#6b7280;margin-left:8px">${typeLabels[item.type]}</span>
                        </div>
                        ${stars ? `<span style="font-size:13px">${stars}</span>` : ''}
                    </div>
                    ${details ? `<div style="font-size:12px;color:#6b7280;margin-top:4px">${details}</div>` : ''}
                </div>`;
            });

            return html;
        }

                <div class="cultura-grid">

                    <div class="cultura-card">

                        <div class="numero">${peliculas.length}</div>

                    <div class="cultura-card">
                        <div class="categoria">📺 Series</div>
                        <div class="numero">${series.length}</div>
                        <div class="detalle">${series.filter(s => s.startDate && s.startDate >= inicioMes && s.startDate <= finMes).length} iniciadas · ${series.filter(s => s.endDate && s.endDate >= inicioMes && s.endDate <= finMes).length} terminadas</div>

                    `<div style="color:#6b7280;padding:20px 0;text-align:center">No hay actividad cultural este mes</div>` :

                                <div class="entry-title">${s.title}</div>

                    `).join('')}

                ${videojuegos.length > 0 ? `

                    ${videojuegos.map(g => `

                            </div>
                        </div>

            return html;

        function cambiarCulturaMes(delta) {
            culturaMonth += delta;
            if (culturaMonth < 0) { culturaMonth = 11;
                culturaYear--; }
            if (culturaMonth > 11) { culturaMonth = 0;
                culturaYear++; }
            render();
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const data = { entries, categories, goals, projects, travels, work, library };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bitacora_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exportado');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entries) entries = data.entries;
                    if (data.categories) categories = data.categories;
                    if (data.goals) goals = data.goals;
                    if (data.projects) projects = data.projects;
                    if (data.travels) travels = data.travels;
                    if (data.work) work = data.work;
                    if (data.library) library = data.library;
                    filteredEntries = [...entries];
                    saveData();
                    render();
                    showToast('Importado correctamente');
                } catch (err) {
                    showToast('Error al importar', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function render() {
            const content = document.getElementById('content');
            if (currentView === 'calendar') content.innerHTML = renderCalendar();
            else if (currentView === 'home') content.innerHTML = renderHome();
            else if (currentView === 'stats') content.innerHTML = renderStats();
            else if (currentView === 'goals') content.innerHTML = renderGoals();
            else if (currentView === 'projects') content.innerHTML = renderProjects();
            else if (currentView === 'travels') content.innerHTML = renderTravels();
            else if (currentView === 'work') content.innerHTML = renderWork();
            else if (currentView === 'cultura') content.innerHTML = renderCultura();
            else if (currentView === 'library') content.innerHTML = renderLibrary();
        }

        // ============================================================
        //  RENDER: CALENDAR
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function renderCalendar() {
            const entriesByDate = {};
            entries.forEach(e => {
                if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
                entriesByDate[e.date].push(e);
            });

            const today = new Date().toISOString().slice(0, 10);
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const offset = (firstDay + 6) % 7;

            const prevMonth = new Date(calYear, calMonth, 0);
            const daysInPrevMonth = prevMonth.getDate();

            let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(-1)">‹</button>
                <span style="font-size:17px;font-weight:700">${monthNames[calMonth]} ${calYear}</span>
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="changeMonth(1)">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;

            dayNames.forEach(d => {
                html +=
                    `<div style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;padding:6px 0 10px 0">${d}</div>`;
            });

            for (let i = 0; i < offset; i++) {
                const day = daysInPrevMonth - offset + i + 1;
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${day}</span></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr =
                `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayEntries = entriesByDate[dateStr] || [];

                const colors = [];
                const seen = new Set();
                dayEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    if (cat && !seen.has(cat.color)) {
                        seen.add(cat.color);
                        colors.push(cat.color);
                    }
                });

                const barsHtml = colors.slice(0, 4).map(color =>
                    `<span style="width:20px;height:3px;border-radius:4px;display:block;background:${color}"></span>`
                ).join('');

                const extra = colors.length > 4 ?
                    `<span style="width:12px;height:3px;border-radius:4px;display:block;background:#6b7280;font-size:7px;text-align:center">+${colors.length - 4}</span>` :
                    '';

                html += `
                <div style="background:#12121f;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid ${isToday ? '#e2e8f0' : 'transparent'};cursor:pointer;transition:background 0.15s ease" onclick="switchView('calendar');showDayEntries('${dateStr}')" onmouseover="this.style.background='#1a1a2e'" onmouseout="this.style.background='#12121f'">
                    <span style="font-size:13px;font-weight:700;display:block;margin-bottom:4px">${d}</span>
                    <div style="display:flex;flex-direction:column;gap:2px;align-items:center">${barsHtml}${extra}</div>
                </div>`;
            }

            const totalDays = offset + daysInMonth;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html +=
                    `<div style="background:transparent;border-radius:10px;padding:6px 4px 8px 4px;min-height:64px;text-align:center;border:1px solid transparent"><span style="font-size:13px;font-weight:700;opacity:0.3">${d}</span></div>`;
            }

            html += `</div>`;

            if (window._selectedDate) {
                html += renderDayEntries(window._selectedDate);
            }

            html += `
            <div class="search-bar" style="margin-top:24px">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="Buscar entradas..." oninput="doSearch(this.value)" id="search-input">
            </div>
            <div class="search-results" id="search-results-container"></div>`;

            html += `
            <style>
                body.light .calendar-day { background: #ffffff !important; border-color: #e2e8f0 !important; }
                body.light .calendar-day:hover { background: #f5f5f7 !important; }
                body.light .calendar-day.today { border-color: #1c1c1e !important; }
            </style>`;

            return html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11;
                calYear--; }
            if (calMonth > 11) { calMonth = 0;
                calYear++; }
            render();
        }

        function showDayEntries(date) {
            window._selectedDate = date;
            render();
        }

        function renderDayEntries(date) {
            const dayEntries = entries.filter(e => e.date === date);
            if (!dayEntries.length) return '';

            const dateObj = new Date(date + 'T12:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateLabel = dateObj.toLocaleDateString('es-ES', options);

            let html = `
            <div class="entries-section" style="margin-top:20px">
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <span>${dateLabel}</span>
                    <button class="btn-secondary" onclick="window._selectedDate=null;render()">✕ Cerrar</button>
                </div>`;

            dayEntries.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const catName = cat?.name || 'Sin categoría';

                html += `
                <div class="entry-item" onclick="openEditEntry(${e.id})">
                    <div class="entry-color-dot" style="background:${color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${e.title}</div>
                        <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                    </div>
                    <div class="entry-actions">
                        <button onclick="event.stopPropagation();openEditEntry(${e.id})">✎</button>
                        <button class="delete" onclick="event.stopPropagation();deleteEntry(${e.id})">✕</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: HOME (Centro resumen)
        // ============================================================
        function renderHome() {

            const todayEntries = entries.filter(e => e.date === today);
