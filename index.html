<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="theme-color" content="#0f172a">
<title>Bitácora — Agenda personal</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#0a0a0a;
  --bg-elev:#121212;
  --surface:#161616;
  --surface-2:#1d1d1d;
  --surface-3:#242424;
  --border:#2a2a2a;
  --border-soft:#202020;
  --text:#f2f2f0;
  --text-dim:#a3a3a0;
  --text-faint:#6b6b68;
  --white:#ffffff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.55);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --ease: cubic-bezier(.4,0,.2,1);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
:root.light{
  --bg:#f7f7f5;
  --bg-elev:#ffffff;
  --surface:#ffffff;
  --surface-2:#f0f0ee;
  --surface-3:#e8e8e5;
  --border:#e2e2df;
  --border-soft:#ececea;
  --text:#171716;
  --text-dim:#6b6b68;
  --text-faint:#9d9d99;
  --white:#000000;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 8px 24px rgba(0,0,0,.08);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.14);
}
/* ============================================================
   TEMAS (sistema unificado con body.dark / body.light)
   ============================================================ */
body.dark { --bg:#0a0a0a; --bg-elev:#121212; --surface:#161616; --surface-2:#1d1d1d; --surface-3:#242424; --border:#2a2a2a; --border-soft:#202020; --text:#f2f2f0; --text-dim:#a3a3a0; --text-faint:#6b6b68; --white:#ffffff; }
body.light { --bg:#f7f7f5; --bg-elev:#ffffff; --surface:#ffffff; --surface-2:#f0f0ee; --surface-3:#e8e8e5; --border:#e2e2df; --border-soft:#ececea; --text:#171716; --text-dim:#6b6b68; --text-faint:#9d9d99; --white:#000000; }
/* Por defecto dark si no hay clase */
body:not(.light):not(.dark) { --bg:#0a0a0a; --bg-elev:#121212; --surface:#161616; --surface-2:#1d1d1d; --surface-3:#242424; --border:#2a2a2a; --border-soft:#202020; --text:#f2f2f0; --text-dim:#a3a3a0; --text-faint:#6b6b68; --white:#ffffff; }

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:14px;
  line-height:1.5;
  transition: background 0.2s, color 0.2s;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
::selection{ background: var(--text); color: var(--bg); }
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; color:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{ display:flex; height:100vh; width:100vw; }

/* --- Sidebar --- */
#sidebar{
  width:236px; flex-shrink:0; background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:16px 10px;
  transition: transform .25s var(--ease);
}
.brand{ display:flex; align-items:center; gap:9px; padding:6px 10px 18px; }
.brand-mark{ width:20px; height:20px; border-radius:6px; background:var(--text); flex-shrink:0; position:relative; }
.brand-mark::after{ content:""; position:absolute; inset:5px; border-radius:2px; background:var(--bg-elev); }
.brand-name{ font-weight:600; font-size:14.5px; letter-spacing:-0.01em; }

.search-trigger{
  display:flex; align-items:center; gap:8px; padding:8px 10px; margin-bottom:14px;
  border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-faint);
  font-size:12.5px; background:var(--surface);
}
.search-trigger:hover{ border-color:var(--text-faint); color:var(--text-dim); }
.kbd{ margin-left:auto; font-size:10.5px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text-faint); }

.nav-group{ margin-bottom:4px; }
.nav-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:12px 10px 6px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:13px; position:relative; transition:background .15s var(--ease), color .15s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.nav-item svg{ flex-shrink:0; opacity:.85; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--surface-3); color:var(--text); font-weight:600; }
.nav-item .dot{ width:6px; height:6px; border-radius:50%; margin-left:auto; }
#nav-scroll{ flex:1; overflow-y:auto; padding-bottom:8px; }

.sidebar-footer{ display:flex; gap:6px; padding-top:8px; border-top:1px solid var(--border-soft); }
.icon-btn{
  display:flex; align-items:center; justify-content:center; width:32px; height:32px;
  border-radius:var(--radius-sm); color:var(--text-dim); background:transparent; border:1px solid transparent;
}
.icon-btn:hover{ background:var(--surface-2); color:var(--text); border-color:var(--border); }

/* --- Main --- */
#main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 28px; border-bottom:1px solid var(--border-soft); flex-shrink:0;
}
#topbar h1{ font-size:19px; font-weight:650; letter-spacing:-0.01em; }
#topbar .sub{ font-size:12.5px; color:var(--text-faint); margin-top:2px; }
.topbar-actions{ display:flex; gap:8px; align-items:center; }
#menu-btn{ display:none; }

#content{ flex:1; overflow-y:auto; padding:24px 28px 80px; }
.view{ display:none; animation: fadeUp .25s var(--ease); max-width:1180px; }
.view.active{ display:block; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ============================================================
   COMPONENTS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; font-weight:500;
  transition: all .15s var(--ease);
}
.btn:hover{ background:var(--surface-2); border-color:var(--text-faint); }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
.btn-primary:hover{ opacity:.85; background:var(--text); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ color:#e5484d; }
.btn-danger:hover{ background:rgba(229,72,77,.1); border-color:rgba(229,72,77,.3); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.btn-icon-only{ padding:8px; }

.card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px; }
.card:hover{ border-color:var(--border); }

.grid-stats{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
.stat-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px 16px; transition:border-color .15s; }
.stat-card:hover{ border-color:var(--border); }
.stat-num{ font-size:26px; font-weight:650; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stat-label{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }

.section-title{ font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:28px 0 12px; }
.section-title:first-child{ margin-top:0; }

.list-row{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-soft); background:var(--surface); margin-bottom:6px; transition:border-color .15s;
}
.list-row:hover{ border-color:var(--border); }
.list-row .lr-icon{ width:30px; height:30px; border-radius:8px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.list-row .lr-main{ flex:1; min-width:0; }
.list-row .lr-title{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .lr-sub{ font-size:12px; color:var(--text-faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .lr-meta{ font-size:11.5px; color:var(--text-dim); flex-shrink:0; text-align:right; }
.list-row .lr-actions{ display:flex; gap:2px; opacity:0; transition:opacity .15s; flex-shrink:0; }
.list-row:hover .lr-actions{ opacity:1; }

.badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; border:1px solid var(--border); color:var(--text-dim); }
.tag{ font-size:11px; padding:2px 8px; border-radius:99px; background:var(--surface-3); color:var(--text-dim); }
.rating-stars{ letter-spacing:1px; color:var(--text); font-size:12px; }
.progress-track{ height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--text); border-radius:99px; transition:width .4s var(--ease); }

.empty-state{ text-align:center; padding:56px 20px; color:var(--text-faint); }
.empty-state svg{ opacity:.35; margin-bottom:10px; }
.empty-state p{ font-size:13px; }

.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filter-select, .mini-input{
  background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
  padding:7px 10px; font-size:12.5px;
}
.filter-select:focus, .mini-input:focus{ outline:none; border-color:var(--text-faint); }

/* Forms */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
.form-field{ display:flex; flex-direction:column; gap:5px; }
.form-field.full{ grid-column:1/-1; }
.form-field label{ font-size:11.5px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.form-field input, .form-field select, .form-field textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:13.5px; color:var(--text); width:100%; transition:border-color .15s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{ outline:none; border-color:var(--text-dim); background:var(--surface); }
.form-field textarea{ resize:vertical; min-height:70px; font-family:inherit; }
.star-picker{ display:flex; gap:4px; }
.star-picker button{ background:none; border:none; font-size:19px; color:var(--border); padding:0; line-height:1; }
.star-picker button.on{ color:var(--text); }
.checklist-editor{ display:flex; flex-direction:column; gap:6px; }
.checklist-row{ display:flex; align-items:center; gap:8px; }
.checklist-row input[type=text]{ flex:1; }

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:200; opacity:0;
  transition:opacity .18s var(--ease); padding:20px;
}
.overlay.show{ opacity:1; }
.modal{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg); transform:translateY(12px) scale(.98); transition:transform .2s var(--ease);
}
.overlay.show .modal{ transform:translateY(0) scale(1); }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
.modal-header h2{ font-size:15.5px; font-weight:650; }
.modal-body{ padding:20px; overflow-y:auto; }
.modal-footer{ display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border-soft); flex-shrink:0; }

/* Side panel (day detail) */
#sidepanel-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190; opacity:0; pointer-events:none; transition:opacity .2s var(--ease); }
#sidepanel-overlay.show{ opacity:1; pointer-events:auto; }
#sidepanel{
  position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw; background:var(--bg-elev);
  border-left:1px solid var(--border); z-index:191; transform:translateX(100%); transition:transform .25s var(--ease);
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
}
#sidepanel.show{ transform:translateX(0); }
.sp-header{ padding:20px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
.sp-body{ flex:1; overflow-y:auto; padding:16px 20px 40px; }

/* Toast */
#toast-wrap{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{ background:var(--text); color:var(--bg); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:99px; box-shadow:var(--shadow-md); animation:toastIn .2s var(--ease); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* Calendar */
.cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-title{ font-size:17px; font-weight:650; min-width:190px; }
.cal-nav{ display:flex; gap:4px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ font-size:10.5px; text-transform:uppercase; color:var(--text-faint); text-align:center; padding-bottom:6px; letter-spacing:.05em; }
.cal-cell{
  aspect-ratio:1/0.82; min-height:76px; border-radius:var(--radius-sm); border:1px solid var(--border-soft);
  background:var(--surface); padding:6px; display:flex; flex-direction:column; gap:3px; overflow:hidden; position:relative;
  transition:border-color .15s, background .15s;
}
.cal-cell:hover{ border-color:var(--text-faint); background:var(--surface-2); }
.cal-cell.other-month{ opacity:.32; }
.cal-cell.today{ border-color:var(--text); }
.cal-cell .cd-num{ font-size:11.5px; font-weight:600; color:var(--text-dim); }
.cal-cell.today .cd-num{ color:var(--text); background:var(--text); color:var(--bg); width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.cd-dots{ display:flex; flex-wrap:wrap; gap:3px; }
.cd-dot{ width:6px; height:6px; border-radius:50%; }
.cd-entry-txt{ font-size:9.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Map */
.map-wrap{ position:relative; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); overflow:hidden; }
.map-point{ position:absolute; width:9px; height:9px; border-radius:50%; background:var(--text); border:2px solid var(--bg-elev); transform:translate(-50%,-50%); cursor:pointer; transition:transform .15s; box-shadow:0 0 0 2px var(--surface); }
.map-point:hover{ transform:translate(-50%,-50%) scale(1.5); }

/* Search overlay */
#search-modal .modal{ max-width:600px; }
.search-input-wrap{ display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border-soft); }
.search-input-wrap input{ flex:1; background:transparent; border:none; font-size:16px; color:var(--text); }
.search-input-wrap input:focus{ outline:none; }
.search-results{ max-height:56vh; overflow-y:auto; padding:8px; }
.sr-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:10px 10px 4px; }

/* Responsive */
@media (max-width: 860px){
  #sidebar{ position:fixed; z-index:150; top:0; left:0; height:100vh; transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  #sidebar.open{ transform:translateX(0); }
  #menu-btn{ display:flex; }
  #topbar{ padding:14px 16px; }
  #content{ padding:16px 16px 90px; }
  .form-grid{ grid-template-columns:1fr; }
  #sidepanel{ width:100%; max-width:100%; }
  .cal-cell{ min-height:58px; }
  .cd-entry-txt{ display:none; }
}
#sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:140; }
#sidebar-scrim.show{ display:block; }

/* ============================================================
   SELECTOR DE TEMAS (estilo Train-tracker)
   ============================================================ */
.theme-selector { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.theme-btn { flex: 1; padding: 8px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; }
.theme-btn.active { border-color: #2563eb; }
.theme-dark { background: #0a0a0f; color: white; }
.theme-light { background: #f0f2f7; color: #0f172a; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar-scrim" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Bitácora</div>
    </div>
    <div class="search-trigger" onclick="openSearch()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Buscar…</span>
      <span class="kbd">/</span>
    </div>
    <div id="nav-scroll">
      <div class="nav-group">
        <div class="nav-item" data-view="dashboard" onclick="showView('dashboard')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
          Inicio
        </div>
        <div class="nav-item" data-view="calendar" onclick="showView('calendar')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Calendario
        </div>
        <div class="nav-item" data-view="stats" onclick="showView('stats')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Estadísticas
        </div>
      </div>
      <div class="nav-label">Registro</div>
      <div class="nav-group" id="nav-entities"></div>
      <div class="nav-label">Planificación</div>
      <div class="nav-group">
        <div class="nav-item" data-view="objetivos" onclick="showView('objetivos')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg>Objetivos</div>
        <div class="nav-item" data-view="proyectos" onclick="showView('proyectos')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h5l2 2h11v10H3z"/></svg>Proyectos</div>
        <div class="nav-item" data-view="viajes" onclick="showView('viajes')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16l20-8-8 20-3-9-9-3z"/></svg>Viajes</div>
        <div class="nav-item" data-view="trabajo" onclick="showView('trabajo')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Trabajo</div>
        <div class="nav-item" data-view="finanzas" onclick="showView('finanzas')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.5-1.3-2-3-2s-3 .8-3 2.2 1.3 1.8 3 2 3 .7 3 2.1-1.3 2.2-3 2.2-3-.5-3-2"/></svg>Finanzas</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="icon-btn" title="Modo claro/oscuro" onclick="toggleTheme()">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/></svg>
      </button>
      <button class="icon-btn" title="Exportar copia de seguridad" onclick="exportBackup()">

function icon(name, size=14){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

/* ============================================================================================
   UTILITIES
   ============================================================================================ */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO = () => new Date().toISOString().slice(0,10);
const escapeHtml = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}
function fmtMonthYear(y,m){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[m]} ${y}`;
}
function daysBetween(a,b){ if(!a||!b) return 0; return Math.round((new Date(b)-new Date(a))/86400000); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2200);
}
function stars(n, max=5){ n=n||0; return '★'.repeat(n)+'☆'.repeat(max-n); }

/* ============================================================================================
   DATA MODEL / PERSISTENCE
   ============================================================================================ */
const STORAGE_KEY = 'bitacora_db_v1';

const DB = {
  state: null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : this.blank();
      const blank = this.blank();
      for(const k in blank){ if(!(k in this.state)) this.state[k] = blank[k]; }
    }catch(e){
      console.error('Error cargando datos', e);
      this.state = this.blank();
    }
  },
  blank(){
    return {
      libros:[], series:[], peliculas:[], videojuegos:[], restaurantes:[], videos:[],
      personas:[], planes:[], lugares:[], notas:[], objetivos:[], proyectos:[], viajes:[],
      empresas:[], registrosTrabajo:[], finanzas:[]
    };
  },
  save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); }
    catch(e){ toast('⚠️ No se pudo guardar (almacenamiento lleno)'); console.error(e); }
  },
  all(type){ return this.state[type] || []; },
  get(type,id){ return (this.state[type]||[]).find(x=>x.id===id); },
  add(type,data){
    const item = Object.assign({ id: uid(), createdAt: new Date().toISOString() }, data);
    this.state[type].unshift(item);
    this.save();
    return item;
  },
  update(type,id,data){
    const arr=this.state[type]; const i=arr.findIndex(x=>x.id===id);
    if(i>-1){ arr[i]=Object.assign({},arr[i],data); this.save(); return arr[i]; }
  },
  remove(type,id){
    this.state[type] = this.state[type].filter(x=>x.id!==id);
    this.save();
  },
  duplicate(type,id){
    const item = this.get(type,id);
    if(!item) return;
    const copy = Object.assign({}, item, { id: uid(), createdAt: new Date().toISOString() });
    if(copy.titulo) copy.titulo += ' (copia)';
    if(copy.nombre) copy.nombre += ' (copia)';
    this.state[type].unshift(copy);
    this.save();
    return copy;
  }
};
DB.load();

/* ============================================================================================
   NAV / ROUTER (estilo Train-tracker: showView + render)
   ============================================================================================ */
const navEntities = document.getElementById('nav-entities');
Object.keys(SCHEMAS).forEach(type=>{
  const s = SCHEMAS[type];
  const el = document.createElement('div');
  el.className='nav-item'; el.dataset.view=type; el.onclick=()=>showView(type);
  el.innerHTML = `${icon(s.icon)}${s.label}`;
  navEntities.appendChild(el);
});

let currentView = 'dashboard';

function showView(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  closeSidebar();
  render();
}

function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-scrim').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('show'); }

function setHeader(title, sub, actionsHtml){
  document.getElementById('view-title').textContent = title;
  document.getElementById('view-sub').textContent = sub || '';
  document.getElementById('topbar-actions').innerHTML = actionsHtml || '';
}

function render(){
  const contentEl = document.getElementById('view-content');
  if(!contentEl) return;
  if(SCHEMAS[currentView]) return renderEntityView(currentView);
  switch(currentView){
    case 'dashboard': return renderDashboard();
    case 'calendar': return renderCalendarView();
    case 'stats': return renderStats();
    case 'objetivos': return renderObjetivos();
    case 'proyectos': return renderProyectos();
    case 'viajes': return renderViajes();
    case 'trabajo': return renderTrabajo();
    case 'finanzas': return renderFinanzas();
    default: contentEl.innerHTML = '<div class="empty-state">Vista no encontrada</div>';
  }
}

/* ============================================================================================
   GENERIC ENTITY LIST VIEW
   ============================================================================================ */
let entityFilter = {};

function renderEntityView(type){
  const schema = SCHEMAS[type];
  const items = DB.all(type);
  entityFilter[type] = entityFilter[type] || { q:'', status:'', sort:'recent' };
  const f = entityFilter[type];

  setHeader(schema.label, `${items.length} registro${items.length===1?'':'s'}`,
    `<button class="btn btn-primary btn-sm" onclick="openEntityForm('${type}')">${icon('plus')} Añadir</button>`);

  const hasStatus = schema.fields.some(fl=>fl.k==='estado');
  const statusOpts = hasStatus ? [...new Set(items.map(i=>i.estado).filter(Boolean))] : [];

  let filtered = items.filter(i=>{
    if(f.q){
      const hay = JSON.stringify(i).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    if(f.status && i.estado!==f.status) return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(f.sort==='recent') return (b.createdAt||'').localeCompare(a.createdAt||'');
    if(f.sort==='oldest') return (a.createdAt||'').localeCompare(b.createdAt||'');
    if(f.sort==='rating') return (b.valoracion||0)-(a.valoracion||0);
    if(f.sort==='az') return (schema.title(a)||'').localeCompare(schema.title(b)||'');
    return 0;
  });

  let html = `<div class="toolbar">
    <div class="toolbar-left">
      <input class="mini-input" placeholder="Filtrar en ${schema.label.toLowerCase()}…" value="${escapeHtml(f.q)}" oninput="entityFilter['${type}'].q=this.value; renderEntityView('${type}')" style="width:200px">
      ${hasStatus?`<select class="filter-select" onchange="entityFilter['${type}'].status=this.value; renderEntityView('${type}')">
        <option value="">Todos los estados</option>
        ${statusOpts.map(s=>`<option value="${escapeHtml(s)}" ${f.status===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
      </select>`:''}
      <select class="filter-select" onchange="entityFilter['${type}'].sort=this.value; renderEntityView('${type}')">
        <option value="recent" ${f.sort==='recent'?'selected':''}>Más recientes</option>
        <option value="oldest" ${f.sort==='oldest'?'selected':''}>Más antiguos</option>
        <option value="az" ${f.sort==='az'?'selected':''}>A–Z</option>
        <option value="rating" ${f.sort==='rating'?'selected':''}>Mejor valorados</option>
      </select>
    </div>
  </div>`;

  if(type==='libros'){
    const fin = items.filter(i=>i.estado==='Finalizado' && i.fechaInicio && i.fechaFin);
    const avgDays = fin.length ? Math.round(fin.reduce((s,i)=>s+daysBetween(i.fechaInicio,i.fechaFin),0)/fin.length) : 0;
    html += `<div class="grid-stats" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-num">${items.length}</div><div class="stat-label">Total de libros</div></div>
      <div class="stat-card"><div class="stat-num">${items.filter(i=>i.estado==='Finalizado').length}</div><div class="stat-label">Finalizados</div></div>
      <div class="stat-card"><div class="stat-num">${avgDays||'—'}</div><div class="stat-label">Días medios de lectura</div></div>
    </div>`;
  }
  if(type==='lugares'){
    html += renderMiniMap(items);
  }

  if(!filtered.length){
    html += emptyState(schema.icon, `Sin ${schema.label.toLowerCase()} todavía`, `Añade tu primer registro de ${schema.labelSingular.toLowerCase()}.`);
  } else {
    html += `<div>${filtered.map(i=>entityRow(type,i)).join('')}</div>`;
  }
  document.getElementById('view-content').innerHTML = html;
}

function emptyState(iconName, title, sub){
  return `<div class="empty-state">${icon(iconName,30)}<p style="font-weight:600;color:var(--text-dim);margin-bottom:2px">${title}</p><p>${sub}</p></div>`;
}

function entityRow(type, item){
  const schema = SCHEMAS[type];
  const metaVal = schema.meta(item);
  return `<div class="list-row" onclick="openEntityForm('${type}','${item.id}')">
    <div class="lr-icon">${icon(schema.icon,14)}</div>
    <div class="lr-main">
      <div class="lr-title">${escapeHtml(schema.title(item)||'(sin título)')}</div>
      <div class="lr-sub">${escapeHtml(schema.sub(item))}</div>
    </div>
    <div class="lr-meta">${escapeHtml(metaVal)}</div>
    <div class="lr-actions" onclick="event.stopPropagation()">
      <button class="icon-btn" title="Duplicar" onclick="DB.duplicate('${type}','${item.id}'); render()">${icon('copy',13)}</button>
      <button class="icon-btn btn-danger" title="Eliminar" onclick="confirmDelete('${type}','${item.id}')">${icon('trash',13)}</button>
    </div>
  </div>`;
}

function confirmDelete(type,id, after){
  openModal(`
    <div class="modal-header"><h2>¿Eliminar registro?</h2><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body"><p style="color:var(--text-dim); font-size:13.5px">Esta acción no se puede deshacer.</p></div>

      <button class="btn" onclick="closeModal()">Cancelar</button>

/* ---- Generic form builder ---- */
function openEntityForm(type, id){
  const schema = SCHEMAS[type];
  const item = id ? DB.get(type,id) : {};
  const isEdit = !!id;
  const fieldsHtml = schema.fields.map(fl=>fieldHtml(fl, item[fl.k])).join('');
  openModal(`
    <div class="modal-header"><h2>${isEdit?'Editar':'Nuevo'} ${schema.labelSingular.toLowerCase()}</h2><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body"><form id="entity-form" class="form-grid">${fieldsHtml}</form></div>
    <div class="modal-footer">
      ${isEdit?`<button class="btn btn-danger" style="margin-right:auto" onclick="confirmDelete('${type}','${id}', 'closeModal')">${icon('trash',13)} Eliminar</button>`:''}
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEntityForm('${type}', ${isEdit?`'${id}'`:'null'})">${icon('check',13)} Guardar</button>
    </div>`);
}
function fieldHtml(fl, val){
  const id = 'f_'+fl.k;
  const wrapClass = fl.full ? 'form-field full' : 'form-field';
  if(fl.type==='textarea'){
    return `<div class="${wrapClass}"><label>${fl.label}</label><textarea id="${id}">${escapeHtml(val||'')}</textarea></div>`;
  }
  if(fl.type==='select'){
    return `<div class="${wrapClass}"><label>${fl.label}</label><select id="${id}">${fl.options.map(o=>`<option ${((val||fl.default)===o)?'selected':''}>${o}</option>`).join('')}</select></div>`;
  }
  if(fl.type==='rating'){
    const v = val||0;
    return `<div class="${wrapClass}"><label>${fl.label}</label><div class="star-picker" id="${id}" data-val="${v}">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=v?'on':''}" onclick="setStar('${id}',${n})">★</button>`).join('')}</div></div>`;
  }
  if(fl.type==='photo'){
    return `<div class="${wrapClass}"><label>${fl.label}</label>
      <input type="file" accept="image/*" id="${id}_file" onchange="handlePhotoInput('${id}')">
      <input type="hidden" id="${id}" value="${escapeHtml(val||'')}">
      <div id="${id}_preview" style="margin-top:8px">${val?`<img src="${val}" style="max-width:140px;border-radius:8px;border:1px solid var(--border)">`:''}</div>
    </div>`;
  }
  return `<div class="${wrapClass}"><label>${fl.label}</label><input type="${fl.type==='date'?'date':fl.type==='number'?'number':'text'}" id="${id}" value="${escapeHtml(val==null?'':val)}"></div>`;
}
function setStar(id,n){
  const wrap = document.getElementById(id);
  const cur = parseInt(wrap.dataset.val)||0;
  const nv = (cur===n) ? n-1 : n;
  wrap.dataset.val = nv;
  [...wrap.children].forEach((b,i)=>b.classList.toggle('on', i<nv));
}
function handlePhotoInput(id){
  const file = document.getElementById(id+'_file').files[0];
  if(!file) return;
  if(file.size > 1200000){ toast('Imagen demasiado grande (máx ~1.2MB)'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById(id).value = e.target.result;
    document.getElementById(id+'_preview').innerHTML = `<img src="${e.target.result}" style="max-width:140px;border-radius:8px;border:1px solid var(--border)">`;
  };
  reader.readAsDataURL(file);
}
function saveEntityForm(type, id){
  const schema = SCHEMAS[type];
  const data = {};
  for(const fl of schema.fields){
    if(fl.type==='rating'){
      data[fl.k] = parseInt(document.getElementById('f_'+fl.k).dataset.val)||0;
    } else if(fl.type==='number'){
      const v = document.getElementById('f_'+fl.k).value;
      data[fl.k] = v===''? null : parseFloat(v);
    } else {
      data[fl.k] = document.getElementById('f_'+fl.k).value;
    }
  }
  const requiredMissing = schema.fields.find(fl=>fl.required && !data[fl.k]);
  if(requiredMissing){ toast(`Falta: ${requiredMissing.label}`); return; }
  if(id) DB.update(type,id,data); else DB.add(type,data);
  closeModal();
  render();
  toast('Guardado');
}

/* ============================================================================================
   MINI MAP
   ============================================================================================ */
function renderMiniMap(items){
  const pts = items.filter(i=>i.lat!=null && i.lon!=null && i.lat!=='' && i.lon!=='');
  const W=600, H=340;
  const latMin=35, latMax=71, lonMin=-10, lonMax=40;
  function proj(lat,lon){
    const x = ((lon-lonMin)/(lonMax-lonMin))*W;
    const y = H - ((lat-latMin)/(latMax-latMin))*H;
    return [x,y];
  }
  let dots = pts.map(p=>{
    const [x,y]=proj(parseFloat(p.lat), parseFloat(p.lon));
    return `<div class="map-point" style="left:${(x/W*100)}%; top:${(y/H*100)}%" title="${escapeHtml(p.titulo)}" onclick="openEntityForm('lugares','${p.id}')"></div>`;
  }).join('');
  return `<div class="section-title">Mapa (Europa, esquemático)</div>
  <div class="map-wrap" style="height:280px; margin-bottom:20px">
    <svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" style="position:absolute; inset:0; opacity:.5">
      ${Array.from({length:9}).map((_,i)=>`<line x1="0" y1="${i*H/8}" x2="${W}" y2="${i*H/8}" stroke="var(--border-soft)" stroke-width="1"/>`).join('')}
      ${Array.from({length:11}).map((_,i)=>`<line x1="${i*W/10}" y1="0" x2="${i*W/10}" y2="${H}" stroke="var(--border-soft)" stroke-width="1"/>`).join('')}
    </svg>
    ${dots || ''}
    ${!pts.length?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:12.5px">Añade latitud/longitud a tus lugares para verlos aquí</div>`:''}
  </div>`;
}

   ============================================================================================ */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function collectEntriesForDate(iso){
  const out = [];
  CALENDAR_TYPES.forEach(type=>{
    const schema = SCHEMAS[type];
    DB.all(type).forEach(item=>{
      const df = schema.dateField;
      if(item[df]===iso){ out.push({type,item}); }
    });
  });
  DB.all('registrosTrabajo').forEach(r=>{ if(r.fecha===iso) out.push({type:'registrosTrabajo', item:r}); });
  return out;
}

function renderCalendarView(){
  setHeader('Calendario', 'Toda tu vida, día a día',
    `<button class="btn btn-sm" onclick="jumpToday()">Hoy</button>`);
  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayStr = todayISO();

  let cells = '';
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    let cellDate, otherMonth=false;
    if(dayNum<1){ cellDate = new Date(calYear, calMonth-1, daysInPrevMonth+dayNum); otherMonth=true; }
    else if(dayNum>daysInMonth){ cellDate = new Date(calYear, calMonth+1, dayNum-daysInMonth); otherMonth=true; }
    else { cellDate = new Date(calYear, calMonth, dayNum); }
    const iso = cellDate.toISOString().slice(0,10);
    const entries = collectEntriesForDate(iso);
    const isToday = iso===todayStr;
    cells += `<div class="cal-cell ${otherMonth?'other-month':''} ${isToday?'today':''}" onclick="openDayPanel('${iso}')">
      <div class="cd-num">${cellDate.getDate()}</div>
      ${entries.length ? `<div class="cd-dots">${entries.slice(0,6).map(e=>`<span class="cd-dot" style="background:${SCHEMAS[e.type]?.gray||'var(--text-dim)'}"></span>`).join('')}</div>` : ''}
      ${entries[0]?`<div class="cd-entry-txt">${escapeHtml((SCHEMAS[entries[0].type]?.title(entries[0].item))||'')}</div>`:''}
    </div>`;
  }
  const dows = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const html = `
    <div class="cal-header">
      <div class="cal-title">${fmtMonthYear(calYear,calMonth)}</div>
      <div class="cal-nav">
        <button class="icon-btn" onclick="calMonth--; if(calMonth<0){calMonth=11;calYear--;} render()">${icon('chevronL')}</button>
        <button class="icon-btn" onclick="calMonth++; if(calMonth>11){calMonth=0;calYear++;} render()">${icon('chevronR')}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="section-title">Leyenda</div>
    <div style="display:flex; flex-wrap:wrap; gap:10px">
      ${CALENDAR_TYPES.map(t=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)"><span class="cd-dot" style="background:${SCHEMAS[t].gray}"></span>${SCHEMAS[t].label}</div>`).join('')}
    </div>`;
  document.getElementById('view-content').innerHTML = html;
}
function jumpToday(){ const d=new Date(); calYear=d.getFullYear(); calMonth=d.getMonth(); render(); }

function openDayPanel(iso){
  const entries = collectEntriesForDate(iso);
  document.getElementById('sp-date-label').textContent = 'Detalle del día';
  document.getElementById('sp-title').textContent = fmtDate(iso);

function renderTrabajo(){
  const empresas = DB.all('empresas');
  const registros = DB.all('registrosTrabajo');
  setHeader('Trabajo', 'Historial laboral y registro diario');

  const totalDias = empresas.reduce((s,e)=> s + (e.fechaFin? daysBetween(e.fechaInicio,e.fechaFin) : (e.fechaInicio? daysBetween(e.fechaInicio,todayISO()):0)), 0);
  const totalHorasReg = registros.reduce((s,r)=>s+workHours(r),0);
  const horasPracticas = empresas.filter(e=>e.tipo==='Prácticas').length;
  const horasNormal = empresas.filter(e=>e.tipo==='Trabajo normal').length;

  let html = `<div class="grid-stats" style="margin-bottom:24px">
    <div class="stat-card"><div class="stat-num">${empresas.length}</div><div class="stat-label">Empresas</div></div>
    <div class="stat-card"><div class="stat-num">${totalDias}</div><div class="stat-label">Días trabajados (total)</div></div>
    <div class="stat-card"><div class="stat-num">${totalHorasReg.toFixed(1)}</div><div class="stat-label">Horas registradas</div></div>
    <div class="stat-card"><div class="stat-num">${horasNormal}</div><div class="stat-label">Empleos normales</div></div>
    <div class="stat-card"><div class="stat-num">${horasPracticas}</div><div class="stat-label">Prácticas</div></div>
  </div>`;

  html += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>Historial de empresas</span>
    <button class="btn btn-sm" onclick="openCompanyForm()">${icon('plus',12)} Añadir empresa</button>
  </div>`;
  html += empresas.length ? empresas.map(e=>{
    const dias = e.fechaFin? daysBetween(e.fechaInicio,e.fechaFin) : (e.fechaInicio?daysBetween(e.fechaInicio,todayISO()):0);
    return `<div class="list-row" onclick="openCompanyForm('${e.id}')">
      <div class="lr-icon">${icon('briefcase',14)}</div>
      <div class="lr-main"><div class="lr-title">${escapeHtml(e.empresa)} — ${escapeHtml(e.puesto||'')}</div>
      <div class="lr-sub">${escapeHtml(e.tipo||'')} · ${fmtDate(e.fechaInicio)} → ${e.fechaFin?fmtDate(e.fechaFin):'actualidad'}</div></div>
      <div class="lr-meta">${dias} días</div>
    </div>`;
  }).join('') : emptyState('briefcase','Sin empresas registradas','Añade tu historial laboral.');

  html += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>Registro diario</span>
    <button class="btn btn-sm" onclick="openWorkLogForm()">${icon('plus',12)} Añadir jornada</button>
  </div>`;
  const monthly = {};
  registros.forEach(r=>{ const k=(r.fecha||'').slice(0,7); monthly[k]=(monthly[k]||0)+workHours(r); });
  html += Object.keys(monthly).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    ${Object.entries(monthly).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6).map(([m,h])=>`<span class="tag">${m}: ${h.toFixed(1)} h</span>`).join('')}
  </div>`:'';
  html += registros.length ? registros.slice(0,30).map(r=>`<div class="list-row" onclick="openWorkLogForm('${r.id}')">
      <div class="lr-icon">${icon('clock',14)}</div>
      <div class="lr-main"><div class="lr-title">${escapeHtml(r.empresa||'')}</div><div class="lr-sub">${fmtDate(r.fecha)} · ${escapeHtml(r.horaInicio||'')}–${escapeHtml(r.horaFin||'')}</div></div>
      <div class="lr-meta">${workHours(r).toFixed(1)} h</div>
    </div>`).join('') : emptyState('clock','Sin jornadas registradas','Registra tus días trabajados para calcular horas automáticamente.');

  document.getElementById('view-content').innerHTML = html;
}
function workHours(r){
  if(!r.horaInicio || !r.horaFin) return 0;
  const [h1,m1] = r.horaInicio.split(':').map(Number);
  const [h2,m2] = r.horaFin.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins<0) mins += 24*60;
  return mins/60;
}

function openSearch(){
  openModal(`
    <div class="search-input-wrap">
      ${icon('search',16)}
      <input id="global-search-input" placeholder="Buscar por texto o fecha (dd/mm/aaaa)…" autofocus>
    </div>
    <div class="search-results" id="global-search-results">
      <div style="padding:30px; text-align:center; color:var(--text-faint); font-size:12.5px">Escribe para buscar en toda tu bitácora</div>
    </div>`, 'search-modal');
  const input = document.getElementById('global-search-input');
  input.addEventListener('input', debounce(()=>runGlobalSearch(input.value),150));
  setTimeout(()=>input.focus(),50);
}
function runGlobalSearch(q){
  const box = document.getElementById('global-search-results');
  if(!q.trim()){ box.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-faint); font-size:12.5px">Escribe para buscar en toda tu bitácora</div>`; return; }
  const dateMatch = q.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);
  let targetISO = null;
  if(dateMatch){ targetISO = `${dateMatch[3]}-${dateMatch[2].padStart(2,'0')}-${dateMatch[1].padStart(2,'0')}`; }
  const ql = q.toLowerCase();
  let results = [];
  Object.keys(SCHEMAS).forEach(type=>{
    const schema = SCHEMAS[type];
    DB.all(type).forEach(item=>{
      let match=false;
      if(targetISO && item[schema.dateField]===targetISO) match=true;
      if(!match && JSON.stringify(item).toLowerCase().includes(ql)) match=true;
      if(match) results.push({type,item});
    });
  });
  if(!results.length){ box.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-faint); font-size:12.5px">Sin resultados para "${escapeHtml(q)}"</div>`; return; }
  const byType={};
  results.forEach(r=>{ (byType[r.type]=byType[r.type]||[]).push(r.item); });
  let html='';
  Object.entries(byType).forEach(([type,arr])=>{
    const schema=SCHEMAS[type];
    html += `<div class="sr-group-label">${schema.label} (${arr.length})</div>`;
    html += arr.slice(0,8).map(item=>`<div class="list-row" onclick="closeModal(); openEntityForm('${type}','${item.id}')">
      <div class="lr-icon">${icon(schema.icon,14)}</div>
      <div class="lr-main"><div class="lr-title">${escapeHtml(schema.title(item))}</div><div class="lr-sub">${escapeHtml(schema.sub(item))}</div></div>
    </div>`).join('');
  });
  box.innerHTML = html;
}

function openModal(innerHtml, extraId){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="active-overlay" onmousedown="if(event.target===this) closeModal()"><div class="modal" id="${extraId||'active-modal'}">${innerHtml}</div></div>`;
  requestAnimationFrame(()=>document.getElementById('active-overlay').classList.add('show'));
  document.addEventListener('keydown', modalEscHandler);
}
function closeModal(){
  const ov = document.getElementById('active-overlay');
  if(!ov) return;
  ov.classList.remove('show');
  document.removeEventListener('keydown', modalEscHandler);
  setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; }, 180);
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }

/* ============================================================================================
   THEME (estilo Train-tracker: body.dark/light + toggleThemePreset)
   ============================================================================================ */
function toggleTheme(){
  const isDark = document.body.classList.contains('dark');
  if(isDark){
    document.body.classList.remove('dark');
    document.body.classList.add('light');
  } else {
    document.body.classList.remove('light');
    document.body.classList.add('dark');
  }
  localStorage.setItem('bitacora_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  updateThemeIcon();
}

function toggleThemePreset(theme){
  document.body.classList.remove('dark', 'light');
  document.body.classList.add(theme);
  localStorage.setItem('bitacora_theme', theme);
  updateThemeIcon();
  // Actualizar selector de temas activo
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.classList.contains('theme-'+theme));
  });
}

function updateThemeIcon(){
  const isDark = document.body.classList.contains('dark');
  document.getElementById('theme-icon').innerHTML = isDark
    ? '<path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}

(function initTheme(){
  const saved = localStorage.getItem('bitacora_theme');
  if(saved === 'light'){
    document.body.classList.add('light');
  } else {
    document.body.classList.add('dark'); // default dark
  }
  updateThemeIcon();
  // Marcar el tema activo en el selector
  document.querySelectorAll('.theme-btn').forEach(btn => {
    const theme = btn.classList.contains('theme-dark') ? 'dark' : 'light';
    btn.classList.toggle('active', document.body.classList.contains(theme));
  });
})();

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB.state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `bitacora_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Copia de seguridad exportada');
}
function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('⚠️ El archivo no es un JSON válido'); evt.target.value=''; return; }
    const blank = DB.blank();
    const validKeys = Object.keys(blank);
    const ok = validKeys.some(k=>Array.isArray(parsed[k]));
    if(!ok){ toast('⚠️ El archivo no parece una copia de Bitácora'); evt.target.value=''; return; }
    openModal(`
      <div class="modal-header"><h2>Importar copia de seguridad</h2><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
      <div class="modal-body">
        <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px">¿Cómo quieres importar estos datos? Esta acción puede sobrescribir información existente.</p>
        <div style="display:flex; flex-direction:column; gap:8px">
          <button class="btn" onclick="doImport(${JSON.stringify(JSON.stringify(parsed))}, 'merge')">Combinar con mis datos actuales</button>
          <button class="btn btn-danger" onclick="doImport(${JSON.stringify(JSON.stringify(parsed))}, 'replace')">Reemplazar todos mis datos</button>
        </div>
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
    evt.target.value='';
  };
  reader.readAsText(file);
}
function doImport(jsonStr, mode){
  const parsed = JSON.parse(jsonStr);
  const blank = DB.blank();
  if(mode==='replace'){
    Object.keys(blank).forEach(k=>{ DB.state[k] = Array.isArray(parsed[k]) ? parsed[k] : []; });
  } else {
    Object.keys(blank).forEach(k=>{
      if(Array.isArray(parsed[k])){
        const existingIds = new Set(DB.state[k].map(x=>x.id));
        parsed[k].forEach(item=>{ if(!existingIds.has(item.id)) DB.state[k].push(item); });
      }
    });
  }
  DB.save();
  closeModal();
  render();
  toast('Importación completada');
}

  if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
    e.preventDefault(); openSearch();
  }
});
