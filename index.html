<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bitácora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.dark {
            background: #0a0a0f;
            color: #e2e8f0;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }

        /* Modo ordenador (ancho fijo) */
        #app.mode-desktop {
            max-width: 820px;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            background: #f5f5f7;
        }
        body.dark #app.mode-desktop {
            border-left-color: #2a2a3a;
            border-right-color: #2a2a3a;
            background: #0a0a0f;
        }

        /* Modo iOS (móvil) */
        #app.mode-mobile {
            max-width: 480px;
        }

        /* ===== HEADER ===== */
        #header {
            padding: 20px 24px 12px 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            transition: border-color 0.25s ease;
        }
        body.dark #header {
            border-bottom-color: #2a2a3a;
        }

        #header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        #header-sub {
            font-size: 12px;
            font-weight: 500;
            color: #8e8e93;
            margin-top: 2px;
        }
        body.dark #header-sub {
            color: #6b7280;
        }

        #header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ===== BOTONES ===== */
        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #1c1c1e;
            color: #fff;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .btn:active {
            transform: scale(0.96);
        }
        body.dark .btn {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #e2e8f0;
            color: #1c1c1e;
        }
        body.dark .btn-outline {
            border-color: #3a3a5c;
            color: #e2e8f0;
        }
        body.dark .btn-outline:hover {
            background: #1a1a2e;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 11px;
            border-radius: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            color: #8e8e93;
            transition: color 0.15s ease;
        }
        .btn-icon:hover {
            color: #1c1c1e;
        }
        body.dark .btn-icon {
            color: #6b7280;
        }
        body.dark .btn-icon:hover {
            color: #e2e8f0;
        }

        /* ===== NAV ===== */
        #nav {
            display: flex;
            flex-shrink: 0;
            padding: 8px 16px 12px 16px;
            gap: 4px;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #nav::-webkit-scrollbar {
            display: none;
        }
        body.dark #nav {
            border-bottom-color: #2a2a3a;
        }

        #nav button {
            flex-shrink: 0;
            background: none;
            border: none;
            padding: 6px 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #8e8e93;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s ease;
        }
        #nav button:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        #nav button.active {
            background: #1c1c1e;
            color: #fff;
        }
        body.dark #nav button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        body.dark #nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        /* ===== CONTENT ===== */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== CALENDARIO ===== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .calendar-header .month-label {
            font-size: 17px;
            font-weight: 700;
        }

        .calendar-nav-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 12px;
            color: #8e8e93;
            transition: color 0.15s ease;
        }
        .calendar-nav-btn:hover {
            color: #1c1c1e;
        }
        body.dark .calendar-nav-btn {
            color: #6b7280;
        }
        body.dark .calendar-nav-btn:hover {
            color: #e2e8f0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #8e8e93;
            padding: 6px 0 10px 0;
            letter-spacing: 0.5px;
        }
        body.dark .calendar-day-header {
            color: #6b7280;
        }

        .calendar-day {
            background: #fff;
            border-radius: 10px;
            padding: 6px 4px 8px 4px;
            min-height: 64px;
            text-align: center;
            position: relative;
            border: 1px solid transparent;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        body.dark .calendar-day {
            background: #14141f;
        }

        .calendar-day.empty {
            background: transparent;
            border-color: transparent;
        }
        body.dark .calendar-day.empty {
            background: transparent;
        }

        .calendar-day.today {
            border-color: #1c1c1e;
        }
        body.dark .calendar-day.today {
            border-color: #e2e8f0;
        }

        .calendar-day .day-number {
            font-size: 13px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .calendar-day .day-bars {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }

        .calendar-day .day-bar {
            width: 20px;
            height: 3px;
            border-radius: 4px;
            display: block;
        }

        /* ===== ENTRADAS (lista) ===== */
        .entries-section {
            margin-top: 20px;
        }

        .entries-section .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e8e93;
            margin-bottom: 10px;
        }
        body.dark .entries-section .section-title {
            color: #6b7280;
        }

        .entry-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        body.dark .entry-item {
            border-bottom-color: #2a2a3a;
        }
        .entry-item:last-child {
            border-bottom: none;
        }

        .entry-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .entry-info {
            flex: 1;
            min-width: 0;
        }

        .entry-info .entry-title {
            font-weight: 600;
            font-size: 14px;
        }

        .entry-info .entry-meta {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }
        body.dark .entry-info .entry-meta {
            color: #6b7280;
        }

        .entry-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .entry-actions .btn-icon {
            font-size: 14px;
            padding: 4px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #8e8e93;
        }
        body.dark .empty-state {
            color: #6b7280;
        }
        .empty-state .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state .empty-title {
            font-weight: 700;
            font-size: 16px;
            color: #1c1c1e;
        }
        body.dark .empty-state .empty-title {
            color: #e2e8f0;
        }
        .empty-state .empty-sub {
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-sheet {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            max-height: 90dvh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            transition: background 0.25s ease;
        }
        body.dark .modal-sheet {
            background: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8e8e93;
            padding: 0 4px;
        }
        body.dark .modal-close {
            color: #6b7280;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #8e8e93;
            display: block;
            margin-bottom: 4px;
        }
        body.dark .modal-label {
            color: #6b7280;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            background: #f8f8fa;
            color: #1c1c1e;
            outline: none;
            transition: border-color 0.15s ease;
            margin-bottom: 12px;
        }
        .modal-input:focus {
            border-color: #1c1c1e;
        }
        body.dark .modal-input {
            background: #252540;
            border-color: #3a3a5c;
            color: #e2e8f0;
        }
        body.dark .modal-input:focus {
            border-color: #e2e8f0;
        }
        body.dark .modal-input::placeholder {
            color: #6b7280;
        }

        .modal-row {
            display: flex;
            gap: 10px;
        }
        .modal-row>* {
            flex: 1;
        }

        .modal-color-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .modal-color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .modal-color-option:hover {
            transform: scale(1.05);
        }
        .modal-color-option.selected {
            border-color: #1c1c1e;
            transform: scale(1.1);
        }
        body.dark .modal-color-option.selected {
            border-color: #e2e8f0;
        }

        .btn-modal-primary {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #1c1c1e;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 4px;
        }
        .btn-modal-primary:hover {
            opacity: 0.85;
        }
        body.dark .btn-modal-primary {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        .btn-modal-danger {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #fee2e2;
            color: #dc2626;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 6px;
        }
        body.dark .btn-modal-danger {
            background: #450a0a;
            color: #fca5a5;
        }
        .btn-modal-danger:hover {
            opacity: 0.85;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            background: #1c1c1e;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        #toast.show {
            opacity: 1;
        }
        body.dark #toast {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        /* ===== FOOTER (botones inferiores) ===== */
        #footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            padding: 10px 20px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid #e2e8f0;
            background: #f5f5f7;
            transition: border-color 0.25s ease, background 0.25s ease;
        }
        body.dark #footer {
            border-top-color: #2a2a3a;
            background: #0a0a0f;
        }

        #app.mode-desktop #footer {
            background: #f5f5f7;
        }
        body.dark #app.mode-desktop #footer {
            background: #0a0a0f;
        }

        .footer-left,
        .footer-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-btn {
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #8e8e93;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }
        .footer-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.dark .footer-btn {
            color: #6b7280;
        }
        body.dark .footer-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .footer-btn.active {
            color: #1c1c1e;
            background: rgba(0, 0, 0, 0.05);
        }
        body.dark .footer-btn.active {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #header {
                padding: 16px 16px 10px 16px;
            }
            #header h1 {
                font-size: 18px;
            }
            #content {
                padding: 12px 14px;
            }
            .calendar-day {
                min-height: 50px;
                padding: 4px 2px 6px 2px;
            }
            .calendar-day .day-number {
                font-size: 11px;
            }
            .calendar-day .day-bar {
                width: 16px;
                height: 3px;
            }
            .entry-item {
                padding: 8px 0;
            }
            .entry-info .entry-title {
                font-size: 13px;
            }
            #footer {
                padding: 8px 14px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
            .footer-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .btn {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (min-width: 600px) {
            .calendar-day {
                min-height: 76px;
                padding: 8px 6px 10px 6px;
            }
            .calendar-day .day-number {
                font-size: 14px;
            }
            .calendar-day .day-bar {
                width: 24px;
                height: 4px;
            }
        }

        /* Scrollbar estilizado */
        #content::-webkit-scrollbar {
            width: 4px;
        }
        #content::-webkit-scrollbar-track {
            background: transparent;
        }
        #content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        body.dark #content::-webkit-scrollbar-thumb {
            background: #3a3a5c;
        }
    </style>
</head>
<body>

    <div id="app" class="mode-mobile">
        <!-- HEADER -->
        <div id="header">
            <div>
                <h1>Bitácora</h1>
                <div id="header-sub">0 entradas</div>
            </div>
            <div id="header-actions">
                <button class="btn" onclick="openNewEntry()">+ Nueva Entrada</button>
            </div>
        </div>

        <!-- NAV -->
        <div id="nav">
            <button class="active" onclick="switchView('calendar')">Calendario</button>
            <button onclick="switchView('entries')">Entradas</button>
            <button onclick="switchView('categories')">Categorías</button>
        </div>

        <!-- CONTENT -->
        <div id="content"></div>

        <!-- FOOTER -->
        <div id="footer">
            <div class="footer-left">
                <button class="footer-btn" onclick="toggleMode()" id="mode-btn">📱 Móvil</button>
                <button class="footer-btn" onclick="toggleTheme()" id="theme-btn">🌙 Oscuro</button>
            </div>
            <div class="footer-right">
                <button class="footer-btn" onclick="exportData()">📤 Exportar</button>
                <button class="footer-btn" onclick="document.getElementById('import-input').click()">📥 Importar</button>
                <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-container"></div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        let entries = [];
        let categories = [];

        // Colores predefinidos (tonos suaves)
        const DEFAULT_COLORS = [
            '#e74c3c', // rojo
            '#3498db', // azul
            '#2ecc71', // verde
            '#f39c12', // naranja
            '#9b59b6', // morado
            '#1abc9c', // turquesa
            '#e67e22', // naranja oscuro
            '#e84393', // rosa
            '#00b894', // menta
            '#6c5ce7', // índigo
            '#fd79a8', // rosa claro
            '#0984e3', // azul marino
        ];

        let colorIndex = 0;

        // ============================================================
        //  CATEGORÍAS POR DEFECTO
        // ============================================================
        function getDefaultCategories() {
            return [
                { id: 'cat_videojuego', name: 'Videojuego', color: '#e74c3c' },
                { id: 'cat_libro', name: 'Libro', color: '#3498db' },
                { id: 'cat_serie', name: 'Serie', color: '#9b59b6' },
                { id: 'cat_pelicula', name: 'Película', color: '#f39c12' },
                { id: 'cat_musica', name: 'Música', color: '#1abc9c' },
                { id: 'cat_trabajo', name: 'Trabajo', color: '#e67e22' },
                { id: 'cat_proyecto', name: 'Proyecto', color: '#00b894' },
                { id: 'cat_objetivo', name: 'Objetivo', color: '#6c5ce7' },
                { id: 'cat_viaje', name: 'Viaje', color: '#e84393' },
                { id: 'cat_finanzas', name: 'Finanzas', color: '#2ecc71' },
            ];
        }

        // ============================================================
        //  LOAD / SAVE
        // ============================================================
        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('bitacora_data') || '{}');
                entries = saved.entries || [];
                categories = saved.categories || getDefaultCategories();
            } catch (e) {
                entries = [];
                categories = getDefaultCategories();
            }

            // Si no hay categorías, poner las predeterminadas
            if (!categories || categories.length === 0) {
                categories = getDefaultCategories();
            }

            // Asegurar que todas las categorías tengan ID
            categories.forEach(c => {
                if (!c.id) c.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            });

            updateHeader();
        }

        function saveData() {
            localStorage.setItem('bitacora_data', JSON.stringify({ entries, categories }));
            updateHeader();
        }

        // ============================================================
        //  THEME / MODE
        // ============================================================
        function loadTheme() {
            const theme = localStorage.getItem('bitacora_theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('theme-btn').textContent = '☀️ Claro';
            } else {
                document.body.classList.remove('dark');
                document.getElementById('theme-btn').textContent = '🌙 Oscuro';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            document.body.classList.toggle('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('bitacora_theme', newTheme);
            document.getElementById('theme-btn').textContent = newTheme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
        }

        function loadMode() {
            const mode = localStorage.getItem('bitacora_mode') || 'mobile';
            const app = document.getElementById('app');
            if (mode === 'desktop') {
                app.classList.remove('mode-mobile');
                app.classList.add('mode-desktop');
                document.getElementById('mode-btn').textContent = '💻 Ordenador';
            } else {
                app.classList.remove('mode-desktop');
                app.classList.add('mode-mobile');
                document.getElementById('mode-btn').textContent = '📱 Móvil';
            }
        }

        function toggleMode() {
            const app = document.getElementById('app');
            const isDesktop = app.classList.contains('mode-desktop');
            if (isDesktop) {
                app.classList.remove('mode-desktop');
                app.classList.add('mode-mobile');
                localStorage.setItem('bitacora_mode', 'mobile');
                document.getElementById('mode-btn').textContent = '📱 Móvil';
            } else {
                app.classList.remove('mode-mobile');
                app.classList.add('mode-desktop');
                localStorage.setItem('bitacora_mode', 'desktop');
                document.getElementById('mode-btn').textContent = '💻 Ordenador';
            }
            // Re-render para ajustar tamaños
            render();
        }

        // ============================================================
        //  HEADER
        // ============================================================
        function updateHeader() {
            document.getElementById('header-sub').textContent = entries.length + ' entradas';
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? '#dc2626' : '#1c1c1e';
            t.style.color = 'white';
            if (document.body.classList.contains('dark') && !isError) {
                t.style.background = '#e2e8f0';
                t.style.color = '#1c1c1e';
            }
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
            document.querySelector(`#nav button[onclick*="'${view}'"]`).classList.add('active');
            render();
        }

        // ============================================================
        //  MODAL
        // ============================================================
        let editingEntryId = null;

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editingEntryId = null;
        }

        function openNewEntry() {
            editingEntryId = null;
            document.getElementById('modal-container').innerHTML = renderEntryModal(null);
        }

        function openEditEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editingEntryId = id;
            document.getElementById('modal-container').innerHTML = renderEntryModal(entry);
        }

        function renderEntryModal(entry) {
            const isEdit = !!entry;
            const title = isEdit ? '✏️ Editar entrada' : '📝 Nueva entrada';
            const today = new Date().toISOString().slice(0, 10);

            // Opciones de categoría
            const catOptions = categories.map(c =>
                `<option value="${c.id}" ${isEdit && entry.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            // Selector de colores (para la categoría nueva o existente)
            const colorOptions = DEFAULT_COLORS.map(c =>
                `<div class="modal-color-option" style="background:${c}" data-color="${c}" onclick="selectColor(this, '${c}')"></div>`
            ).join('');

            const currentColor = isEdit ?
                (categories.find(c => c.id === entry.categoryId)?.color || '#e74c3c') :
                '#e74c3c';

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">
                        ${title}
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>

                    <div class="modal-label">Fecha</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit ? entry.date : today}">

                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" placeholder="Ej: Empecé The Witcher 3" value="${isEdit ? entry.title : ''}">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input" onchange="onCategoryChange(this.value)">
                        ${catOptions}
                        <option value="__new">+ Crear nueva categoría</option>
                    </select>

                    <div id="new-category-fields" style="display:none">
                        <div class="modal-label">Nombre de la nueva categoría</div>
                        <input id="modal-new-cat-name" class="modal-input" placeholder="Ej: Podcast">

                        <div class="modal-label">Color</div>
                        <div class="modal-color-grid" id="color-picker">
                            ${colorOptions}
                        </div>
                        <input type="hidden" id="modal-new-cat-color" value="${currentColor}">
                    </div>

                    <div class="modal-label">Notas (opcional)</div>
                    <textarea id="modal-notes" class="modal-input" rows="2" placeholder="Detalles adicionales...">${isEdit ? (entry.notes || '') : ''}</textarea>

                    <button class="btn-modal-primary" onclick="saveEntry()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteEntry(${entry.id})">🗑 Eliminar entrada</button>` : ''}
                </div>
            </div>`;
        }

        // ============================================================
        //  CATEGORY COLOR PICKER
        // ============================================================
        let selectedColor = '#e74c3c';

        function selectColor(el, color) {
            selectedColor = color;
            document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('modal-new-cat-color').value = color;
        }

        function onCategoryChange(value) {
            const fields = document.getElementById('new-category-fields');
            if (value === '__new') {
                fields.style.display = 'block';
                // Seleccionar el primer color por defecto
                const firstColor = document.querySelector('.modal-color-option');
                if (firstColor) {
                    document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
                    firstColor.classList.add('selected');
                    document.getElementById('modal-new-cat-color').value = firstColor.dataset.color;
                }
            } else {
                fields.style.display = 'none';
            }
        }

        // ============================================================
        //  SAVE ENTRY
        // ============================================================
        function saveEntry() {
            const date = document.getElementById('modal-date').value;
            if (!date) { showToast('Selecciona una fecha', true); return; }

            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            let categoryId = document.getElementById('modal-category').value;
            const notes = document.getElementById('modal-notes').value.trim();

            // Si es nueva categoría
            if (categoryId === '__new') {
                const newCatName = document.getElementById('modal-new-cat-name').value.trim();
                if (!newCatName) { showToast('Escribe un nombre para la categoría', true); return; }

                const color = document.getElementById('modal-new-cat-color').value || '#e74c3c';
                const newCat = {
                    id: 'cat_' + Date.now(),
                    name: newCatName,
                    color: color
                };
                categories.push(newCat);
                categoryId = newCat.id;
                saveData();
            }

            const entry = {
                id: editingEntryId || Date.now(),
                date: date,
                title: title,
                categoryId: categoryId,
                notes: notes
            };

            if (editingEntryId) {
                const idx = entries.findIndex(e => e.id === editingEntryId);
                if (idx >= 0) entries[idx] = entry;
            } else {
                entries.push(entry);
            }

            // Ordenar por fecha descendente
            entries.sort((a, b) => b.date.localeCompare(a.date));

            saveData();
            closeModal();
            render();
            showToast('✅ Entrada guardada');
        }

        // ============================================================
        //  DELETE ENTRY
        // ============================================================
        function deleteEntry(id) {
            if (!confirm('¿Eliminar esta entrada?')) return;
            entries = entries.filter(e => e.id !== id);
            saveData();
            closeModal();
            render();
            showToast('🗑 Eliminada');
        }

        // ============================================================
        //  DELETE CATEGORY
        // ============================================================
        function deleteCategory(id) {
            // Verificar si hay entradas con esta categoría
            const hasEntries = entries.some(e => e.categoryId === id);
            if (hasEntries) {
                if (!confirm('Esta categoría tiene entradas. ¿Eliminar la categoría y todas sus entradas?')) return;
                entries = entries.filter(e => e.categoryId !== id);
            } else {
                if (!confirm('¿Eliminar esta categoría?')) return;
            }
            categories = categories.filter(c => c.id !== id);
            saveData();
            render();
            showToast('🗑 Categoría eliminada');
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const data = { entries, categories };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bitacora_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Exportado');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entries) entries = data.entries;
                    if (data.categories) categories = data.categories;
                    saveData();
                    render();
                    showToast('📥 Importado correctamente');
                } catch (err) {
                    showToast('Error al importar', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function render() {
            const content = document.getElementById('content');

            if (currentView === 'calendar') {
                content.innerHTML = renderCalendar();
            } else if (currentView === 'entries') {
                content.innerHTML = renderEntries();
            } else if (currentView === 'categories') {
                content.innerHTML = renderCategories();
            }
        }

        // ============================================================
        //  RENDER: CALENDAR
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function renderCalendar() {
            // Agrupar entradas por fecha
            const entriesByDate = {};
            entries.forEach(e => {
                if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
                entriesByDate[e.date].push(e);
            });

            const today = new Date().toISOString().slice(0, 10);
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const offset = (firstDay + 6) % 7; // Lunes como primer día

            // Días del mes anterior
            const prevMonth = new Date(calYear, calMonth, 0);
            const daysInPrevMonth = prevMonth.getDate();

            let html = `
            <div class="calendar-header">
                <button class="calendar-nav-btn" onclick="changeMonth(-1)">‹</button>
                <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
                <button class="calendar-nav-btn" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid">`;

            // Cabeceras
            dayNames.forEach(d => {
                html += `<div class="calendar-day-header">${d}</div>`;
            });

            // Días vacíos del mes anterior
            for (let i = 0; i < offset; i++) {
                const day = daysInPrevMonth - offset + i + 1;
                html += `<div class="calendar-day empty"><span class="day-number" style="opacity:0.3">${day}</span></div>`;
            }

            // Días del mes actual
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayEntries = entriesByDate[dateStr] || [];

                // Colores únicos para este día
                const colors = [];
                const seen = new Set();
                dayEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    if (cat && !seen.has(cat.color)) {
                        seen.add(cat.color);
                        colors.push(cat.color);
                    }
                });

                const barsHtml = colors.slice(0, 4).map(color =>
                    `<span class="day-bar" style="background:${color}"></span>`
                ).join('');

                const extra = colors.length > 4 ? `<span class="day-bar" style="background:#8e8e93;width:12px;height:3px;border-radius:4px;display:block;font-size:7px;text-align:center">+${colors.length - 4}</span>` :
                    '';

                html += `
                <div class="calendar-day ${isToday ? 'today' : ''}" onclick="showDayEntries('${dateStr}')">
                    <span class="day-number">${d}</span>
                    <div class="day-bars">
                        ${barsHtml}
                        ${extra}
                    </div>
                </div>`;
            }

            // Días del mes siguiente para completar
            const totalDays = offset + daysInMonth;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="calendar-day empty"><span class="day-number" style="opacity:0.3">${d}</span></div>`;
            }

            html += `</div>`;

            // Mostrar entradas del día seleccionado (si hay)
            if (window._selectedDate) {
                html += renderDayEntries(window._selectedDate);
            }

            return html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11;
                calYear--; }
            if (calMonth > 11) { calMonth = 0;
                calYear++; }
            render();
        }

        function showDayEntries(date) {
            window._selectedDate = date;
            render();
        }

        function renderDayEntries(date) {
            const dayEntries = entries.filter(e => e.date === date);
            if (!dayEntries.length) return '';

            const dateObj = new Date(date + 'T12:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateLabel = dateObj.toLocaleDateString('es-ES', options);

            let html = `
            <div class="entries-section">
                <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
                    <span>📅 ${dateLabel}</span>
                    <button class="btn btn-sm btn-outline" onclick="window._selectedDate=null;render()">✕ Cerrar</button>
                </div>`;

            dayEntries.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#8e8e93';
                const catName = cat?.name || 'Sin categoría';

                html += `
                <div class="entry-item" onclick="openEditEntry(${e.id})" style="cursor:pointer">
                    <div class="entry-color-dot" style="background:${color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${e.title}</div>
                        <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                    </div>
                    <div class="entry-actions">
                        <button class="btn-icon" onclick="event.stopPropagation();openEditEntry(${e.id})">✏️</button>
                        <button class="btn-icon" onclick="event.stopPropagation();deleteEntry(${e.id})" style="color:#dc2626">🗑</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: ENTRIES (lista completa)
        // ============================================================
        function renderEntries() {
            if (!entries.length) {
                return `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">No hay entradas</div>
                    <div class="empty-sub">Pulsa "+ Nueva Entrada" para empezar</div>
                </div>`;
            }

            // Agrupar por fecha
            const grouped = {};
            entries.forEach(e => {
                if (!grouped[e.date]) grouped[e.date] = [];
                grouped[e.date].push(e);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            let html = `<div class="entries-section">`;

            sortedDates.forEach(date => {
                const dateObj = new Date(date + 'T12:00:00');
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                const dateLabel = dateObj.toLocaleDateString('es-ES', options);

                html += `
                <div style="margin-bottom:4px;font-weight:700;font-size:13px;color:#8e8e93;padding:8px 0 4px 0;border-bottom:1px solid #e2e8f0">
                    ${dateLabel}
                </div>`;

                grouped[date].forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#8e8e93';
                    const catName = cat?.name || 'Sin categoría';

                    html += `
                    <div class="entry-item" onclick="openEditEntry(${e.id})" style="cursor:pointer">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                        </div>
                        <div class="entry-actions">
                            <button class="btn-icon" onclick="event.stopPropagation();openEditEntry(${e.id})">✏️</button>
                            <button class="btn-icon" onclick="event.stopPropagation();deleteEntry(${e.id})" style="color:#dc2626">🗑</button>
                        </div>
                    </div>`;
                });
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: CATEGORIES
        // ============================================================
        function renderCategories() {
            if (!categories.length) {
                return `
                <div class="empty-state">
                    <div class="empty-icon">🏷️</div>
                    <div class="empty-title">Sin categorías</div>
                    <div class="empty-sub">Crea una categoría al añadir una entrada</div>
                </div>`;
            }

            let html = `
            <div class="entries-section">
                <div class="section-title">Gestionar categorías</div>
                <div style="margin-bottom:12px;font-size:12px;color:#8e8e93">Las categorías con entradas no se pueden eliminar sin antes eliminar las entradas asociadas.</div>`;

            categories.forEach(c => {
                const count = entries.filter(e => e.categoryId === c.id).length;
                const hasEntries = count > 0;

                html += `
                <div class="entry-item">
                    <div class="entry-color-dot" style="background:${c.color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${c.name}</div>
                        <div class="entry-meta">${count} entrada${count !== 1 ? 's' : ''}</div>
                    </div>
                    <div class="entry-actions">
                        ${hasEntries ? `<span style="font-size:10px;color:#8e8e93;font-weight:600">En uso</span>` : ''}
                        <button class="btn-icon" onclick="deleteCategory('${c.id}')" style="color:#dc2626">🗑</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadTheme();
            loadMode();
            loadData();
            render();
        }

        // Mostrar entradas del día al hacer clic en el calendario desde el modal
        // La función showDayEntries ya está definida arriba

        init();
    </script>
</body>
</html>
