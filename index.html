<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Trackify 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: #f0f2f7;
            color: #0f172a;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        body.dark {
            background: #0a0a0f;
            color: #e2e8f0;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
        }

        /* HEADER */
        #header {
            background: #0f172a;
            color: #fff;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        body.dark #header {
            background: #1a1a2e;
        }

        #header h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        #header p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
        }

        #btn-add {
            background: #fff;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }
        body.dark #btn-add {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* CONTENT */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* NAV */
        #nav {
            display: flex;
            flex-shrink: 0;
            background: #fff;
            border-top: 1.5px solid #e2e8f0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        body.dark #nav {
            background: #1a1a2e;
            border-top-color: #2e2e4a;
        }

        #nav button {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 0 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            color: #94a3b8;
            transition: all 0.2s;
            font-size: 10px;
        }

        #nav button .nav-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        #nav button.active {
            color: #0f172a;
            border-radius: 12px 12px 0 0;
        }
        body.dark #nav button.active {
            color: #e2e8f0;
        }

        /* CARDS */
        .card {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        body.dark .card {
            background: #1a1a2e;
            border-color: #2e2e4a;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f022;
        }
        .item-row:last-child {
            border-bottom: none;
        }

        .item-title {
            font-weight: 700;
            font-size: 14px;
        }
        .item-sub {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }
        body.dark .item-sub {
            color: #8b9ab5;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .btn-icon.delete {
            color: #dc2626;
        }
        .btn-icon.edit {
            color: #2563eb;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .status-completed {
            background: #dcfce7;
            color: #15803d;
        }
        .status-inprogress {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-abandoned {
            background: #fee2e2;
            color: #dc2626;
        }
        body.dark .status-pending {
            background: #422f00;
            color: #fcd34d;
        }
        body.dark .status-completed {
            background: #14532d;
            color: #86efac;
        }
        body.dark .status-inprogress {
            background: #1e3a5f;
            color: #93c5fd;
        }
        body.dark .status-abandoned {
            background: #450a0a;
            color: #fca5a5;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state b {
            color: #0f172a;
        }
        body.dark .empty-state b {
            color: #e2e8f0;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-sheet {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 88dvh;
            overflow-y: auto;
        }
        body.dark .modal-sheet {
            background: #1a1a2e;
            color: #e2e8f0;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 16px;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            color: #64748b;
        }
        body.dark .modal-close {
            color: #8b9ab5;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        body.dark .modal-label {
            color: #8b9ab5;
        }

        .modal-input {
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            margin-bottom: 12px;
            background: #f8fafc;
            color: #0f172a;
        }
        body.dark .modal-input {
            background: #252540;
            border-color: #3a3a5c;
            color: #e2e8f0;
        }
        body.dark .modal-input::placeholder {
            color: #7a8099;
        }

        .modal-2col {
            display: flex;
            gap: 10px;
        }
        .modal-2col>* {
            flex: 1;
        }

        select.modal-input {
            appearance: auto;
        }

        .btn-modal-primary {
            width: 100%;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            margin-top: 8px;
        }
        body.dark .btn-modal-primary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-modal-secondary {
            width: 100%;
            background: #f1f5f9;
            color: #0f172a;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            margin-top: 8px;
        }
        body.dark .btn-modal-secondary {
            background: #252540;
            color: #e2e8f0;
        }

        .btn-modal-danger {
            width: 100%;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            margin-top: 8px;
        }
        body.dark .btn-modal-danger {
            background: #450a0a;
            color: #fca5a5;
        }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            background: #0f172a;
            color: #fff;
        }
        #toast.show {
            opacity: 1;
        }

        /* THEME TOGGLE */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        body.dark .theme-toggle {
            color: #e2e8f0;
        }

        /* FILTROS */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #e2e8f0;
            background: transparent;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            color: #64748b;
            transition: all 0.15s;
        }
        .filter-btn.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }
        body.dark .filter-btn {
            border-color: #3a3a5c;
            color: #8b9ab5;
        }
        body.dark .filter-btn.active {
            background: #e2e8f0;
            color: #0f172a;
            border-color: #e2e8f0;
        }

        /* PROGRESS BAR FOR GOALS */
        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 6px;
        }
        body.dark .progress-bar-bg {
            background: #2e2e4a;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="header">
            <div>
                <h1>🎯 Trackify</h1>
                <p id="header-sub">0 items</p>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <button id="btn-add" onclick="openAddModal()">+ Nuevo</button>
            </div>
        </div>

        <div id="content"></div>

        <nav id="nav">
            <button class="active" onclick="switchView('games')" id="nav-games"><span class="nav-icon">🎮</span><span class="nav-label">Videojuegos</span></button>
            <button onclick="switchView('books')" id="nav-books"><span class="nav-icon">📚</span><span class="nav-label">Libros</span></button>
            <button onclick="switchView('series')" id="nav-series"><span class="nav-icon">📺</span><span class="nav-label">Series</span></button>
            <button onclick="switchView('movies')" id="nav-movies"><span class="nav-icon">🎬</span><span class="nav-label">Películas</span></button>
            <button onclick="switchView('goals')" id="nav-goals"><span class="nav-icon">🎯</span><span class="nav-label">Objetivos</span></button>
        </nav>
    </div>

    <div id="modal-container"></div>
    <div id="toast"></div>

    <script>
        // ==================== CONFIG ====================
        let currentView = 'games';
        let editingItem = null;

        // Data stores
        let games = [];
        let books = [];
        let series = [];
        let movies = [];
        let goals = [];

        // ==================== LOAD / SAVE ====================
        function loadData() {
            try {
                games = JSON.parse(localStorage.getItem('trackify_games')) || [];
                books = JSON.parse(localStorage.getItem('trackify_books')) || [];
                series = JSON.parse(localStorage.getItem('trackify_series')) || [];
                movies = JSON.parse(localStorage.getItem('trackify_movies')) || [];
                goals = JSON.parse(localStorage.getItem('trackify_goals')) || [];
            } catch (e) {
                games = [];
                books = [];
                series = [];
                movies = [];
                goals = [];
            }
        }

        function saveData() {
            localStorage.setItem('trackify_games', JSON.stringify(games));
            localStorage.setItem('trackify_books', JSON.stringify(books));
            localStorage.setItem('trackify_series', JSON.stringify(series));
            localStorage.setItem('trackify_movies', JSON.stringify(movies));
            localStorage.setItem('trackify_goals', JSON.stringify(goals));
            updateHeader();
        }

        // ==================== THEME ====================
        function loadTheme() {
            const theme = localStorage.getItem('trackify_theme') || 'light';
            document.body.className = theme === 'dark' ? 'dark' : '';
            document.getElementById('theme-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            document.body.classList.toggle('dark');
            localStorage.setItem('trackify_theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
        }

        // ==================== TOAST ====================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? '#dc2626' : '#0f172a';
            t.style.color = 'white';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ==================== HEADER ====================
        function updateHeader() {
            const total = games.length + books.length + series.length + movies.length + goals.length;
            document.getElementById('header-sub').textContent = total + ' items registrados';
        }

        // ==================== NAVIGATION ====================
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + view).classList.add('active');
            render();
        }

        // ==================== MODAL ====================
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editingItem = null;
        }

        function openAddModal() {
            editingItem = null;
            const view = currentView;
            let html = '';

            if (view === 'games') {
                html = renderGameModal(null);
            } else if (view === 'books') {
                html = renderBookModal(null);
            } else if (view === 'series') {
                html = renderSeriesModal(null);
            } else if (view === 'movies') {
                html = renderMovieModal(null);
            } else if (view === 'goals') {
                html = renderGoalModal(null);
            }

            document.getElementById('modal-container').innerHTML = html;
        }

        function openEditModal(id) {
            const view = currentView;
            let item = null;
            let html = '';

            if (view === 'games') {
                item = games.find(g => g.id === id);
                html = renderGameModal(item);
            } else if (view === 'books') {
                item = books.find(b => b.id === id);
                html = renderBookModal(item);
            } else if (view === 'series') {
                item = series.find(s => s.id === id);
                html = renderSeriesModal(item);
            } else if (view === 'movies') {
                item = movies.find(m => m.id === id);
                html = renderMovieModal(item);
            } else if (view === 'goals') {
                item = goals.find(g => g.id === id);
                html = renderGoalModal(item);
            }

            if (item) editingItem = item;
            document.getElementById('modal-container').innerHTML = html;
        }

        // ==================== MODAL RENDERS ====================
        function renderGameModal(item) {
            const isEdit = !!item;
            const title = isEdit ? '✏️ Editar videojuego' : '🎮 Nuevo videojuego';
            const statuses = ['Pendiente', 'Jugando', 'Completado', 'Abandonado'];

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">×</button></div>
                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? item.title : ''}" placeholder="Ej: The Witcher 3">

                    <div class="modal-label">Estado</div>
                    <select id="modal-status" class="modal-input">
                        ${statuses.map(s => `<option value="${s}" ${isEdit && item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>

                    <div class="modal-2col">
                        <div>
                            <div class="modal-label">Fecha inicio</div>
                            <input type="date" id="modal-start" class="modal-input" value="${isEdit && item.startDate ? item.startDate : ''}">
                        </div>
                        <div>
                            <div class="modal-label">Fecha fin</div>
                            <input type="date" id="modal-end" class="modal-input" value="${isEdit && item.endDate ? item.endDate : ''}">
                        </div>
                    </div>

                    <button class="btn-modal-primary" onclick="saveGame()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteItem('games', ${item.id})">🗑 Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        function renderBookModal(item) {
            const isEdit = !!item;
            const title = isEdit ? '✏️ Editar libro' : '📚 Nuevo libro';
            const statuses = ['Pendiente', 'Leyendo', 'Leído', 'Abandonado'];

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">×</button></div>
                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? item.title : ''}" placeholder="Ej: Cien años de soledad">

                    <div class="modal-label">Autor</div>
                    <input id="modal-author" class="modal-input" value="${isEdit ? item.author : ''}" placeholder="Ej: Gabriel García Márquez">

                    <div class="modal-label">Estado</div>
                    <select id="modal-status" class="modal-input">
                        ${statuses.map(s => `<option value="${s}" ${isEdit && item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>

                    <div class="modal-2col">
                        <div>
                            <div class="modal-label">Fecha inicio</div>
                            <input type="date" id="modal-start" class="modal-input" value="${isEdit && item.startDate ? item.startDate : ''}">
                        </div>
                        <div>
                            <div class="modal-label">Fecha fin</div>
                            <input type="date" id="modal-end" class="modal-input" value="${isEdit && item.endDate ? item.endDate : ''}">
                        </div>
                    </div>

                    <button class="btn-modal-primary" onclick="saveBook()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteItem('books', ${item.id})">🗑 Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        function renderSeriesModal(item) {
            const isEdit = !!item;
            const title = isEdit ? '✏️ Editar serie' : '📺 Nueva serie';
            const statuses = ['Pendiente', 'Viendo', 'Vista', 'Abandonada'];

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">×</button></div>
                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? item.title : ''}" placeholder="Ej: Breaking Bad">

                    <div class="modal-label">Plataforma</div>
                    <input id="modal-platform" class="modal-input" value="${isEdit ? item.platform : ''}" placeholder="Ej: Netflix, HBO, etc.">

                    <div class="modal-label">Estado</div>
                    <select id="modal-status" class="modal-input">
                        ${statuses.map(s => `<option value="${s}" ${isEdit && item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>

                    <div class="modal-2col">
                        <div>
                            <div class="modal-label">Fecha inicio</div>
                            <input type="date" id="modal-start" class="modal-input" value="${isEdit && item.startDate ? item.startDate : ''}">
                        </div>
                        <div>
                            <div class="modal-label">Fecha fin</div>
                            <input type="date" id="modal-end" class="modal-input" value="${isEdit && item.endDate ? item.endDate : ''}">
                        </div>
                    </div>

                    <button class="btn-modal-primary" onclick="saveSeries()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteItem('series', ${item.id})">🗑 Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        function renderMovieModal(item) {
            const isEdit = !!item;
            const title = isEdit ? '✏️ Editar película' : '🎬 Nueva película';

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">×</button></div>
                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? item.title : ''}" placeholder="Ej: Inception">

                    <div class="modal-label">Año</div>
                    <input id="modal-year" type="number" class="modal-input" value="${isEdit ? item.year : ''}" placeholder="Ej: 2010">

                    <div class="modal-label">Fecha visionado</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit && item.watchDate ? item.watchDate : ''}">

                    <div class="modal-label">Puntuación (1-5)</div>
                    <select id="modal-rating" class="modal-input">
                        ${[1,2,3,4,5].map(r => `<option value="${r}" ${isEdit && item.rating === r ? 'selected' : ''}>${'⭐'.repeat(r)}</option>`).join('')}
                        <option value="0" ${isEdit && !item.rating ? 'selected' : ''}>Sin puntuar</option>
                    </select>

                    <button class="btn-modal-primary" onclick="saveMovie()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteItem('movies', ${item.id})">🗑 Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        function renderGoalModal(item) {
            const isEdit = !!item;
            const title = isEdit ? '✏️ Editar objetivo' : '🎯 Nuevo objetivo';
            const categories = ['Corto plazo', 'Medio plazo', 'Largo plazo'];

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">${title}<button class="modal-close" onclick="closeModal()">×</button></div>
                    <div class="modal-label">Nombre</div>
                    <input id="modal-title" class="modal-input" value="${isEdit ? item.title : ''}" placeholder="Ej: Aprender React">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input">
                        ${categories.map(c => `<option value="${c}" ${isEdit && item.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>

                    <div class="modal-2col">
                        <div>
                            <div class="modal-label">Progreso actual</div>
                            <input type="number" id="modal-current" class="modal-input" value="${isEdit ? item.current : 0}" placeholder="0">
                        </div>
                        <div>
                            <div class="modal-label">Objetivo total</div>
                            <input type="number" id="modal-total" class="modal-input" value="${isEdit ? item.total : 100}" placeholder="100">
                        </div>
                    </div>

                    <div class="modal-label">Fecha límite</div>
                    <input type="date" id="modal-deadline" class="modal-input" value="${isEdit && item.deadline ? item.deadline : ''}">

                    <button class="btn-modal-primary" onclick="saveGoal()">💾 Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteItem('goals', ${item.id})">🗑 Eliminar</button>` : ''}
                </div>
            </div>`;
        }

        // ==================== SAVE FUNCTIONS ====================
        function saveGame() {
            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            const item = {
                id: editingItem ? editingItem.id : Date.now(),
                title,
                status: document.getElementById('modal-status').value,
                startDate: document.getElementById('modal-start').value || '',
                endDate: document.getElementById('modal-end').value || ''
            };

            if (editingItem) {
                const idx = games.findIndex(g => g.id === editingItem.id);
                if (idx >= 0) games[idx] = item;
            } else {
                games.unshift(item);
            }

            saveData();
            closeModal();
            render();
            showToast('✅ Guardado');
        }

        function saveBook() {
            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            const item = {
                id: editingItem ? editingItem.id : Date.now(),
                title,
                author: document.getElementById('modal-author').value.trim(),
                status: document.getElementById('modal-status').value,
                startDate: document.getElementById('modal-start').value || '',
                endDate: document.getElementById('modal-end').value || ''
            };

            if (editingItem) {
                const idx = books.findIndex(b => b.id === editingItem.id);
                if (idx >= 0) books[idx] = item;
            } else {
                books.unshift(item);
            }

            saveData();
            closeModal();
            render();
            showToast('✅ Guardado');
        }

        function saveSeries() {
            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            const item = {
                id: editingItem ? editingItem.id : Date.now(),
                title,
                platform: document.getElementById('modal-platform').value.trim(),
                status: document.getElementById('modal-status').value,
                startDate: document.getElementById('modal-start').value || '',
                endDate: document.getElementById('modal-end').value || ''
            };

            if (editingItem) {
                const idx = series.findIndex(s => s.id === editingItem.id);
                if (idx >= 0) series[idx] = item;
            } else {
                series.unshift(item);
            }

            saveData();
            closeModal();
            render();
            showToast('✅ Guardado');
        }

        function saveMovie() {
            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            const item = {
                id: editingItem ? editingItem.id : Date.now(),
                title,
                year: parseInt(document.getElementById('modal-year').value) || null,
                watchDate: document.getElementById('modal-date').value || '',
                rating: parseInt(document.getElementById('modal-rating').value) || 0
            };

            if (editingItem) {
                const idx = movies.findIndex(m => m.id === editingItem.id);
                if (idx >= 0) movies[idx] = item;
            } else {
                movies.unshift(item);
            }

            saveData();
            closeModal();
            render();
            showToast('✅ Guardado');
        }

        function saveGoal() {
            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un nombre', true); return; }

            const current = parseFloat(document.getElementById('modal-current').value) || 0;
            const total = parseFloat(document.getElementById('modal-total').value) || 100;

            const item = {
                id: editingItem ? editingItem.id : Date.now(),
                title,
                category: document.getElementById('modal-category').value,
                current,
                total,
                deadline: document.getElementById('modal-deadline').value || ''
            };

            if (editingItem) {
                const idx = goals.findIndex(g => g.id === editingItem.id);
                if (idx >= 0) goals[idx] = item;
            } else {
                goals.unshift(item);
            }

            saveData();
            closeModal();
            render();
            showToast('✅ Guardado');
        }

        // ==================== DELETE ====================
        function deleteItem(store, id) {
            if (!confirm('¿Eliminar este elemento?')) return;

            if (store === 'games') games = games.filter(g => g.id !== id);
            else if (store === 'books') books = books.filter(b => b.id !== id);
            else if (store === 'series') series = series.filter(s => s.id !== id);
            else if (store === 'movies') movies = movies.filter(m => m.id !== id);
            else if (store === 'goals') goals = goals.filter(g => g.id !== id);

            saveData();
            closeModal();
            render();
            showToast('🗑 Eliminado');
        }

        // ==================== STATUS BADGE ====================
        function getStatusClass(status) {
            const map = {
                'Pendiente': 'status-pending',
                'Jugando': 'status-inprogress',
                'Completado': 'status-completed',
                'Abandonado': 'status-abandoned',
                'Leyendo': 'status-inprogress',
                'Leído': 'status-completed',
                'Viendo': 'status-inprogress',
                'Vista': 'status-completed',
                'Abandonada': 'status-abandoned'
            };
            return map[status] || 'status-pending';
        }

        // ==================== RENDER ====================
        function render() {
            const content = document.getElementById('content');

            if (currentView === 'games') {
                content.innerHTML = renderGames();
            } else if (currentView === 'books') {
                content.innerHTML = renderBooks();
            } else if (currentView === 'series') {
                content.innerHTML = renderSeries();
            } else if (currentView === 'movies') {
                content.innerHTML = renderMovies();
            } else if (currentView === 'goals') {
                content.innerHTML = renderGoals();
            }
        }

        function renderGames() {
            if (!games.length) {
                return `<div class="empty-state"><div class="empty-icon">🎮</div><b>Sin videojuegos</b><br><span style="font-size:13px">Pulsa "+ Nuevo" para empezar</span></div>`;
            }

            let html = `<div class="filter-bar">
                <button class="filter-btn active" onclick="filterGames('all')">Todos</button>
                <button class="filter-btn" onclick="filterGames('Pendiente')">Pendientes</button>
                <button class="filter-btn" onclick="filterGames('Jugando')">Jugando</button>
                <button class="filter-btn" onclick="filterGames('Completado')">Completados</button>
            </div>`;

            const filtered = games.filter(g => {
                if (window._gameFilter && window._gameFilter !== 'all') {
                    return g.status === window._gameFilter;
                }
                return true;
            });

            filtered.forEach(g => {
                html += `
                <div class="card">
                    <div class="item-row">
                        <div>
                            <div class="item-title">${g.title}</div>
                            <div class="item-sub">${g.status} · ${g.startDate ? 'Inicio: ' + g.startDate : 'Sin iniciar'}${g.endDate ? ' · Fin: ' + g.endDate : ''}</div>
                            <span class="status-badge ${getStatusClass(g.status)}">${g.status}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon edit" onclick="openEditModal(${g.id})">✏️</button>
                            <button class="btn-icon delete" onclick="deleteItem('games', ${g.id})">🗑</button>
                        </div>
                    </div>
                </div>`;
            });

            return html;
        }

        function renderBooks() {
            if (!books.length) {
                return `<div class="empty-state"><div class="empty-icon">📚</div><b>Sin libros</b><br><span style="font-size:13px">Pulsa "+ Nuevo" para empezar</span></div>`;
            }

            let html = `<div class="filter-bar">
                <button class="filter-btn active" onclick="filterBooks('all')">Todos</button>
                <button class="filter-btn" onclick="filterBooks('Pendiente')">Pendientes</button>
                <button class="filter-btn" onclick="filterBooks('Leyendo')">Leyendo</button>
                <button class="filter-btn" onclick="filterBooks('Leído')">Leídos</button>
            </div>`;

            const filtered = books.filter(b => {
                if (window._bookFilter && window._bookFilter !== 'all') {
                    return b.status === window._bookFilter;
                }
                return true;
            });

            filtered.forEach(b => {
                html += `
                <div class="card">
                    <div class="item-row">
                        <div>
                            <div class="item-title">${b.title}</div>
                            <div class="item-sub">${b.author || 'Sin autor'} · ${b.status}${b.startDate ? ' · Inicio: ' + b.startDate : ''}${b.endDate ? ' · Fin: ' + b.endDate : ''}</div>
                            <span class="status-badge ${getStatusClass(b.status)}">${b.status}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon edit" onclick="openEditModal(${b.id})">✏️</button>
                            <button class="btn-icon delete" onclick="deleteItem('books', ${b.id})">🗑</button>
                        </div>
                    </div>
                </div>`;
            });

            return html;
        }

        function renderSeries() {
            if (!series.length) {
                return `<div class="empty-state"><div class="empty-icon">📺</div><b>Sin series</b><br><span style="font-size:13px">Pulsa "+ Nuevo" para empezar</span></div>`;
            }

            let html = `<div class="filter-bar">
                <button class="filter-btn active" onclick="filterSeries('all')">Todos</button>
                <button class="filter-btn" onclick="filterSeries('Pendiente')">Pendientes</button>
                <button class="filter-btn" onclick="filterSeries('Viendo')">Viendo</button>
                <button class="filter-btn" onclick="filterSeries('Vista')">Vistas</button>
            </div>`;

            const filtered = series.filter(s => {
                if (window._seriesFilter && window._seriesFilter !== 'all') {
                    return s.status === window._seriesFilter;
                }
                return true;
            });

            filtered.forEach(s => {
                html += `
                <div class="card">
                    <div class="item-row">
                        <div>
                            <div class="item-title">${s.title}</div>
                            <div class="item-sub">${s.platform || 'Sin plataforma'} · ${s.status}${s.startDate ? ' · Inicio: ' + s.startDate : ''}${s.endDate ? ' · Fin: ' + s.endDate : ''}</div>
                            <span class="status-badge ${getStatusClass(s.status)}">${s.status}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon edit" onclick="openEditModal(${s.id})">✏️</button>
                            <button class="btn-icon delete" onclick="deleteItem('series', ${s.id})">🗑</button>
                        </div>
                    </div>
                </div>`;
            });

            return html;
        }

        function renderMovies() {
            if (!movies.length) {
                return `<div class="empty-state"><div class="empty-icon">🎬</div><b>Sin películas</b><br><span style="font-size:13px">Pulsa "+ Nuevo" para empezar</span></div>`;
            }

            const sorted = [...movies].sort((a, b) => {
                if (a.watchDate && b.watchDate) return b.watchDate.localeCompare(a.watchDate);
                if (a.watchDate) return -1;
                if (b.watchDate) return 1;
                return 0;
            });

            sorted.forEach(m => {
                const stars = m.rating ? '⭐'.repeat(m.rating) : '';
                html += `
                <div class="card">
                    <div class="item-row">
                        <div>
                            <div class="item-title">${m.title} ${m.year ? '(' + m.year + ')' : ''}</div>
                            <div class="item-sub">${m.watchDate ? 'Vista: ' + m.watchDate : 'Sin fecha'}${stars ? ' · ' + stars : ''}</div>
                            ${m.rating ? `<span class="status-badge status-completed">${m.rating} ⭐</span>` : ''}
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon edit" onclick="openEditModal(${m.id})">✏️</button>
                            <button class="btn-icon delete" onclick="deleteItem('movies', ${m.id})">🗑</button>
                        </div>
                    </div>
                </div>`;
            });

            return html;
        }

        function renderGoals() {
            if (!goals.length) {
                return `<div class="empty-state"><div class="empty-icon">🎯</div><b>Sin objetivos</b><br><span style="font-size:13px">Pulsa "+ Nuevo" para empezar</span></div>`;
            }

            const categories = ['Corto plazo', 'Medio plazo', 'Largo plazo'];
            let html = '';

            categories.forEach(cat => {
                const filtered = goals.filter(g => g.category === cat);
                if (!filtered.length) return;

                html += `<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:800;margin-bottom:8px;color:#64748b">${cat}</div>`;

                filtered.forEach(g => {
                    const pct = g.total > 0 ? Math.min(100, Math.round((g.current / g.total) * 100)) : 0;
                    const color = pct >= 100 ? '#16a34a' : pct >= 50 ? '#d97706' : '#2563eb';

                    html += `
                    <div class="card">
                        <div class="item-row">
                            <div style="flex:1">
                                <div class="item-title">${g.title}</div>
                                <div class="item-sub">${g.current} / ${g.total}${g.deadline ? ' · Límite: ' + g.deadline : ''}</div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width:${pct}%;background:${color}"></div>
                                </div>
                                <div class="progress-text">${pct}% completado</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn-icon edit" onclick="openEditModal(${g.id})">✏️</button>
                                <button class="btn-icon delete" onclick="deleteItem('goals', ${g.id})">🗑</button>
                            </div>
                        </div>
                    </div>`;
                });

                html += `</div>`;
            });

            return html;
        }

        // ==================== FILTERS ====================
        function filterGames(status) {
            window._gameFilter = status;
            render();
            document.querySelectorAll('#content .filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`#content .filter-btn[onclick*="'${status}'"]`)?.classList.add('active');
        }

        function filterBooks(status) {
            window._bookFilter = status;
            render();
            document.querySelectorAll('#content .filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`#content .filter-btn[onclick*="'${status}'"]`)?.classList.add('active');
        }

        function filterSeries(status) {
            window._seriesFilter = status;
            render();
            document.querySelectorAll('#content .filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`#content .filter-btn[onclick*="'${status}'"]`)?.classList.add('active');
        }

        // ==================== INIT ====================
        function init() {
            loadTheme();
            loadData();
            render();
            updateHeader();
        }

        init();

        // ==================== GLOBAL VARIABLES FOR FILTERS ====================
        window._gameFilter = 'all';
        window._bookFilter = 'all';
        window._seriesFilter = 'all';
    </script>

</body>
</html>
