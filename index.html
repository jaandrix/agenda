<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bitácora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.light {
            background: #f5f5f7;
            color: #1c1c1e;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            display: flex;
            height: 100dvh;
            margin: 0 auto;
            max-width: 1100px;
            background: #0a0a0f;
            transition: background 0.25s ease;
        }
        body.light #app {
            background: #f5f5f7;
        }

        /* ===== SIDEBAR (escritorio) ===== */
        #sidebar {
            width: 220px;
            min-width: 220px;
            background: #12121f;
            border-right: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 16px 16px;
            flex-shrink: 0;
            transition: background 0.25s ease, border-color 0.25s ease;
            overflow-y: auto;
        }
        body.light #sidebar {
            background: #ffffff;
            border-right-color: #e2e8f0;
        }

        /* Sidebar - Brand */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 4px;
        }
        .sidebar-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: #e2e8f0;
            border-radius: 8px;
            flex-shrink: 0;
        }
        body.light .sidebar-brand .brand-icon {
            background: #1c1c1e;
        }
        .sidebar-brand .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Sidebar - Search */
        .sidebar-search {
            position: relative;
            margin-bottom: 20px;
        }
        .sidebar-search input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border-radius: 10px;
            border: 1px solid #2a2a3a;
            background: #1a1a2e;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .sidebar-search input::placeholder {
            color: #6b7280;
        }
        .sidebar-search input:focus {
            border-color: #e2e8f0;
        }
        .sidebar-search .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 16px;
            pointer-events: none;
        }
        body.light .sidebar-search input {
            background: #f0f0f2;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light .sidebar-search input::placeholder {
            color: #8e8e93;
        }
        body.light .sidebar-search input:focus {
            border-color: #1c1c1e;
        }

        /* Sidebar - Nav */
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6b7280;
            padding: 12px 8px 6px 8px;
        }
        body.light .sidebar-nav .nav-label {
            color: #8e8e93;
        }

        .sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        .sidebar-nav button.active {
            background: #2a2a3a;
            color: #e2e8f0;
        }
        body.light .sidebar-nav button {
            color: #6b7280;
        }
        body.light .sidebar-nav button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }
        body.light .sidebar-nav button.active {
            background: #e2e8f0;
            color: #1c1c1e;
        }

        .sidebar-nav button .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav button .nav-text {
            flex: 1;
        }

        /* Sidebar - Footer actions */
        .sidebar-actions {
            border-top: 1px solid #2a2a3a;
            padding-top: 12px;
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        body.light .sidebar-actions {
            border-top-color: #e2e8f0;
        }

        .sidebar-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .sidebar-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light .sidebar-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        /* ===== MAIN CONTENT ===== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0a0a0f;
            transition: background 0.25s ease;
        }
        body.light #main {
            background: #f5f5f7;
        }

        /* ===== HEADER (dentro de main) ===== */
        #main-header {
            padding: 24px 32px 16px 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a2e;
            transition: border-color 0.25s ease;
        }
        body.light #main-header {
            border-bottom-color: #e2e8f0;
        }

        #main-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        #main-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-primary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #e2e8f0;
            color: #0a0a0f;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        body.light .btn-primary {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .btn-secondary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #8e8e93;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        body.light .btn-secondary {
            border-color: #e2e8f0;
            color: #6b7280;
        }
        body.light .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1c1c1e;
        }

        /* ===== CONTENT AREA ===== */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 32px 32px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== MOBILE NAV (solo visible en móvil) ===== */
        #mobile-nav {
            display: none;
            flex-shrink: 0;
            background: #12121f;
            border-top: 1px solid #2a2a3a;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        body.light #mobile-nav {
            background: #ffffff;
            border-top-color: #e2e8f0;
        }

        #mobile-nav .mobile-nav-inner {
            display: flex;
            justify-content: space-around;
            padding: 6px 8px 4px 8px;
        }

        #mobile-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.15s ease;
            border-radius: 8px;
        }
        #mobile-nav button .nav-icon {
            font-size: 20px;
        }
        #mobile-nav button.active {
            color: #e2e8f0;
        }
        body.light #mobile-nav button.active {
            color: #1c1c1e;
        }

        /* ============================================================
               RESPONSIVE
            ============================================================ */

        /* Móvil: ocultar sidebar, mostrar mobile-nav */
        @media (max-width: 768px) {
            #sidebar {
                display: none !important;
            }
            #mobile-nav {
                display: block !important;
            }
            #main-header {
                padding: 16px 16px 12px 16px;
            }
            #main-header h1 {
                font-size: 18px;
            }
            #content {
                padding: 16px;
            }
            #app {
                max-width: 100%;
            }
            .btn-primary {
                font-size: 12px;
                padding: 6px 14px;
            }
            .btn-secondary {
                font-size: 11px;
                padding: 4px 10px;
            }
            /* Ocultar botones de acción en móvil dentro del header */
            #main-header .header-actions .btn-secondary {
                display: none;
            }
        }

        /* Tablets / escritorio pequeño */
        @media (min-width: 769px) and (max-width: 1024px) {
            #sidebar {
                width: 200px;
                min-width: 200px;
            }
            #app {
                max-width: 100%;
            }
            #main-header {
                padding: 20px 24px 14px 24px;
            }
            #content {
                padding: 20px 24px 24px 24px;
            }
        }

        /* Escritorio grande */
        @media (min-width: 1025px) {
            #app {
                max-width: 1200px;
            }
            #sidebar {
                width: 240px;
                min-width: 240px;
            }
        }

        /* ===== CALENDAR STYLES (dentro de content) ===== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-header .month-label {
            font-size: 17px;
            font-weight: 700;
        }
        .calendar-nav-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 12px;
            color: #6b7280;
            transition: color 0.15s ease;
        }
        .calendar-nav-btn:hover {
            color: #e2e8f0;
        }
        body.light .calendar-nav-btn {
            color: #8e8e93;
        }
        body.light .calendar-nav-btn:hover {
            color: #1c1c1e;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6b7280;
            padding: 6px 0 10px 0;
            letter-spacing: 0.5px;
        }
        body.light .calendar-day-header {
            color: #8e8e93;
        }

        .calendar-day {
            background: #12121f;
            border-radius: 10px;
            padding: 6px 4px 8px 4px;
            min-height: 64px;
            text-align: center;
            border: 1px solid transparent;
            transition: background 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
        }
        .calendar-day:hover {
            background: #1a1a2e;
        }
        body.light .calendar-day {
            background: #ffffff;
            border-color: #e2e8f0;
        }
        body.light .calendar-day:hover {
            background: #f5f5f7;
        }

        .calendar-day.empty {
            background: transparent;
            border-color: transparent;
        }
        .calendar-day.empty:hover {
            background: transparent;
        }
        body.light .calendar-day.empty {
            background: transparent;
        }

        .calendar-day.today {
            border-color: #e2e8f0;
        }
        body.light .calendar-day.today {
            border-color: #1c1c1e;
        }

        .calendar-day .day-number {
            font-size: 13px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .calendar-day .day-bars {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }

        .calendar-day .day-bar {
            width: 20px;
            height: 3px;
            border-radius: 4px;
            display: block;
        }

        /* ===== ENTRIES LIST ===== */
        .entries-section {
            margin-top: 20px;
        }
        .entries-section .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            margin-bottom: 10px;
        }
        body.light .entries-section .section-title {
            color: #8e8e93;
        }

        .entry-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
            cursor: pointer;
            transition: background 0.15s ease;
            border-radius: 6px;
            padding: 8px 8px;
        }
        .entry-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        body.light .entry-item {
            border-bottom-color: #e2e8f0;
        }
        body.light .entry-item:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .entry-item:last-child {
            border-bottom: none;
        }

        .entry-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .entry-info {
            flex: 1;
            min-width: 0;
        }
        .entry-info .entry-title {
            font-weight: 600;
            font-size: 14px;
        }
        .entry-info .entry-meta {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        body.light .entry-info .entry-meta {
            color: #8e8e93;
        }

        .entry-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .entry-actions button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            color: #6b7280;
            transition: all 0.15s ease;
        }
        .entry-actions button:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
        }
        .entry-actions button.delete {
            color: #dc2626;
        }
        body.light .entry-actions button:hover {
            color: #1c1c1e;
            background: rgba(0, 0, 0, 0.05);
        }
        body.light .entry-actions button.delete {
            color: #dc2626;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #6b7280;
        }
        body.light .empty-state {
            color: #8e8e93;
        }
        .empty-state .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        .empty-state .empty-title {
            font-weight: 700;
            font-size: 16px;
            color: #e2e8f0;
        }
        body.light .empty-state .empty-title {
            color: #1c1c1e;
        }
        .empty-state .empty-sub {
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-sheet {
            background: #12121f;
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90dvh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: background 0.25s ease;
        }
        body.light .modal-sheet {
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 0 4px;
        }
        body.light .modal-close {
            color: #8e8e93;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6b7280;
            display: block;
            margin-bottom: 4px;
        }
        body.light .modal-label {
            color: #8e8e93;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a3a;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            background: #1a1a2e;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.15s ease;
            margin-bottom: 12px;
        }
        .modal-input:focus {
            border-color: #e2e8f0;
        }
        body.light .modal-input {
            background: #f5f5f7;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light .modal-input:focus {
            border-color: #1c1c1e;
        }
        .modal-input::placeholder {
            color: #6b7280;
        }
        body.light .modal-input::placeholder {
            color: #8e8e93;
        }

        .modal-row {
            display: flex;
            gap: 10px;
        }
        .modal-row>* {
            flex: 1;
        }

        .modal-color-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .modal-color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .modal-color-option:hover {
            transform: scale(1.05);
        }
        .modal-color-option.selected {
            border-color: #e2e8f0;
            transform: scale(1.1);
        }
        body.light .modal-color-option.selected {
            border-color: #1c1c1e;
        }

        .btn-modal-primary {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #e2e8f0;
            color: #0a0a0f;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 4px;
        }
        .btn-modal-primary:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-primary {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .btn-modal-danger {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #2a1515;
            color: #dc2626;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 6px;
        }
        .btn-modal-danger:hover {
            opacity: 0.85;
        }
        body.light .btn-modal-danger {
            background: #fee2e2;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            background: #e2e8f0;
            color: #0a0a0f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #toast.show {
            opacity: 1;
        }
        body.light #toast {
            background: #1c1c1e;
            color: #f5f5f7;
        }
        #toast.error {
            background: #dc2626;
            color: #fff;
        }

        /* ===== MOBILE SEARCH OVERLAY ===== */
        #mobile-search {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 150;
            padding: 16px;
            flex-direction: column;
        }
        #mobile-search.open {
            display: flex;
        }
        body.light #mobile-search {
            background: #f5f5f7;
        }

        #mobile-search .search-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        #mobile-search .search-header input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            background: #12121f;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            outline: none;
        }
        #mobile-search .search-header input:focus {
            border-color: #e2e8f0;
        }
        body.light #mobile-search .search-header input {
            background: #ffffff;
            border-color: #e2e8f0;
            color: #1c1c1e;
        }
        body.light #mobile-search .search-header input:focus {
            border-color: #1c1c1e;
        }

        #mobile-search .search-results {
            flex: 1;
            overflow-y: auto;
        }

        .search-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #e2e8f0;
            cursor: pointer;
        }
        body.light .search-close {
            color: #1c1c1e;
        }

        /* ============================================================
               SCROLLBAR
            ============================================================ */
        #content::-webkit-scrollbar,
        .modal-sheet::-webkit-scrollbar,
        #sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #content::-webkit-scrollbar-track,
        .modal-sheet::-webkit-scrollbar-track,
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #content::-webkit-scrollbar-thumb,
        .modal-sheet::-webkit-scrollbar-thumb,
        #sidebar::-webkit-scrollbar-thumb {
            background: #3a3a5c;
            border-radius: 4px;
        }
        body.light #content::-webkit-scrollbar-thumb,
        body.light .modal-sheet::-webkit-scrollbar-thumb,
        body.light #sidebar::-webkit-scrollbar-thumb {
            background: #d1d1d6;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- ===== SIDEBAR ===== -->
        <div id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"></div>
                <span class="brand-name">Bitácora</span>
            </div>

            <div class="sidebar-search" id="desktop-search">
                <span class="search-icon">⌕</span>
                <input type="text" placeholder="Buscar..." oninput="filterEntries(this.value)">
            </div>

            <div class="sidebar-nav">
                <button class="active" onclick="switchView('calendar')" data-view="calendar">
                    <span class="nav-icon">□</span>
                    <span class="nav-text">Inicio</span>
                </button>
                <button onclick="switchView('calendar')" data-view="calendar">
                    <span class="nav-icon">◷</span>
                    <span class="nav-text">Calendario</span>
                </button>
                <button onclick="switchView('stats')" data-view="stats">
                    <span class="nav-icon">▦</span>
                    <span class="nav-text">Estadísticas</span>
                </button>

                <span class="nav-label">Registro</span>
                <button onclick="switchView('entries')" data-view="entries">
                    <span class="nav-icon">✦</span>
                    <span class="nav-text">Todas las entradas</span>
                </button>
                <button onclick="switchView('categories')" data-view="categories">
                    <span class="nav-icon">🏷</span>
                    <span class="nav-text">Categorías</span>
                </button>
            </div>

            <div class="sidebar-actions">
                <button onclick="exportData()" title="Exportar">⬇</button>
                <button onclick="document.getElementById('import-input').click()" title="Importar">⬆</button>
                <button onclick="toggleTheme()" id="theme-btn" title="Tema">◐</button>
                <button onclick="toggleMode()" id="mode-btn" title="Modo">⊞</button>
            </div>
        </div>

        <!-- ===== MAIN ===== -->
        <div id="main">
            <!-- Header -->
            <div id="main-header">
                <h1 id="page-title">Inicio</h1>
                <div class="header-actions">
                    <button class="btn-secondary" onclick="openNewEntry()">+ Nueva entrada</button>
                    <button class="btn-secondary" onclick="toggleMobileSearch()" id="mobile-search-btn" style="display:none">⌕</button>
                </div>
            </div>

            <!-- Content -->
            <div id="content"></div>

            <!-- Mobile Nav -->
            <div id="mobile-nav">
                <div class="mobile-nav-inner">
                    <button class="active" onclick="switchView('calendar')" data-view="calendar">
                        <span class="nav-icon">□</span>
                        <span>Inicio</span>
                    </button>
                    <button onclick="switchView('calendar')" data-view="calendar">
                        <span class="nav-icon">◷</span>
                        <span>Calendario</span>
                    </button>
                    <button onclick="switchView('stats')" data-view="stats">
                        <span class="nav-icon">▦</span>
                        <span>Estadísticas</span>
                    </button>
                    <button onclick="switchView('entries')" data-view="entries">
                        <span class="nav-icon">✦</span>
                        <span>Entradas</span>
                    </button>
                    <button onclick="switchView('categories')" data-view="categories">
                        <span class="nav-icon">🏷</span>
                        <span>Categorías</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MOBILE SEARCH OVERLAY ===== -->
    <div id="mobile-search">
        <div class="search-header">
            <input type="text" placeholder="Buscar..." id="mobile-search-input" oninput="filterEntriesMobile(this.value)">
            <button class="search-close" onclick="toggleMobileSearch()">✕</button>
        </div>
        <div class="search-results" id="mobile-search-results"></div>
    </div>

    <!-- ===== MODAL ===== -->
    <div id="modal-container"></div>

    <!-- ===== TOAST ===== -->
    <div id="toast"></div>

    <!-- ===== IMPORT INPUT ===== -->
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        let entries = [];
        let categories = [];
        let filteredEntries = [];

        const DEFAULT_COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
            '#1abc9c', '#e67e22', '#e84393', '#00b894', '#6c5ce7',
            '#fd79a8', '#0984e3', '#fdcb6e', '#00cec9', '#a29bfe'
        ];

        function getDefaultCategories() {
            return [
                { id: 'cat_videojuego', name: 'Videojuego', color: '#e74c3c' },
                { id: 'cat_libro', name: 'Libro', color: '#3498db' },
                { id: 'cat_serie', name: 'Serie', color: '#9b59b6' },
                { id: 'cat_pelicula', name: 'Película', color: '#f39c12' },
                { id: 'cat_musica', name: 'Música', color: '#1abc9c' },
                { id: 'cat_trabajo', name: 'Trabajo', color: '#e67e22' },
                { id: 'cat_proyecto', name: 'Proyecto', color: '#00b894' },
                { id: 'cat_objetivo', name: 'Objetivo', color: '#6c5ce7' },
                { id: 'cat_viaje', name: 'Viaje', color: '#e84393' },
                { id: 'cat_finanzas', name: 'Finanzas', color: '#2ecc71' },
            ];
        }

        // ============================================================
        //  LOAD / SAVE
        // ============================================================
        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('bitacora_data') || '{}');
                entries = saved.entries || [];
                categories = saved.categories || getDefaultCategories();
            } catch (e) {
                entries = [];
                categories = getDefaultCategories();
            }
            if (!categories || categories.length === 0) {
                categories = getDefaultCategories();
            }
            categories.forEach(c => {
                if (!c.id) c.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            });
            filteredEntries = [...entries];
            updateHeader();
        }

        function saveData() {
            localStorage.setItem('bitacora_data', JSON.stringify({ entries, categories }));
            updateHeader();
        }

        // ============================================================
        //  THEME / MODE
        // ============================================================
        function loadTheme() {
            const theme = localStorage.getItem('bitacora_theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light');
                document.getElementById('theme-btn').textContent = '◐';
            } else {
                document.body.classList.remove('light');
                document.getElementById('theme-btn').textContent = '◐';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            localStorage.setItem('bitacora_theme', isLight ? 'light' : 'dark');
        }

        function toggleMode() {
            const app = document.getElementById('app');
            const isDesktop = app.style.maxWidth !== '100%' || app.style.maxWidth === '';
            if (isDesktop) {
                app.style.maxWidth = '100%';
                document.getElementById('mode-btn').textContent = '⊞';
            } else {
                app.style.maxWidth = '1200px';
                document.getElementById('mode-btn').textContent = '⊞';
            }
            // Toggle entre ancho fijo y fluido
            const currentMax = app.style.maxWidth;
            if (currentMax === '100%') {
                app.style.maxWidth = '1200px';
            } else {
                app.style.maxWidth = '100%';
            }
        }

        // ============================================================
        //  HEADER
        // ============================================================
        function updateHeader() {
            const total = entries.length;
            document.querySelector('#main-header h1').textContent =
                document.querySelector('#main-header h1').textContent || 'Inicio';
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = isError ? 'error' : '';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-nav button, #mobile-nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            // Actualizar título
            const titles = {
                'calendar': 'Inicio',
                'stats': 'Estadísticas',
                'entries': 'Todas las entradas',
                'categories': 'Categorías'
            };
            document.getElementById('page-title').textContent = titles[view] || 'Inicio';
            render();
        }

        // ============================================================
        //  SEARCH
        // ============================================================
        function filterEntries(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                filteredEntries = [...entries];
            } else {
                filteredEntries = entries.filter(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    return e.title.toLowerCase().includes(q) ||
                        (cat && cat.name.toLowerCase().includes(q)) ||
                        (e.notes && e.notes.toLowerCase().includes(q));
                });
            }
            render();
        }

        function filterEntriesMobile(query) {
            const q = query.toLowerCase().trim();
            const results = document.getElementById('mobile-search-results');
            if (!q) {
                results.innerHTML = '<div style="color:#6b7280;padding:20px;text-align:center">Escribe para buscar</div>';
                return;
            }
            const filtered = entries.filter(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                return e.title.toLowerCase().includes(q) ||
                    (cat && cat.name.toLowerCase().includes(q)) ||
                    (e.notes && e.notes.toLowerCase().includes(q));
            });
            if (!filtered.length) {
                results.innerHTML = '<div style="color:#6b7280;padding:20px;text-align:center">Sin resultados</div>';
                return;
            }
            let html = '';
            filtered.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                html += `
                    <div class="entry-item" onclick="openEditEntry(${e.id});toggleMobileSearch()">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${e.date} · ${cat?.name || 'Sin categoría'}</div>
                        </div>
                    </div>`;
            });
            results.innerHTML = html;
        }

        function toggleMobileSearch() {
            const el = document.getElementById('mobile-search');
            el.classList.toggle('open');
            if (el.classList.contains('open')) {
                document.getElementById('mobile-search-input').focus();
                document.getElementById('mobile-search-results').innerHTML =
                    '<div style="color:#6b7280;padding:20px;text-align:center">Escribe para buscar</div>';
            }
        }

        // ============================================================
        //  MODAL
        // ============================================================
        let editingEntryId = null;

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            editingEntryId = null;
        }

        function openNewEntry() {
            editingEntryId = null;
            document.getElementById('modal-container').innerHTML = renderEntryModal(null);
        }

        function openEditEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editingEntryId = id;
            document.getElementById('modal-container').innerHTML = renderEntryModal(entry);
        }

        function renderEntryModal(entry) {
            const isEdit = !!entry;
            const title = isEdit ? 'Editar entrada' : 'Nueva entrada';
            const today = new Date().toISOString().slice(0, 10);

            const catOptions = categories.map(c =>
                `<option value="${c.id}" ${isEdit && entry.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            const colorOptions = DEFAULT_COLORS.map(c =>
                `<div class="modal-color-option" style="background:${c}" data-color="${c}" onclick="selectColor(this, '${c}')"></div>`
            ).join('');

            const currentColor = isEdit ?
                (categories.find(c => c.id === entry.categoryId)?.color || '#e74c3c') :
                '#e74c3c';

            return `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                <div class="modal-sheet">
                    <div class="modal-title">
                        ${title}
                        <button class="modal-close" onclick="closeModal()">✕</button>
                    </div>

                    <div class="modal-label">Fecha</div>
                    <input type="date" id="modal-date" class="modal-input" value="${isEdit ? entry.date : today}">

                    <div class="modal-label">Título</div>
                    <input id="modal-title" class="modal-input" placeholder="Ej: Empecé The Witcher 3" value="${isEdit ? entry.title : ''}">

                    <div class="modal-label">Categoría</div>
                    <select id="modal-category" class="modal-input" onchange="onCategoryChange(this.value)">
                        ${catOptions}
                        <option value="__new">+ Crear nueva categoría</option>
                    </select>

                    <div id="new-category-fields" style="display:none">
                        <div class="modal-label">Nombre de la nueva categoría</div>
                        <input id="modal-new-cat-name" class="modal-input" placeholder="Ej: Podcast">

                        <div class="modal-label">Color</div>
                        <div class="modal-color-grid" id="color-picker">
                            ${colorOptions}
                        </div>
                        <input type="hidden" id="modal-new-cat-color" value="${currentColor}">
                    </div>

                    <div class="modal-label">Notas</div>
                    <textarea id="modal-notes" class="modal-input" rows="2" placeholder="Detalles adicionales...">${isEdit ? (entry.notes || '') : ''}</textarea>

                    <button class="btn-modal-primary" onclick="saveEntry()">Guardar</button>
                    ${isEdit ? `<button class="btn-modal-danger" onclick="deleteEntry(${entry.id})">Eliminar entrada</button>` : ''}
                </div>
            </div>`;
        }

        let selectedColor = '#e74c3c';

        function selectColor(el, color) {
            selectedColor = color;
            document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('modal-new-cat-color').value = color;
        }

        function onCategoryChange(value) {
            const fields = document.getElementById('new-category-fields');
            if (value === '__new') {
                fields.style.display = 'block';
                const firstColor = document.querySelector('.modal-color-option');
                if (firstColor) {
                    document.querySelectorAll('.modal-color-option').forEach(c => c.classList.remove('selected'));
                    firstColor.classList.add('selected');
                    document.getElementById('modal-new-cat-color').value = firstColor.dataset.color;
                }
            } else {
                fields.style.display = 'none';
            }
        }

        // ============================================================
        //  SAVE ENTRY
        // ============================================================
        function saveEntry() {
            const date = document.getElementById('modal-date').value;
            if (!date) { showToast('Selecciona una fecha', true); return; }

            const title = document.getElementById('modal-title').value.trim();
            if (!title) { showToast('Escribe un título', true); return; }

            let categoryId = document.getElementById('modal-category').value;
            const notes = document.getElementById('modal-notes').value.trim();

            if (categoryId === '__new') {
                const newCatName = document.getElementById('modal-new-cat-name').value.trim();
                if (!newCatName) { showToast('Escribe un nombre para la categoría', true); return; }
                const color = document.getElementById('modal-new-cat-color').value || '#e74c3c';
                const newCat = { id: 'cat_' + Date.now(), name: newCatName, color: color };
                categories.push(newCat);
                categoryId = newCat.id;
                saveData();
            }

            const entry = {
                id: editingEntryId || Date.now(),
                date: date,
                title: title,
                categoryId: categoryId,
                notes: notes
            };

            if (editingEntryId) {
                const idx = entries.findIndex(e => e.id === editingEntryId);
                if (idx >= 0) entries[idx] = entry;
            } else {
                entries.push(entry);
            }

            entries.sort((a, b) => b.date.localeCompare(a.date));
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Entrada guardada');
        }

        // ============================================================
        //  DELETE
        // ============================================================
        function deleteEntry(id) {
            if (!confirm('¿Eliminar esta entrada?')) return;
            entries = entries.filter(e => e.id !== id);
            filteredEntries = [...entries];
            saveData();
            closeModal();
            render();
            showToast('Eliminada');
        }

        function deleteCategory(id) {
            const hasEntries = entries.some(e => e.categoryId === id);
            if (hasEntries) {
                if (!confirm('Esta categoría tiene entradas. ¿Eliminar la categoría y todas sus entradas?')) return;
                entries = entries.filter(e => e.categoryId !== id);
            } else {
                if (!confirm('¿Eliminar esta categoría?')) return;
            }
            categories = categories.filter(c => c.id !== id);
            filteredEntries = [...entries];
            saveData();
            render();
            showToast('Categoría eliminada');
        }

        // ============================================================
        //  EXPORT / IMPORT
        // ============================================================
        function exportData() {
            const data = { entries, categories };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bitacora_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exportado');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entries) entries = data.entries;
                    if (data.categories) categories = data.categories;
                    filteredEntries = [...entries];
                    saveData();
                    render();
                    showToast('Importado correctamente');
                } catch (err) {
                    showToast('Error al importar', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function render() {
            const content = document.getElementById('content');
            if (currentView === 'calendar') {
                content.innerHTML = renderCalendar();
            } else if (currentView === 'stats') {
                content.innerHTML = renderStats();
            } else if (currentView === 'entries') {
                content.innerHTML = renderEntries();
            } else if (currentView === 'categories') {
                content.innerHTML = renderCategories();
            }
        }

        // ============================================================
        //  RENDER: CALENDAR
        // ============================================================
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function renderCalendar() {
            const entriesByDate = {};
            entries.forEach(e => {
                if (!entriesByDate[e.date]) entriesByDate[e.date] = [];
                entriesByDate[e.date].push(e);
            });

            const today = new Date().toISOString().slice(0, 10);
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const offset = (firstDay + 6) % 7;

            const prevMonth = new Date(calYear, calMonth, 0);
            const daysInPrevMonth = prevMonth.getDate();

            let html = `
            <div class="calendar-header">
                <button class="calendar-nav-btn" onclick="changeMonth(-1)">‹</button>
                <span class="month-label">${monthNames[calMonth]} ${calYear}</span>
                <button class="calendar-nav-btn" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid">`;

            dayNames.forEach(d => {
                html += `<div class="calendar-day-header">${d}</div>`;
            });

            for (let i = 0; i < offset; i++) {
                const day = daysInPrevMonth - offset + i + 1;
                html += `<div class="calendar-day empty"><span class="day-number" style="opacity:0.3">${day}</span></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayEntries = entriesByDate[dateStr] || [];

                const colors = [];
                const seen = new Set();
                dayEntries.forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    if (cat && !seen.has(cat.color)) {
                        seen.add(cat.color);
                        colors.push(cat.color);
                    }
                });

                const barsHtml = colors.slice(0, 4).map(color =>
                    `<span class="day-bar" style="background:${color}"></span>`
                ).join('');

                const extra = colors.length > 4 ?
                    `<span class="day-bar" style="background:#6b7280;width:12px;height:3px;border-radius:4px;display:block;font-size:7px;text-align:center">+${colors.length - 4}</span>` :
                    '';

                html += `
                <div class="calendar-day ${isToday ? 'today' : ''}" onclick="showDayEntries('${dateStr}')">
                    <span class="day-number">${d}</span>
                    <div class="day-bars">
                        ${barsHtml}
                        ${extra}
                    </div>
                </div>`;
            }

            const totalDays = offset + daysInMonth;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="calendar-day empty"><span class="day-number" style="opacity:0.3">${d}</span></div>`;
            }

            html += `</div>`;

            if (window._selectedDate) {
                html += renderDayEntries(window._selectedDate);
            }

            return html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11;
                calYear--; }
            if (calMonth > 11) { calMonth = 0;
                calYear++; }
            render();
        }

        function showDayEntries(date) {
            window._selectedDate = date;
            render();
        }

        function renderDayEntries(date) {
            const dayEntries = entries.filter(e => e.date === date);
            if (!dayEntries.length) return '';

            const dateObj = new Date(date + 'T12:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateLabel = dateObj.toLocaleDateString('es-ES', options);

            let html = `
            <div class="entries-section">
                <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
                    <span>${dateLabel}</span>
                    <button class="btn-secondary" onclick="window._selectedDate=null;render()">✕ Cerrar</button>
                </div>`;

            dayEntries.forEach(e => {
                const cat = categories.find(c => c.id === e.categoryId);
                const color = cat?.color || '#6b7280';
                const catName = cat?.name || 'Sin categoría';

                html += `
                <div class="entry-item" onclick="openEditEntry(${e.id})">
                    <div class="entry-color-dot" style="background:${color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${e.title}</div>
                        <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                    </div>
                    <div class="entry-actions">
                        <button onclick="event.stopPropagation();openEditEntry(${e.id})">✎</button>
                        <button class="delete" onclick="event.stopPropagation();deleteEntry(${e.id})">✕</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: STATS
        // ============================================================
        function renderStats() {
            if (!entries.length) {
                return `
                <div class="empty-state">
                    <div class="empty-icon">▦</div>
                    <div class="empty-title">Sin datos</div>
                    <div class="empty-sub">Añade entradas para ver estadísticas</div>
                </div>`;
            }

            const total = entries.length;
            const byCategory = {};
            entries.forEach(e => {
                if (!byCategory[e.categoryId]) byCategory[e.categoryId] = 0;
                byCategory[e.categoryId]++;
            });

            const sortedCats = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);

            let html = `
            <div style="max-width:600px">
                <div style="font-weight:700;font-size:20px;margin-bottom:4px">${total}</div>
                <div style="color:#6b7280;margin-bottom:24px">entradas totales</div>

                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin-bottom:12px">Por categoría</div>`;

            sortedCats.forEach(([catId, count]) => {
                const cat = categories.find(c => c.id === catId);
                const color = cat?.color || '#6b7280';
                const name = cat?.name || 'Sin categoría';
                const pct = Math.round((count / total) * 100);

                html += `
                <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #1a1a2e">
                    <div style="width:12px;height:12px;border-radius:50%;background:${color};flex-shrink:0"></div>
                    <div style="flex:1;font-weight:500">${name}</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <div style="width:120px;height:6px;background:#1a1a2e;border-radius:99px;overflow:hidden">
                            <div style="height:100%;width:${pct}%;background:${color};border-radius:99px"></div>
                        </div>
                        <span style="font-weight:600;font-size:13px;min-width:40px;text-align:right">${count}</span>
                    </div>
                </div>`;
            });

            // Entradas por mes (últimos 6)
            const monthCount = {};
            entries.forEach(e => {
                const m = e.date.slice(0, 7);
                if (!monthCount[m]) monthCount[m] = 0;
                monthCount[m]++;
            });

            const sortedMonths = Object.keys(monthCount).sort().slice(-6);
            if (sortedMonths.length) {
                const maxMonth = Math.max(...Object.values(monthCount));
                html += `
                <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:24px 0 12px 0">Entradas por mes</div>
                <div style="display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px">`;

                sortedMonths.forEach(m => {
                    const count = monthCount[m] || 0;
                    const pct = maxMonth > 0 ? (count / maxMonth) * 100 : 0;
                    const [year, month] = m.split('-');
                    const label = `${month}/${year.slice(2)}`;

                    html += `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                        <div style="font-weight:600;font-size:13px">${count}</div>
                        <div style="width:100%;height:${Math.max(4, pct)}px;background:#3a3a5c;border-radius:4px 4px 0 0;min-height:4px"></div>
                        <div style="font-size:10px;color:#6b7280">${label}</div>
                    </div>`;
                });

                html += `</div>`;
            }

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: ENTRIES
        // ============================================================
        function renderEntries() {
            const list = filteredEntries.length ? filteredEntries : entries;

            if (!list.length) {
                return `
                <div class="empty-state">
                    <div class="empty-icon">✦</div>
                    <div class="empty-title">No hay entradas</div>
                    <div class="empty-sub">${filteredEntries.length === 0 && entries.length > 0 ? 'La búsqueda no coincide con ninguna entrada' : 'Pulsa "+ Nueva entrada" para empezar'}</div>
                </div>`;
            }

            const grouped = {};
            list.forEach(e => {
                if (!grouped[e.date]) grouped[e.date] = [];
                grouped[e.date].push(e);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            let html = `<div class="entries-section">`;

            sortedDates.forEach(date => {
                const dateObj = new Date(date + 'T12:00:00');
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                const dateLabel = dateObj.toLocaleDateString('es-ES', options);

                html += `
                <div style="margin-bottom:4px;font-weight:700;font-size:13px;color:#6b7280;padding:8px 0 4px 0;border-bottom:1px solid #1a1a2e">
                    ${dateLabel}
                </div>`;

                grouped[date].forEach(e => {
                    const cat = categories.find(c => c.id === e.categoryId);
                    const color = cat?.color || '#6b7280';
                    const catName = cat?.name || 'Sin categoría';

                    html += `
                    <div class="entry-item" onclick="openEditEntry(${e.id})">
                        <div class="entry-color-dot" style="background:${color}"></div>
                        <div class="entry-info">
                            <div class="entry-title">${e.title}</div>
                            <div class="entry-meta">${catName}${e.notes ? ' · ' + e.notes : ''}</div>
                        </div>
                        <div class="entry-actions">
                            <button onclick="event.stopPropagation();openEditEntry(${e.id})">✎</button>
                            <button class="delete" onclick="event.stopPropagation();deleteEntry(${e.id})">✕</button>
                        </div>
                    </div>`;
                });
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  RENDER: CATEGORIES
        // ============================================================
        function renderCategories() {
            if (!categories.length) {
                return `
                <div class="empty-state">
                    <div class="empty-icon">🏷</div>
                    <div class="empty-title">Sin categorías</div>
                    <div class="empty-sub">Crea una categoría al añadir una entrada</div>
                </div>`;
            }

            let html = `
            <div class="entries-section">
                <div class="section-title">Gestionar categorías</div>
                <div style="margin-bottom:12px;font-size:12px;color:#6b7280">Las categorías con entradas no se pueden eliminar sin antes eliminar las entradas asociadas.</div>`;

            categories.forEach(c => {
                const count = entries.filter(e => e.categoryId === c.id).length;
                const hasEntries = count > 0;

                html += `
                <div class="entry-item" style="cursor:default">
                    <div class="entry-color-dot" style="background:${c.color}"></div>
                    <div class="entry-info">
                        <div class="entry-title">${c.name}</div>
                        <div class="entry-meta">${count} entrada${count !== 1 ? 's' : ''}</div>
                    </div>
                    <div class="entry-actions">
                        ${hasEntries ? `<span style="font-size:10px;color:#6b7280;font-weight:600">En uso</span>` : ''}
                        <button class="delete" onclick="deleteCategory('${c.id}')" ${hasEntries ? '' : ''}>✕</button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            return html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            // Detectar móvil para mostrar botón de búsqueda
            if (window.innerWidth <= 768) {
                document.getElementById('mobile-search-btn').style.display = 'inline-block';
            }

            loadTheme();
            loadData();
            render();

            // Cerrar búsqueda móvil al cambiar de vista
            document.querySelectorAll('#mobile-nav button, .sidebar-nav button').forEach(b => {
                b.addEventListener('click', () => {
                    if (document.getElementById('mobile-search').classList.contains('open')) {
                        toggleMobileSearch();
                    }
                });
            });

            // Re-render al cambiar tamaño de ventana
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const isMobile = window.innerWidth <= 768;
                    document.getElementById('mobile-search-btn').style.display = isMobile ? 'inline-block' : 'none';
                }, 200);
            });
        }

        // ============================================================
        //  OVERRIDE PARA QUE LA BÚSQUEDA EN ESCRITORIO FUNCIONE
        // ============================================================
        // La función filterEntries ya está definida arriba

        init();
    </script>

</body>
</html>
